# Project identification
sonar.organization=sysown
sonar.projectKey=sysown
sonar.projectName=ProxySQL
sonar.projectVersion=3.0

# Source code directories
sonar.sources=src,lib,include
sonar.tests=test

# Language
sonar.language=cpp

# C/C++ specific settings
sonar.c.file.suffixes=.c,.h
sonar.cpp.file.suffixes=.cpp,.cc,.cxx,.hpp,.hh,.hxx

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/*.o,**/*.a,**/*.so,**/deps/**,**/build/**,**/vendor/**,**/.git/**,**/node_modules/**

# Test exclusions
sonar.test.exclusions=**/test/**/*.o,**/test/**/*.a

# Coverage reports (if available)
# sonar.cpp.gcov.reportsPath=coverage

# Compilation database (if using compile_commands.json)
# sonar.cfamily.compile-commands=build/compile_commands.json

# Memory settings for C/C++ analysis
sonar.cfamily.threads=4
sonar.cfamily.cache.enabled=true
sonar.cfamily.cache.path=.sonar/cache
