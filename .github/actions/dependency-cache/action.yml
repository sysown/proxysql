name: Exact dependency cache
description: Restore or build, smoke-test, and save content-addressed OpenSSL and DuckDB bundles
inputs:
  source-path:
    description: Product checkout relative to the workspace
    required: true
  service:
    description: Compose build service matching the product build
    default: ubuntu24_dbg_build
  tier:
    description: Product tier (v30, v31, v40)
    default: v40
  sanitizer:
    description: Dependency build instrumentation (none, asan, tsan)
    default: none
  coverage:
    description: Enable coverage in the build environment
    default: 'false'
  dependencies:
    description: Optional explicit space-separated dependency selection
    default: ''
outputs:
  openssl-key:
    description: Exact OpenSSL cache key, empty when unavailable
    value: ${{ steps.keys.outputs.openssl-key }}
  openssl-path:
    description: Workspace-relative directory containing the verified OpenSSL bundle
    value: ${{ steps.keys.outputs.openssl-path }}
  duckdb-key:
    description: Exact DuckDB cache key, empty when unavailable
    value: ${{ steps.keys.outputs.duckdb-key }}
  duckdb-path:
    description: Workspace-relative directory containing the verified DuckDB bundle
    value: ${{ steps.keys.outputs.duckdb-path }}
runs:
  using: composite
  steps:
    - name: Identify dependencies in the build container
      id: keys
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE_PATH: ${{ inputs.source-path }}
        BUILD_SERVICE: ${{ inputs.service }}
        BUILD_TIER: ${{ inputs.tier }}
        BUILD_SANITIZER: ${{ inputs.sanitizer }}
        BUILD_COVERAGE: ${{ inputs.coverage }}
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        python3 "$ACTION_PATH/cache.py" keys --source-path "$SOURCE_PATH" --service "$BUILD_SERVICE" \
          --tier "$BUILD_TIER" --sanitizer "$BUILD_SANITIZER" --coverage "$BUILD_COVERAGE" --dependencies "$DEPENDENCIES"
    - name: Restore exact OpenSSL bundle
      id: openssl
      if: ${{ steps.keys.outputs.openssl-key != '' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.keys.outputs.openssl-key }}
        path: ${{ steps.keys.outputs.openssl-path }}
    - name: Restore exact DuckDB bundle
      id: duckdb
      if: ${{ steps.keys.outputs.duckdb-key != '' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.keys.outputs.duckdb-key }}
        path: ${{ steps.keys.outputs.duckdb-path }}
    - name: Prepare and smoke-test OpenSSL
      id: prepare-openssl
      if: ${{ steps.keys.outputs.selected-openssl == 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE_PATH: ${{ inputs.source-path }}
        BUILD_SERVICE: ${{ inputs.service }}
        BUILD_TIER: ${{ inputs.tier }}
        BUILD_SANITIZER: ${{ inputs.sanitizer }}
        BUILD_COVERAGE: ${{ inputs.coverage }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        CACHE_DEPENDENCY: openssl
        CACHE_HIT: ${{ steps.openssl.outputs.cache-hit }}
        CACHE_MATCHED_KEY: ${{ steps.openssl.outputs.cache-matched-key }}
        CACHE_REQUESTED_KEY: ${{ steps.keys.outputs.openssl-key }}
      run: |
        python3 "$ACTION_PATH/cache.py" prepare --source-path "$SOURCE_PATH" --service "$BUILD_SERVICE" \
          --tier "$BUILD_TIER" --sanitizer "$BUILD_SANITIZER" --coverage "$BUILD_COVERAGE" --dependencies "$DEPENDENCIES"
    - name: Save exact OpenSSL bundle
      if: ${{ success() && github.event_name != 'workflow_run' && steps.prepare-openssl.outputs.ready == 'true' && (steps.openssl.outputs.cache-hit != 'true' || steps.openssl.outputs.cache-matched-key != steps.keys.outputs.openssl-key) }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.keys.outputs.openssl-key }}
        path: ${{ steps.keys.outputs.openssl-path }}
    - name: Prepare and smoke-test DuckDB
      id: prepare-duckdb
      if: ${{ steps.keys.outputs.selected-duckdb == 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE_PATH: ${{ inputs.source-path }}
        BUILD_SERVICE: ${{ inputs.service }}
        BUILD_TIER: ${{ inputs.tier }}
        BUILD_SANITIZER: ${{ inputs.sanitizer }}
        BUILD_COVERAGE: ${{ inputs.coverage }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        CACHE_DEPENDENCY: duckdb
        CACHE_HIT: ${{ steps.duckdb.outputs.cache-hit }}
        CACHE_MATCHED_KEY: ${{ steps.duckdb.outputs.cache-matched-key }}
        CACHE_REQUESTED_KEY: ${{ steps.keys.outputs.duckdb-key }}
      run: |
        python3 "$ACTION_PATH/cache.py" prepare --source-path "$SOURCE_PATH" --service "$BUILD_SERVICE" \
          --tier "$BUILD_TIER" --sanitizer "$BUILD_SANITIZER" --coverage "$BUILD_COVERAGE" --dependencies "$DEPENDENCIES"
    - name: Save exact DuckDB bundle
      if: ${{ success() && github.event_name != 'workflow_run' && steps.prepare-duckdb.outputs.ready == 'true' && (steps.duckdb.outputs.cache-hit != 'true' || steps.duckdb.outputs.cache-matched-key != steps.keys.outputs.duckdb-key) }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.keys.outputs.duckdb-key }}
        path: ${{ steps.keys.outputs.duckdb-path }}
