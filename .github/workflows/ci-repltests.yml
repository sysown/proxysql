name: CI-repltests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string

      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: ''
env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:
  tier-context:
    uses: ./.github/workflows/ci-tier-context.yml
    with:
      trigger: ${{ inputs.trigger }}
      consumer_id: ${{ inputs.consumer_id }}
      control_ref: ${{ inputs.control_ref }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
      consumer_file: ci-repltests.yml
      consumer_inputs: ${{ toJson(inputs) }}
    secrets: inherit
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tier-context.outputs.matrices)['tests'] || fromJson('[{}]') }}
    env:
      TESTDIST: ${{ matrix.testdist }}
      INFRADB: ${{ matrix.infradb }}
      MATRIX: '(${{ matrix.infradb }})'

      SHA: ${{ needs.tier-context.outputs.sha }}
      CI_BINDING: ${{ needs.tier-context.outputs.binding }}
      CI_LEG: ${{ toJson(matrix) }}
      TIER: ${{ matrix.tier }}
      COVERAGE: ${{ matrix.coverage && '1' || '0' }}
    steps:
    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-context.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Start selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y sysbench gettext

#    - name: Wait for cache
#      if: ${{ env.BRANCH != 'none' }}
#      env:
#        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#      run: |
#        echo "Wating for cache '${BLDCACHE}' ..."
#        sleep $(( $RANDOM / 1024 ))
#        PROBE="$(gh cache list --limit 300 --repo ${{ github.repository }} | grep -i ${BLDCACHE} || echo '')"
#        while [[ -z ${PROBE} ]]; do
#          echo "Wating for cache '${BLDCACHE}' ..."
#          sleep 30
#          PROBE="$(gh cache list --limit 300 --repo ${{ github.repository }} | grep -i ${BLDCACHE} || echo '')"
#        done
#        echo "Cache available '${BLDCACHE}'"

    - name: Checkout repl test suite
      # The replication/shunning suite is vendored in-repo at test/repl/ (moved
      # off the private jenkins-build-scripts repo, so no GH_TOKEN_PROXYSQL PAT).
      # Sparse-checkout just that dir into proxysql/; the proxysql binary arrives
      # separately via the build handoff below (unpacked into the same proxysql/).
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: 'proxysql'
        sparse-checkout: |
          test/repl

    - name: Restore selected product handoff
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py restore
    - name: Docker-hoster
      run: |
        cd proxysql/test/repl/infra-docker-hoster
        sed -i 's|image: .*|image: ghcr.io/mrmohebi/docker-hoster|' docker-compose.yml
        docker compose up -d

    - name: Replication-tests
      timeout-minutes: 35
      run: |
        set +e

        # Vendored suite lives at proxysql/test/repl (was jenkins-build-scripts).
        cd proxysql/test/repl
        grep -rl 'docker-compose ' | xargs -r -n1 sed -i 's/docker-compose /docker compose /g'
        sed -i "s|#!/usr/bin/bash|#!/usr/bin/bash +e|" proxysql_repl_tests/bin/debezium-check.bash
        sed -i "s|#!/usr/bin/bash|#!/usr/bin/bash +e|" proxysql_repl_tests/exec_repl_test.sh
        sed -i "s|JENKINS_SCRIPTS_PATH=.*|JENKINS_SCRIPTS_PATH=${{ github.workspace }}/proxysql/test/repl|" env.sh
        sed -i "s|WORKSPACE=.*|WORKSPACE=${{ github.workspace }}/proxysql|" env.sh

        cd proxysql_repl_tests
        #./exec_repl_test.sh 5.7 no-ssl debezium
        RCS=0
        for N in {1..1}; do
          ./exec_all_repl_tests.sh
          RC=$?
          RCS=$(( $RCS + $RC ))
        done

        #./docker-compose-destroy.bash
        sudo chmod -R 777 ${{ github.workspace }}/*
        exit $RCS

    - name: Fix artifact permissions
      if: ${{ failure() && !cancelled() }}
      run: |
        # actions/upload-artifact dies with EACCES when it scandirs into
        # directories under ci_*_logs/ that were created inside docker
        # build containers (root-owned). Make everything readable by the
        # runner user before upload. sudo required because files are
        # root-owned; 2>/dev/null + || true because the path may not
        # exist on all failure paths (e.g. a cache-restore failure before
        # any test even runs).
        sudo chmod -R a+rX proxysql/ci_*_logs/ 2>/dev/null || true

    - name: Archive artifacts logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-logs-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: |
          proxysql/ci_*_logs/

    - name: Archive artifacts bin
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-bin-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: |
          proxysql/binaries/
          proxysql/src/
          proxysql/libs/
#          proxysql/deps/
    - name: Complete selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ always() }}
    needs:
    - tier-context
    name: ${{ matrix.check_name }}
    if: ${{ needs.tier-context.result == 'success' && fromJson(needs.tier-context.outputs.matrices)['tests'][0] != null }}
  tier-summary:
    permissions:
      actions: read
      checks: write
      contents: read
    needs:
    - tier-context
    - tests
    if: ${{ always() && needs.tier-context.result == 'success' }}
    uses: ./.github/workflows/ci-tier-summary.yml
    with:
      binding: ${{ needs.tier-context.outputs.binding }}
      control_ref: ${{ needs.tier-context.outputs.control_sha }}
    secrets: inherit
