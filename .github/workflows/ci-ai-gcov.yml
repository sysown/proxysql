name: CI-AI-GCOV

on:
  workflow_call:
    inputs:
      trigger:
        type: string
      tap_group:
        type: string
        required: true
      infra_id:
        type: string
        required: true

      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: '1'
env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:
  tier-context:
    uses: ./.github/workflows/ci-tier-context.yml
    with:
      trigger: ${{ inputs.trigger }}
      consumer_id: ${{ inputs.consumer_id }}
      control_ref: ${{ inputs.control_ref }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
    secrets: inherit
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # This runner reads build handoffs, checks out sources and pulls GHCR; it
    # writes a check run and mints an OIDC token for Codecov. Keep the token
    # bounded to those operations.
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tier-context.outputs.matrices)['tests'] || fromJson('[{}]') }}
    env:
      MATRIX: '(${{ matrix.infradb }},genai-gcov)'

      SHA: ${{ needs.tier-context.outputs.sha }}
      CI_BINDING: ${{ needs.tier-context.outputs.binding }}
      CI_LEG: ${{ toJson(matrix) }}
      TIER: ${{ matrix.tier }}
      COVERAGE: ${{ matrix.coverage && '1' || '0' }}
    steps:
    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-context.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Start selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: proxysql
        persist-credentials: false
        # Codecov must see every production source path emitted by LCOV.
        sparse-checkout: |
          include
          lib
          plugins/genai
          src
          test/infra
          test/tap
          test/scripts

    - name: Restore selected product handoff
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py restore
    - name: Restore GenAI plugin from build handoff
      run: |
        set -euo pipefail
        cd proxysql/
        plugin_src="test/tap/tap/_runtime_libs/ProxySQL_GenAI_Plugin.so"
        plugin_dest="plugins/genai/ProxySQL_GenAI_Plugin.so"
        if [ ! -s "${plugin_src}" ]; then
          echo "ERROR: required GenAI plugin missing from build handoff: ${plugin_src}" >&2
          exit 1
        fi
        mkdir -p "$(dirname "${plugin_dest}")"
        cp "${plugin_src}" "${plugin_dest}"
        test -s "${plugin_dest}"

      if: ${{ success() && matrix.tier == 'v40' }}
    - name: Verify binary and GenAI plugin
      run: |
        chmod +x proxysql/src/proxysql
        file proxysql/src/proxysql
        test -s proxysql/plugins/genai/ProxySQL_GenAI_Plugin.so || {
          echo "ERROR: ProxySQL_GenAI_Plugin.so was not restored" >&2
          exit 1
        }

      if: ${{ success() && matrix.tier == 'v40' }}
    - name: Log in to GHCR and pull CI base image
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        for attempt in 1 2 3 4 5; do
          echo ">>> GHCR login and pull attempt ${attempt}/5"
          if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
              && docker pull ghcr.io/sysown/proxysql-ci-base:latest; then
            docker tag ghcr.io/sysown/proxysql-ci-base:latest proxysql-ci-base:latest
            exit 0
          fi
          [ "$attempt" -eq 5 ] || sleep $((attempt * 10))
        done
        exit 1

    - name: Start infrastructure
      run: |
        cd proxysql
        export INFRA_ID="${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}"
        export TAP_GROUP="${{ inputs.tap_group }}"
        export SKIP_CLUSTER_START=1
        test/infra/control/ensure-infras.bash

    - name: Run AI TAP tests with GCOV
      timeout-minutes: 90
      run: |
        cd proxysql
        export INFRA_ID="${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}"
        export TAP_GROUP="${{ inputs.tap_group }}"
        export SKIP_CLUSTER_START=1
        export TAP_USE_NOISE=1
        export COVERAGE="${COVERAGE}"
        test/infra/control/run-tests-isolated.bash

    - name: Cleanup
      if: always()
      run: |
        set +e
        [ -d proxysql ] || exit 0
        cd proxysql
        export INFRA_ID="${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}"
        export TAP_GROUP="${{ inputs.tap_group }}"
        docker logs "proxysql.${INFRA_ID}" 2>&1 | tail -50 || true
        test/infra/control/stop-proxysql-isolated.bash || true
        test/infra/control/destroy-infras.bash || true

    - name: Fix artifact permissions
      if: ${{ failure() && !cancelled() }}
      run: |-
        sudo chmod -R a+rX proxysql/ci_*_logs/ 2>/dev/null || true


    - name: Archive failure logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-logs-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: proxysql/ci_*_logs/

    - name: Archive coverage report
      if: ${{ matrix.coverage && (!cancelled()) }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-coverage-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: proxysql/ci_infra_logs/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}/coverage-report/
        if-no-files-found: ignore

    - name: Locate coverage report
      id: coverage
      if: ${{ matrix.coverage && (!cancelled()) }}
      env:
        COVERAGE_FILE: proxysql/ci_infra_logs/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}/coverage-report/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}.info
      run: |
        if [ -s "${COVERAGE_FILE}" ]; then
          echo "available=true" >> "${GITHUB_OUTPUT}"
        else
          echo "available=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Report missing coverage file
      if: ${{ matrix.coverage && (!cancelled() && steps.coverage.outputs.available != 'true') }}
      run: |-
        echo "No coverage report was produced; skipping Codecov upload."


    - name: Upload coverage to Codecov
      id: codecov_1
      if: ${{ matrix.coverage && (!cancelled() && steps.coverage.outputs.available == 'true') }}
      continue-on-error: true
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        codecov_yml_path: ${{ github.workspace }}/proxysql/codecov.yml
        override_commit: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
        files: proxysql/ci_infra_logs/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}/coverage-report/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}.info
        flags: integration-tests
        name: tap-${{ inputs.tap_group }}-coverage
        use_oidc: true
        disable_search: true
        plugins: noop
        root_dir: proxysql
        disable_file_fixes: true
        fail_ci_if_error: true
        verbose: true

    - name: Wait before Codecov retry 1
      if: ${{ !cancelled() && steps.codecov_1.outcome == 'failure' }}
      run: |-
        sleep 15


    - name: Upload coverage to Codecov (retry 1)
      id: codecov_2
      if: ${{ matrix.coverage && (!cancelled() && steps.codecov_1.outcome == 'failure') }}
      continue-on-error: true
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        codecov_yml_path: ${{ github.workspace }}/proxysql/codecov.yml
        override_commit: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
        files: proxysql/ci_infra_logs/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}/coverage-report/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}.info
        flags: integration-tests
        name: tap-${{ inputs.tap_group }}-coverage
        use_oidc: true
        disable_search: true
        plugins: noop
        root_dir: proxysql
        disable_file_fixes: true
        fail_ci_if_error: true
        verbose: true

    - name: Wait before Codecov retry 2
      if: ${{ !cancelled() && steps.codecov_2.outcome == 'failure' }}
      run: |-
        sleep 45


    - name: Upload coverage to Codecov (retry 2)
      id: codecov_3
      if: ${{ matrix.coverage && (!cancelled() && steps.codecov_2.outcome == 'failure') }}
      continue-on-error: true
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        codecov_yml_path: ${{ github.workspace }}/proxysql/codecov.yml
        override_commit: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
        files: proxysql/ci_infra_logs/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}/coverage-report/${{ inputs.infra_id }}-${{ matrix.tier }}-${{ github.run_id }}.info
        flags: integration-tests
        name: tap-${{ inputs.tap_group }}-coverage
        use_oidc: true
        disable_search: true
        plugins: noop
        root_dir: proxysql
        disable_file_fixes: true
        fail_ci_if_error: true
        verbose: true

    - name: Report Codecov upload failure
      if: ${{ !cancelled() && steps.codecov_3.outcome == 'failure' }}
      run: |-
        echo "::warning::Codecov upload failed after 3 attempts; tests were unaffected."


    - name: Complete selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ always() }}
    needs:
    - tier-context
    name: ${{ matrix.check_name }}
    if: ${{ needs.tier-context.result == 'success' && fromJson(needs.tier-context.outputs.matrices)['tests'][0] != null }}
  tier-summary:
    needs:
    - tier-context
    - tests
    if: ${{ always() && needs.tier-context.result == 'success' }}
    uses: ./.github/workflows/ci-tier-summary.yml
    with:
      binding: ${{ needs.tier-context.outputs.binding }}
      control_ref: ${{ needs.tier-context.outputs.control_sha }}
    secrets: inherit
