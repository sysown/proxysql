name: CI-tier-sweep

# Merge-only CI for the ProxySQL v3.0.x and v3.1.x feature tiers.
#
# Every other workflow in this repo builds exactly one tier: v4.0
# (PROXYSQL40=1). That is correct for PR feedback, but it is a structural
# blind spot -- a v4.0-only build cannot detect a regression that breaks the
# v3.0 or v3.1 compile (a missing #else arm, a symbol pulled in
# unconditionally, an include that only exists under the v4.0 tier).
#
# This workflow closes that gap WITHOUT costing anything on PRs. The merge-only
# guarantee lives in exactly one place: the caller on the default branch,
# `v3.0:.github/workflows/CI-tier-sweep.yml`, declares `on: push` and
# deliberately does NOT declare `pull_request`. Do not add a pull_request
# trigger here or there -- that single line is the whole cost model.
#
# See issue #6231 and v3.0:doc/GH-Actions/README.md.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string

env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:

  # One build leg per downgrade tier. This is a nested reusable-workflow call,
  # so all of ci-builds.yml's machinery is reused verbatim: the self-hosted
  # pool routing, the docker nuke, the workspace ownership reclaim, the deps
  # archive verification, the Check build log validation and the handoff
  # publish. ci-builds.yml's `tier` input defaults to v40, so the normal
  # PR-time caller is completely unaffected by this file existing.
  build:
    strategy:
      fail-fast: false
      matrix:
        tier: [ 'v30', 'v31' ]
    permissions: write-all
    # Same-repo relative form (not an @GH-Actions pin): this workflow was
    # itself resolved from the GH-Actions branch, so './' is that same commit.
    uses: ./.github/workflows/ci-builds.yml
    secrets: inherit
    with:
      trigger: ${{ inputs.trigger }}
      tier: ${{ matrix.tier }}
      trusted: true

  # Derive the shard axis from .github/shards.json so the matrix and the shard
  # COUNT can never disagree. See that file for why the harmful direction of
  # that drift is silent.
  plan:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      count: ${{ steps.p.outputs.count }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: GH-Actions
        path: ci-control
        sparse-checkout: |
          .github/shards.json
        sparse-checkout-cone-mode: false
    - name: Resolve shard axis
      id: p
      run: |
        set -euo pipefail
        shards="$(python3 -c 'import json,sys; print(json.dumps(json.load(open("ci-control/.github/shards.json"))["shards"]))')"
        count="$(python3 -c 'import json,sys; print(len(json.load(open("ci-control/.github/shards.json"))["shards"]))')"
        if [ "${count}" -lt 1 ]; then
          echo "::error::shards.json declares no shards; the sweep would run nothing"
          exit 1
        fi
        echo "Resolved ${count} shards: ${shards}"
        printf 'shards=%s\n' "${shards}" >> "$GITHUB_OUTPUT"
        printf 'count=%s\n'  "${count}"  >> "$GITHUB_OUTPUT"

  tests:
    needs: [ build, plan ]
    strategy:
      fail-fast: false
      matrix:
        tier: [ 'v30', 'v31' ]
        # Built from the plan job so the axis and SHARD_COUNT share one source.
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # write-all: this job creates a custom check run (checks:write) and reads
    # the handoff artifact. Permissions are the intersection of caller and
    # callee, so the caller on v3.0 must also grant write-all.
    permissions: write-all
    env:
      TIER: ${{ matrix.tier }}
      # The artifact variant is the tier's identity in the artifact namespace.
      # Must match resolve-tier's mapping inside ci-builds.yml exactly:
      #   v30 -> ubuntu24-tap-v30
      #   v31 -> ubuntu24-tap-v31
      HANDOFF_VARIANT: ${{ matrix.tier == 'v30' && 'ubuntu24-tap-v30' || 'ubuntu24-tap-v31' }}
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: ${{ needs.plan.outputs.count }}
      MATRIX: '(${{ matrix.tier }},shard${{ matrix.shard }})'
    steps:

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      id: checks
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: '${{ github.workflow }} / ${{ github.job }} ${{ env.MATRIX }}'
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        status: 'in_progress'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: 'proxysql'
        # include/lib/src are NOT needed here (no Codecov step in this
        # workflow -- non-v40 builds have no .gcno files), but test/tap/groups
        # is mandatory: run-tests-isolated.bash reads groups.json to resolve
        # the group, and the group env.sh files set SKIP_PROXYSQL etc.
        sparse-checkout: |
          test/infra
          test/tap/groups
          test/scripts

    - name: Download build handoff
      # Build payload arrives as a workflow artifact, not an Actions cache.
      #
      # NOTE the run scope: the existing ~51 consumers use
      # `inputs.trigger.event.workflow_run.id` to find the CI-builds run that
      # produced the handoff. That is WRONG here and must not be copied. In
      # this workflow the producer (`build`, a nested ci-builds.yml call) and
      # this consumer are jobs of the SAME run, so the correct scope is
      # github.run_id. The workflow_run.id points at the CI-trigger run, whose
      # artifact list does not contain the handoff.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ env.SHA }}
        BUILD_RUN_ID: ${{ github.run_id }}
        HANDOFF_VARIANT: ${{ env.HANDOFF_VARIANT }}
        HANDOFF_TYPES: full
      run: |
        set -uo pipefail
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        # The artifact is produced by the `build` job of THIS run, which is a
        # `needs:` dependency of this job, so it is already attached by the
        # time we look. That makes a run-scoped lookup both sufficient and the
        # only safe option.
        #
        # The existing consumers also fall back to the GLOBAL
        # /actions/artifacts?name= index, because a self-hosted runner can
        # pick a job up ~1 min after the build and land inside the window where
        # that global index still lags. That does not apply here (see above),
        # and the global fallback would let this job adopt a same-named
        # artifact produced by a DIFFERENT run -- a cross-run trust expansion
        # that Sonar flagged. So: run-scoped only, retried, and a hard error
        # if it never resolves. We never unpack an artifact whose producing run
        # is not this one.
        : "${HANDOFF_MAX_ATTEMPTS:=20}"   # bounded: 20 x 15s = up to ~5 min
        ERRLOG="$(mktemp)"
        if [ -z "${BUILD_RUN_ID:-}" ]; then
          echo "ERROR: BUILD_RUN_ID is empty; refusing to fetch the handoff" >&2
          exit 1
        fi
        resolve_aid() {
          local name="$1" out=""
          out=$(gh api "repos/${REPO}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
                  --jq "[.artifacts[]|select(.name==\"${name}\" and .expired==false)]|sort_by(.created_at)|last|.id // empty" 2>>"$ERRLOG") || true
          [ -n "$out" ] && { printf '%s' "$out"; return 0; }
          return 1
        }
        for t in $HANDOFF_TYPES; do
          name="ci-builds-handoff-${SHA}-${HANDOFF_VARIANT}-${t}"
          aid=""
          for attempt in $(seq 1 "$HANDOFF_MAX_ATTEMPTS"); do
            aid=$(resolve_aid "$name") && [ -n "$aid" ] && break
            aid=""
            echo ">>> ${name} not resolvable in run ${BUILD_RUN_ID} yet (${attempt}/${HANDOFF_MAX_ATTEMPTS}); sleeping 15s"; sleep 15
          done
          if [ -z "$aid" ]; then
            echo "ERROR: handoff artifact ${name} not found in run ${BUILD_RUN_ID} after ${HANDOFF_MAX_ATTEMPTS} attempts" >&2
            echo "       Did the ${TIER} build leg succeed for ${SHA}?" >&2
            echo "       Note: only artifacts from THIS run are accepted, by design." >&2
            echo "--- last gh errors ---" >&2; tail -n 20 "$ERRLOG" >&2
            exit 1
          fi
          echo ">>> downloading ${name} (id=${aid})"
          gh api "repos/${REPO}/actions/artifacts/${aid}/zip" > "handoff-${t}.zip" || { echo "ERROR: download ${name} failed" >&2; exit 1; }
          unzip -o "handoff-${t}.zip" || { echo "ERROR: unzip ${name} failed" >&2; exit 1; }
        done
        mkdir -p proxysql
        cd proxysql/
        for tb in ../cache_*.tar.zst; do
          [ -e "$tb" ] || continue
          echo ">>> unpacking $(basename "$tb")"
          zstd -d < "$tb" | tar -xf - || { echo "ERROR: unpack $tb failed" >&2; exit 1; }
        done
        rm -f ../cache_*.tar.zst ../handoff-*.zip

    - name: Verify binary and tier
      # Assert the handoff really is the tier we asked for. A silent tier
      # mismatch (stale object files, wrong variant resolved) is the exact
      # failure mode CLAUDE.md warns about, and it is invisible without this
      # check: the tests would run and pass against the wrong build.
      run: |
        set -euo pipefail
        chmod +x proxysql/src/proxysql
        file proxysql/src/proxysql
        got="$(proxysql/src/proxysql --version 2>&1 | grep -oP 'ProxySQL version \K[0-9]+\.[0-9]+\.[0-9]+' || true)"
        echo ">>> handoff reports ProxySQL version: ${got:-<undetectable>}"
        case "${TIER}" in
          v30) want_major_minor=3.0 ;;
          v31) want_major_minor=3.1 ;;
          *) echo "ERROR: unhandled TIER '${TIER}'"; exit 1 ;;
        esac
        if [[ "${got}" != "${want_major_minor}."* ]]; then
          echo "ERROR: asked for tier ${TIER} (expect ${want_major_minor}.x) but the handoff binary is ${got:-unknown}" >&2
          echo "       Refusing to run: this would silently test the wrong tier." >&2
          exit 1
        fi
        echo ">>> tier confirmed: ${TIER} == ${got}"

    - name: Log in to GHCR and pull CI base image
      # Both `docker login` and `docker pull` against ghcr.io have been
      # observed to fail transiently with
      # `net/http: request canceled (Client.Timeout exceeded while awaiting
      # headers)`. Wrap both in a retry loop with linear backoff.
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        attempt=0
        max_attempts=5
        while [ $attempt -lt $max_attempts ]; do
          attempt=$((attempt + 1))
          echo ">>> GHCR login+pull attempt ${attempt}/${max_attempts}"
          if echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin \
              && docker pull ghcr.io/sysown/proxysql-ci-base:latest; then
            echo ">>> GHCR login+pull OK on attempt ${attempt}"
            docker tag ghcr.io/sysown/proxysql-ci-base:latest proxysql-ci-base:latest
            exit 0
          fi
          if [ $attempt -lt $max_attempts ]; then
            sleep_for=$((attempt * 10))
            echo ">>> attempt ${attempt} failed; sleeping ${sleep_for}s"
            sleep $sleep_for
          fi
        done
        echo ">>> all ${max_attempts} GHCR attempts failed"
        exit 1

    - name: Run curated TAP groups
      # Runs the group list in test/tap/groups/tier-sweep.lst, sharded across
      # the matrix by `shard`. That list is every group regular CI already
      # exercises AND which has at least one test selectable on v3.0 or v3.1
      # -- ~54 groups / ~800 test-runs per tier. Groups no workflow ever
      # selects are deliberately out of scope: enabling them would conflate
      # "does this tier work" with "does this group work at all".
      #
      # A listed group whose tests are ALL gated out on the running tier skips
      # cleanly (run-tests-isolated.bash), so a v4.0-only group in the list
      # (ai-g2 on v3.0) costs one no-op iteration rather than failing the job.
      #
      # Groups WITHIN a shard run sequentially with a distinct INFRA_ID each,
      # so Docker container namespaces never collide. Sharding, not the loop,
      # is what supplies the parallelism: sequential across all 54 groups would
      # be ~7h per tier.
      #
      # The list is read AFTER `cd proxysql`, hence the path carries no
      # `proxysql/` prefix. With one it would not resolve, and this step would
      # silently fall back to the 3-group baseline forever.
      #
      # COVERAGE is deliberately NOT set: non-v40 builds are compiled without
      # WITHGCOV=1, so there are no .gcno files for the collector to match.
      timeout-minutes: 150
      run: |
        set -uo pipefail
        cd proxysql
        # Resolve this shard's slice of the group list. The list lives on the
        # branch under test (test/tap/groups/tier-sweep.lst, kept in sync with
        # groups.json by test/infra/control/check_tier_sweep_groups.py), so the
        # sweep reads the same data the maintainers edit.
        #
        # The fallback matters for the window between this reusable landing and
        # the v3.0-side list landing: until tier-sweep.lst exists, behave exactly
        # as the original 3-group sweep did rather than running nothing.
        LIST="test/tap/groups/tier-sweep.lst"
        if [ -f "${LIST}" ]; then
          mapfile -t ALL_GROUPS < <(grep -vE '^[[:space:]]*(#|$)' "${LIST}")
        else
          echo "WARNING: ${LIST} not found; falling back to the original 3-group baseline"
          ALL_GROUPS=(unit-tests-g1 legacy-g1 mysql84-g1)
        fi
        SELECTED_GROUPS=()
        i=0
        for g in "${ALL_GROUPS[@]}"; do
          if [ $((i % SHARD_COUNT)) -eq "${SHARD}" ]; then SELECTED_GROUPS+=("${g}"); fi
          i=$((i + 1))
        done
        # Guard the matrix/count contract at run time. SHARD comes from the
        # matrix and SHARD_COUNT from the same shards.json, so these can only
        # disagree if the file is edited badly -- which would otherwise show up
        # as groups silently never running.
        if ! [[ "${SHARD}" =~ ^[0-9]+$ ]] || [ "${SHARD}" -lt 0 ] || [ "${SHARD}" -ge "${SHARD_COUNT}" ]; then
          echo "::error::shard '${SHARD}' is not a valid index for SHARD_COUNT=${SHARD_COUNT}"
          exit 1
        fi
        echo ">>> shard ${SHARD}/${SHARD_COUNT}: ${#SELECTED_GROUPS[@]} of ${#ALL_GROUPS[@]} groups"
        printf '>>>   %s\n' "${SELECTED_GROUPS[@]}"

        if [ "${#SELECTED_GROUPS[@]}" -eq 0 ]; then
          # Distinguish "this shard legitimately has no work" from "the list is
          # broken". The latter used to exit 0 here, which made a list that was
          # all comments -- or a list that failed to parse -- look like a
          # perfectly green sweep that ran nothing.
          if [ "${#ALL_GROUPS[@]}" -eq 0 ]; then
            echo "::error::${LIST} exists but yielded no groups; refusing to run an empty sweep"
            exit 1
          fi
          echo ">>> shard ${SHARD} has no groups (list has ${#ALL_GROUPS[@]}); nothing to do"
          exit 0
        fi

        # Every selected name must be a real group. This is not paranoia: the
        # array was once called GROUPS, which bash reserves for the runner
        # user's group IDs, so `GROUPS=()` silently did nothing and the shard
        # ended up "running" TAP_GROUP=1004, TAP_GROUP=114, ... Those are
        # unknown to groups.json, and an unknown group selects zero tests --
        # which run-tests-isolated.bash treats as a legitimate skip. So a
        # garbage group would have produced a green sweep that ran nothing at
        # all. Validate identity, not just the count.
        #
        # NOTE: group names are VALUES in groups.json (array elements), not
        # keys -- the keys are test names like "admin_show_fields_from-t". A
        # grep for "<group>" followed by a colon matches nothing and would
        # reject every real group. Derive the valid set once (one python call,
        # not one per group) and test membership with grep -Fxq.
        VALID_GROUPS="$(python3 -c 'import json;g=json.load(open("test/tap/groups/groups.json"));print("\n".join(sorted({e for v in g.values() for e in v if not str(e).startswith("@")})))')"
        if [ -z "${VALID_GROUPS}" ]; then
          echo "::error::could not read any group names from test/tap/groups/groups.json" >&2
          exit 1
        fi
        while IFS= read -r g; do
          [ -n "${g}" ] || continue
          if ! printf '%s\n' "${VALID_GROUPS}" | grep -Fxq -- "${g}"; then
            echo "::error::selected group '${g}' is not a group in test/tap/groups/groups.json" >&2
            echo "       Refusing to run: an unknown group silently selects zero tests." >&2
            exit 1
          fi
        done < <(printf '%s\n' "${SELECTED_GROUPS[@]}")
        echo ">>> all ${#SELECTED_GROUPS[@]} selected groups verified against groups.json"

        # Persist the selection. The Cleanup step is a SEPARATE shell, and
        # GitHub does not carry shell arrays between steps -- so referencing
        # SELECTED_GROUPS there expands to nothing and the leftover-container
        # sweep silently does nothing. Write the names out and read them back.
        SELECTED_FILE="${GITHUB_WORKSPACE}/ci-tier-sweep-selected-groups.txt"
        printf '%s\n' "${SELECTED_GROUPS[@]}" > "${SELECTED_FILE}"
        echo ">>> wrote ${#SELECTED_GROUPS[@]} group names to ${SELECTED_FILE}"

        overall=0
        for GROUP in "${SELECTED_GROUPS[@]}"; do
          INFRA="ci-tier-sweep-${TIER}-${GROUP}"
          echo ""
          echo "==================================================================="
          echo ">>> tier=${TIER} group=${GROUP} infra=${INFRA}"
          echo "==================================================================="
          export INFRA_ID="${INFRA}"
          export TAP_GROUP="${GROUP}"
          export SKIP_CLUSTER_START=1
          rc=0
          test/infra/control/ensure-infras.bash || rc=$?
          if [ "${rc}" -eq 0 ]; then
            test/infra/control/run-tests-isolated.bash || rc=$?
          else
            echo ">>> infra startup failed for ${GROUP} (rc=${rc}); skipping the test run"
          fi
          # Teardown must always run, and must never mask the test result.
          test/infra/control/stop-proxysql-isolated.bash || true
          test/infra/control/destroy-infras.bash || true
          if [ "${rc}" -ne 0 ]; then
            echo ">>> group ${GROUP} FAILED on tier ${TIER} (rc=${rc})"
            overall=1
          else
            echo ">>> group ${GROUP} passed on tier ${TIER}"
          fi
        done
        exit "${overall}"

    - name: Cleanup
      if: always()
      run: |
        set +e
        if [ ! -d proxysql ]; then
          echo "proxysql checkout not present; skipping cleanup."
          exit 0
        fi
        cd proxysql
        # The per-group teardown normally handled this; sweep whatever is left
        # so a failed group cannot leak a container onto the shared runner.
        #
        # This runs in its own shell, so it cannot see the TAP step's shell
        # array. Read the names the TAP step persisted instead. If that file is
        # missing the TAP step never got as far as selecting anything, and the
        # catch-all `docker ps` sweep below is all that applies.
        SELECTED_FILE="${GITHUB_WORKSPACE}/ci-tier-sweep-selected-groups.txt"
        if [ -f "${SELECTED_FILE}" ]; then
          while IFS= read -r GROUP; do
            [ -n "${GROUP}" ] || continue
            export INFRA_ID="ci-tier-sweep-${TIER}-${GROUP}"
            export TAP_GROUP="${GROUP}"
            test/infra/control/stop-proxysql-isolated.bash >/dev/null 2>&1 || true
            test/infra/control/destroy-infras.bash >/dev/null 2>&1 || true
          done < "${SELECTED_FILE}"
        else
          echo "no selected-group file at ${SELECTED_FILE}; relying on the catch-all docker sweep"
        fi
        docker ps -a --format '{{.Names}}' | grep -E "ci-tier-sweep" | xargs -r docker rm -f 2>/dev/null || true

    - name: Fix artifact permissions
      if: ${{ failure() && !cancelled() }}
      run: |
        # upload-artifact dies with EACCES when it scandirs into directories
        # under ci_*_logs/ created inside docker build containers (root-owned).
        sudo chmod -R a+rX proxysql/ci_*_logs/ 2>/dev/null || true

    - name: Archive artifacts logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        # The shard MUST be in the name. All shards of one tier share
        # workflow/tier/SHA/run-number, and upload-artifact@v4 artifacts are
        # immutable and single-upload, so two failing shards would collide and
        # one upload would fail -- losing the very logs needed to debug the
        # failure that triggered the upload.
        name: ${{ github.workflow }}-${{ env.TIER }}-shard${{ env.SHARD }}-${{ env.SHA }}-logs-run#${{ github.run_number }}
        path: |
          proxysql/ci_*_logs/
        if-no-files-found: warn

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      if: always() && steps.checks.outputs.check_id != ''
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        check_id: ${{ steps.checks.outputs.check_id }}
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        conclusion: ${{ job.status }}
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
