name: CI-trigger

on:
  workflow_dispatch:
  workflow_call:

jobs:
  trigger:
    runs-on: ubuntu-22.04
    # Must exceed the timeout of the job it watches (ci-builds, 120) -- this
    # job blocks on `gh run watch` until that build finishes, so an equal
    # budget lets the watcher expire first and the workflow_run[completed]
    # fan-out never fires.
    timeout-minutes: 240

    steps:
    - name: Trigger workflow_run[in_progress]
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        #set -x

        RUNNAME1="${{ github.event.after || github.sha }}"
        RUNNAME2="${{ github.event.pull_request.head.sha || github.sha }}"
        RUNNAME3="${{ github.sha }}"
        echo "Get run id: '${RUNNAME1}|${RUNNAME2}|${RUNNAME3}' ..."
        sleep 5
        RUNID=$(gh -R ${{ github.repository }} run list -w CI-builds -s in_progress | grep -P "${RUNNAME1}|${RUNNAME2}|${RUNNAME3}" | grep -Po '(?<=workflow_run)\s+\d+')
        while [[ -z ${RUNID} ]]; do
          sleep 20
          gh -R ${{ github.repository }} run list -w CI-builds -s in_progress | grep -P "${RUNNAME1}|${RUNNAME2}|${RUNNAME3}"
          RUNID=$(gh -R ${{ github.repository }} run list -w CI-builds -s in_progress | grep -P "${RUNNAME1}|${RUNNAME2}|${RUNNAME3}" | grep -Po '(?<=workflow_run)\s+\d+')
        done
        echo "Got run id: '${RUNNAME1}|${RUNNAME2}|${RUNNAME3}' : '${RUNID}'"
        
        echo "Trigger workflow_run[in_progress]: '${RUNNAME1}|${RUNNAME2}|${RUNNAME3}'"
        sleep 5
        # This blocks until the run is finished. Propagate its result: the
        # downstream workflow_run[completed] jobs intentionally require this
        # trigger workflow to succeed before consuming CI-builds handoffs.
        if gh -R ${{ github.repository }} run watch --exit-status -i 30 ${RUNID} >/dev/null; then
          echo "CI-builds run ${RUNID} completed successfully"
        else
          watch_status=$?
          echo "::error::CI-builds run ${RUNID} did not complete successfully (gh run watch exit ${watch_status})"
          exit "${watch_status}"
        fi
        sleep 5

    - name: Trigger workflow_run[completed]
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Cleanup skipped ..."
        # Housekeeping only: opportunistically delete skipped runs. Per-call
        # failures (typically HTTP 401 "Bad credentials" on runs that the
        # PR-scoped GITHUB_TOKEN does not have rights to delete -- e.g. runs
        # from forked PRs or other branches) MUST NOT fail this step,
        # because failing this step marks the CI-trigger job as 'failure',
        # which prevents every downstream test workflow from firing (they
        # gate on workflow_run.conclusion == 'success'). See issue #5811.
        gh -R ${{ github.repository }} run list -s skipped -L 100 --json databaseId -q '.[].databaseId' \
            | while read -r id; do
                if ! gh -R ${{ github.repository }} run delete "$id" 2>&1; then
                    echo "  skip run $id (no rights / already gone)"
                fi
            done
        echo "Triggered workflow_run[completed]: '${{ github.ref_name }} ${{ github.workflow }} ${{ github.sha }}'"
        
