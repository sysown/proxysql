name: TEMP apply coverage fixes v3

on:
  push:
    branches: [ GH-Actions ]
    paths:
      - '.github/workflows/zz-temp-apply-coverage-fixes-v3.yml'

permissions: write-all

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: GH-Actions
          fetch-depth: 0

      - name: Apply and validate coverage fixes
        run: python3 .github/scripts/temp_apply_coverage_fixes.py
