name: CI-legacy-g2-genai
run-name: '${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }} ${{ github.workflow }} ${{ github.event.workflow_run && github.event.workflow_run.head_sha || github.sha }} trigger=${{ github.event.workflow_run.id || github.run_id }}/${{ github.event.workflow_run.run_attempt || github.run_attempt }}'

on:
  workflow_dispatch:
    inputs:
      control_ref:
        type: string
        default: GH-Actions
        description: CI implementation ref for isolated validation
      producer_run_id:
        type: string
        default: ''
        description: Exact producer workflow run ID (manual tests)
      producer_attempt:
        type: string
        default: '1'
        description: Exact producer attempt (manual tests)
  workflow_run:
    workflows: [CI-trigger]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' || ! github.event.workflow_run }}
    # `write-all` grants every default scope plus id-token:write for
    # Codecov OIDC upload. After a five-step ratchet of adding scopes
    # one at a time (contents, checks, packages, actions, id-token)
    # the cache restore step *still* failed even with actions:write
    # explicitly listed. Falling back to write-all matches what the
    # cascading workflow_run runs implicitly have, what the rest of
    # the TAP group workflows use, and works. Reusable-workflow
    # permissions intersect caller + callee, so this caller has to
    # declare write-all for the callee's write-all to propagate.
    permissions: write-all
    uses: sysown/proxysql/.github/workflows/ci-legacy-g2-genai.yml@GH-Actions
    secrets: inherit
    with:
      trigger: ${{ toJson(github) }}
      consumer_id: run
      control_ref: ${{ inputs.control_ref || 'GH-Actions' }}
      producer_run_id: ${{ inputs.producer_run_id || '' }}
      producer_attempt: ${{ inputs.producer_attempt || '1' }}
