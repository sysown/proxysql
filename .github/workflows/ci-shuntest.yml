name: CI-shuntest

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string

      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: ''
env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:
  tier-context:
    uses: ./.github/workflows/ci-tier-context.yml
    with:
      trigger: ${{ inputs.trigger }}
      consumer_id: ${{ inputs.consumer_id }}
      control_ref: ${{ inputs.control_ref }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
      consumer_file: ci-shuntest.yml
      consumer_inputs: ${{ toJson(inputs) }}
    secrets: inherit
  pick-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read          # read in-progress runs/jobs (no repo admin needed)
    outputs:
      runson: ${{ steps.pick.outputs.runson }}
    steps:
    - name: Pick runner pool
      id: pick
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        POOL_SIZE: ${{ vars.SELFHOSTED_POOL_SIZE || '6' }}
        ELIGIBLE: ${{ (github.actor == 'renecannao' || (inputs.trigger && fromJson(inputs.trigger).event.workflow_run.actor.login == 'renecannao')) && vars.SELFHOSTED_WORKFLOWS && contains(fromJson(vars.SELFHOSTED_WORKFLOWS), github.workflow) }}
      run: |
        set -uo pipefail
        # Preserve this workflow's ubuntu-24.04 baseline; the other ported
        # groups fall back to 22.04. Its deps (sysbench, gettext) are not
        # 22.04-specific, but silently downgrading the runner would change
        # the environment this group is validated against.
        choice='"ubuntu-24.04"'
        if [ "${ELIGIBLE:-}" = "true" ]; then
          POOL="${POOL_SIZE:-6}"
          # Listing runners needs repo admin, which no available token has, so
          # infer pool demand from job state the default token CAN read.
          # demand = in-progress jobs carrying the 'proxysql-ci' label, i.e. the
          # jobs actually occupying a pool VM right now.
          #
          # Two corrections vs the original heuristic:
          #  - Match the 'proxysql-ci' label, not a 'ci-vm' runner_name prefix.
          #    The prefix missed every dev128-ci-vm-* runner, so their occupancy
          #    was invisible and the pool looked emptier than it was.
          #  - Count in-progress jobs ONLY. Including queued jobs made the
          #    decision self-defeating: any backlog kept demand >= POOL, which
          #    pinned every later decider to spill regardless of real occupancy.
          # free = POOL - demand; self-hosted iff free>=1.
          # Early-exit once demand hits POOL.
          demand=0; err=0
          ids=$( gh api --paginate "repos/${REPO}/actions/runs?status=in_progress&per_page=100" --jq '.workflow_runs[].id' 2>e1 ) || err=1
          if [ "$err" = "0" ]; then
            for rid in ${ids:-}; do
              [ "$demand" -ge "$POOL" ] && break
              # A failed lookup must not read as free capacity: a transient
              # 429 or API error would otherwise make a saturated pool look
              # empty and route work onto already-busy VMs. Saturate instead,
              # which forces the hosted spill below.
              n=$(gh api "repos/${REPO}/actions/runs/${rid}/jobs" --jq '[.jobs[]|select(.status=="in_progress" and (([.labels[]]|index("proxysql-ci")) != null))]|length' 2>/dev/null) || { echo ">>> WARNING: could not read jobs for run ${rid}; assuming pool is full"; n="${POOL}"; }
              demand=$(( demand + ${n:-0} ))
            done
            free=$(( POOL - demand ))
            echo ">>> self-hosted pool: demand=${demand}/${POOL} free=${free} (in-progress on pool)"
            if [ "${free}" -ge 1 ]; then
              choice='["self-hosted","proxysql-ci"]'; echo ">>> capacity available -> self-hosted"
            else
              choice='"ubuntu-24.04"'; echo ">>> pool at/over capacity -> spill to GitHub-hosted"
            fi
          else
            echo ">>> WARNING: could not read runs:"; sed 's/^/    /' e1
            choice='["self-hosted","proxysql-ci"]'; echo ">>> failing SAFE to self-hosted (offload unchanged)"
          fi
        else
          echo ">>> not eligible for self-hosted -> GitHub-hosted"
        fi
        echo "runson=${choice}" >> "$GITHUB_OUTPUT"
        echo ">>> decision: runson=${choice}"
  tests:
    runs-on: ${{ fromJson(needs.pick-runner.outputs.runson) }}
    timeout-minutes: 45
    permissions:
      actions: read
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tier-context.outputs.matrices)['tests'] || fromJson('[{}]') }}
    env:
      TESTDIST: ${{ matrix.testdist }}
      INFRADB: ${{ matrix.infradb }}
      MATRIX: '(${{ matrix.infradb }})'

      SHA: ${{ needs.tier-context.outputs.sha }}
      CI_BINDING: ${{ needs.tier-context.outputs.binding }}
      CI_LEG: ${{ toJson(matrix) }}
      TIER: ${{ matrix.tier }}
      COVERAGE: ${{ matrix.coverage && '1' || '0' }}
    steps:

    - name: Use a job-scoped Docker config
      # Self-hosted pool VMs keep ~/.docker/config.json between jobs. Other
      # workflows run `docker login ghcr.io` with their job's GITHUB_TOKEN and
      # never log out, and that token is revoked when their job ends. Docker
      # then sends the dead credential with every later ghcr.io pull, and GHCR
      # answers "error from registry: denied" even for the public
      # ghcr.io/mrmohebi/docker-hoster image this job needs. This job never
      # logs in, so give it an empty config: all of its pulls are anonymous.
      # CLI plugins (docker compose) are linked in case they live under
      # ~/.docker/cli-plugins rather than a system plugin directory.
      run: |
        DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
        rm -rf "${DOCKER_CONFIG}"
        mkdir -p "${DOCKER_CONFIG}"
        if [ -d "${HOME}/.docker/cli-plugins" ]; then
          ln -s "${HOME}/.docker/cli-plugins" "${DOCKER_CONFIG}/cli-plugins"
        fi
        echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
        DOCKER_CONFIG="${DOCKER_CONFIG}" docker compose version

    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-context.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Start selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y sysbench gettext

#    - name: Wait for cache
#      if: ${{ env.BRANCH != 'none' }}
#      env:
#        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#      run: |
#        echo "Wating for cache '${BLDCACHE}' ..."
#        sleep $(( $RANDOM / 1024 ))
#        PROBE="$(gh cache list --limit 300 --repo ${{ github.repository }} | grep -i ${BLDCACHE} || echo '')"
#        while [[ -z ${PROBE} ]]; do
#          echo "Wating for cache '${BLDCACHE}' ..."
#          sleep 30
#          PROBE="$(gh cache list --limit 300 --repo ${{ github.repository }} | grep -i ${BLDCACHE} || echo '')"
#        done
#        echo "Cache available '${BLDCACHE}'"

    - name: Checkout repl test suite
      # The replication/shunning suite is vendored in-repo at test/repl/ (moved
      # off the private jenkins-build-scripts repo, so no GH_TOKEN_PROXYSQL PAT).
      # Sparse-checkout just that dir into proxysql/; the proxysql binary arrives
      # separately via the build handoff below (unpacked into the same proxysql/).
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: 'proxysql'
        sparse-checkout: |
          test/repl

    - name: Restore selected product handoff
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py restore
    - name: Docker-hoster
      run: |
        cd proxysql/test/repl/infra-docker-hoster
        sed -i 's|image: .*|image: ghcr.io/mrmohebi/docker-hoster|' docker-compose.yml
        docker compose up -d

    - name: Shun-tests
      timeout-minutes: 35
      run: |
        set +e

        # Vendored suite lives at proxysql/test/repl (was jenkins-build-scripts).
        cd proxysql/test/repl
        grep -rl 'docker-compose ' | xargs -r -n1 sed -i 's/docker-compose /docker compose /g'
        sed -i "s|#!/usr/bin/bash|#!/usr/bin/bash +e|" proxysql_repl_tests/bin/debezium-check.bash
        sed -i "s|#!/usr/bin/bash|#!/usr/bin/bash +e|" proxysql_repl_tests/exec_shun_test.sh
        sed -i "s|JENKINS_SCRIPTS_PATH=.*|JENKINS_SCRIPTS_PATH=${{ github.workspace }}/proxysql/test/repl|" env.sh
        sed -i "s|WORKSPACE=.*|WORKSPACE=${{ github.workspace }}/proxysql|" env.sh
        cat env.sh
        ls -l ${{ github.workspace }}/proxysql/src

        cd proxysql_repl_tests
        ./exec_shun_test.sh
        RC=$?

        sudo chmod -R 777 ${{ github.workspace }}/*
        exit $RC

    - name: Fix artifact permissions
      if: ${{ failure() && !cancelled() }}
      run: |
        # actions/upload-artifact dies with EACCES when it scandirs into
        # directories under ci_*_logs/ that were created inside docker
        # build containers (root-owned). Make everything readable by the
        # runner user before upload. sudo required because files are
        # root-owned; 2>/dev/null + || true because the path may not
        # exist on all failure paths (e.g. a cache-restore failure before
        # any test even runs).
        sudo chmod -R a+rX proxysql/ci_*_logs/ 2>/dev/null || true

    - name: Archive artifacts logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-logs-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: |
          proxysql/ci_*_logs/

    - name: Archive artifacts bin
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-bin-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: |
          proxysql/binaries/
          proxysql/src/
          proxysql/libs/
#          proxysql/deps/
    - name: Complete selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ always() }}
    needs:
    - tier-context
    - pick-runner
    name: ${{ matrix.check_name }}
    if: ${{ needs.tier-context.result == 'success' && fromJson(needs.tier-context.outputs.matrices)['tests'][0] != null }}
  tier-summary:
    permissions:
      actions: read
      checks: write
      contents: read
    needs:
    - tier-context
    - tests
    if: ${{ always() && needs.tier-context.result == 'success' }}
    uses: ./.github/workflows/ci-tier-summary.yml
    with:
      binding: ${{ needs.tier-context.outputs.binding }}
      control_ref: ${{ needs.tier-context.outputs.control_sha }}
    secrets: inherit
