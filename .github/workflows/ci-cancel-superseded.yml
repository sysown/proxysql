name: Cancel superseded CI

on:
  workflow_call:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel:
    # `pull_request_target` executes trusted base-branch code for PRs;
    # `push` prunes older cascades on the branch that was just pushed.
    # Neither path checks out the code under test.
    if: github.event_name == 'pull_request_target' || github.event_name == 'push'
    # Cancellation must not wait behind the old CI jobs in the self-hosted pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout trusted CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: GH-Actions
        sparse-checkout: .github
        persist-credentials: false
    - name: Cancel superseded runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 .github/scripts/ci_cancel_superseded.py
