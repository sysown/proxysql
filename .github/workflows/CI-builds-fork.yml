name: CI-builds-fork

on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - '**.md'

permissions:
  contents: read

jobs:
  run:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') && (github.event.pull_request.head.repo.fork) }}
    # The dedicated immutable callee cannot request scopes beyond contents:read.
    # Its build steps match trusted CI, including exact dependency caches.
    uses: sysown/proxysql/.github/workflows/ci-builds-untrusted.yml@40dcd00772a2b863e050611aae3c151da87a2d21
    with:
      trusted: false
      control_ref: 40dcd00772a2b863e050611aae3c151da87a2d21
