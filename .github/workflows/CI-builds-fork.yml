name: CI-builds-fork

on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - '**.md'

permissions:
  contents: read

jobs:
  run:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') && (github.event.pull_request.head.repo.fork) }}
    # The dedicated immutable callee cannot request scopes beyond contents:read.
    # Its build steps match trusted CI, including exact dependency caches.
    uses: sysown/proxysql/.github/workflows/ci-builds-untrusted.yml@c52411e76b19de90f00318295ebf2567ac88e9eb
    with:
      trusted: false
      control_ref: c52411e76b19de90f00318295ebf2567ac88e9eb
