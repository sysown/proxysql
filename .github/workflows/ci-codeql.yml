name: CI-CodeQL
on:
  workflow_call:
    # Keep the old producer inputs while the default-branch caller is updated.
    # Producer/PR events are rejected by the job guard below.
    inputs:
      trigger:
        type: string
      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: ''
jobs:
  analyze:
    name: v3.0 / ${{ matrix.language }}
    if: ${{ github.repository == 'sysown/proxysql' && github.ref == 'refs/heads/v3.0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, python]
    steps:
    - name: Update
      run: sudo apt-get update
    - name: Install build tools
      run: sudo apt-get -y install make automake git wget gcc g++ libtool equivs python3
    - name: Install build dependencies
      run: sudo apt-get -y install libssl-dev gnutls-dev libgnutls28-dev libmysqlclient-dev libboost-all-dev libunwind8 libunwind-dev uuid-dev ca-certificates
    - name: Checkout v3.0
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        # The caller is restricted to v3.0; pin both languages to its same
        # triggering commit even when a hosted runner queues for a while.
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: proxysql
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b
      with:
        languages: ${{ matrix.language }}
    - if: matrix.language == 'cpp'
      name: Build C++
      run: |
        cd proxysql
        make -j"$(nproc)" clickhouse
      env:
        PROXYSQL40: ''
        PROXYSQL31: ''
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b
      with:
        checkout_path: proxysql/
        category: v30-${{ matrix.language }}
