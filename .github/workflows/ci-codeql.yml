name: CI-CodeQL
'on':
  workflow_call:
    inputs:
      trigger:
        type: string
      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: ''
jobs:
  tier-context:
    uses: ./.github/workflows/ci-tier-context.yml
    with:
      trigger: ${{ inputs.trigger }}
      consumer_id: ${{ inputs.consumer_id }}
      control_ref: ${{ inputs.control_ref }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
      consumer_file: ci-codeql.yml
      consumer_inputs: ${{ toJson(inputs) }}
    secrets: inherit
  analyze:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tier-context.outputs.matrices)['analyze'] || fromJson('[{}]') }}
    env:
      TESTDIST: ${{ matrix.testdist }}
      MATRIX: (${{ matrix.language }})
      SHA: ${{ needs.tier-context.outputs.sha }}
      CI_BINDING: ${{ needs.tier-context.outputs.binding }}
      CI_LEG: ${{ toJson(matrix) }}
      TIER: ${{ matrix.tier }}
      COVERAGE: ${{ matrix.coverage && '1' || '0' }}
    steps:
    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-context.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Start selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
    - name: Update
      run: sudo apt-get update
    - name: Install build tools
      run: sudo apt-get -y install make automake git wget gcc g++ libtool equivs python3
    - name: Install build dependencies
      run: sudo apt-get -y install libssl-dev gnutls-dev libgnutls28-dev libmysqlclient-dev libboost-all-dev libunwind8 libunwind-dev uuid-dev ca-certificates
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        fetch-depth: 0
        path: proxysql
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b
      with:
        languages: ${{ matrix.language }}
    - if: matrix.language == 'cpp'
      name: Build C++
      run: |
        cd proxysql
        make -j"$(nproc)" clickhouse
      env:
        PROXYSQL40: ${{ matrix.tier == 'v40' && '1' || '' }}
        PROXYSQL31: ${{ matrix.tier == 'v31' && '1' || '' }}
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b
      with:
        checkout_path: proxysql/
        category: ${{ matrix.tier }}-${{ matrix.language }}
    - name: Complete selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ always() }}
    needs:
    - tier-context
    if: ${{ needs.tier-context.result == 'success' && fromJson(needs.tier-context.outputs.matrices)['analyze'][0] != null }}
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
  tier-summary:
    permissions:
      actions: read
      checks: write
      contents: read
    needs:
    - tier-context
    - analyze
    if: ${{ always() && needs.tier-context.result == 'success' }}
    uses: ./.github/workflows/ci-tier-summary.yml
    with:
      binding: ${{ needs.tier-context.outputs.binding }}
      control_ref: ${{ needs.tier-context.outputs.control_sha }}
    secrets: inherit
