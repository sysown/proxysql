name: CI-pg-compat
jobs:
  tier-selection:
    uses: ./.github/workflows/ci-tier-selection.yml
    with:
      control_ref: ${{ inputs.control_ref || 'GH-Actions' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
  pg-compat:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Build selected ProxySQL product (debug)
      run: make -j"$(nproc)" debug
      env:
        PROXYSQL40: ${{ matrix.tier == 'v40' && '1' || '' }}
        PROXYSQL31: ${{ matrix.tier == 'v31' && '1' || '' }}
    - name: Log in to GHCR and pull CI base image
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5; do
          echo ">>> GHCR login and pull attempt ${attempt}/5"
          if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
              && docker pull ghcr.io/sysown/proxysql-ci-base:latest; then
            docker tag ghcr.io/sysown/proxysql-ci-base:latest proxysql-ci-base:latest
            exit 0
          fi
          [ "$attempt" -eq 5 ] || sleep $((attempt * 10))
        done
        exit 1

    - name: Stand up infra (backends + Toxiproxy + ProxySQL)
      env:
        INFRA_ID: ci-${{ matrix.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
        WORKSPACE: ${{ github.workspace }}
        TAP_GROUP: pg-compat
      run: test/infra/control/ensure-infras.bash
    - name: Run pg-compat suite (non-gating, discovery phase)
      timeout-minutes: 90
      env:
        INFRA_ID: ci-${{ matrix.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
        WORKSPACE: ${{ github.workspace }}
      run: test/pg-compat/run-pg-compat.bash --junitxml=/pg-compat-reports/pg-compat.xml -rxX || true
    - name: Fix report ownership
      if: always()
      run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/pg-compat-reports" || true
    - name: Publish report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pg-compat-report-${{ matrix.tier }}-attempt${{ github.run_attempt }}
        path: ${{ github.workspace }}/pg-compat-reports/pg-compat.xml
        if-no-files-found: warn
    - name: Cleanup
      if: always()
      env:
        INFRA_ID: ci-${{ matrix.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
        WORKSPACE: ${{ github.workspace }}
        TAP_GROUP: pg-compat
      run: |
        set +e
        docker logs "proxysql.${INFRA_ID}" 2>&1 | tail -50 || true
        test/infra/control/stop-proxysql-isolated.bash
        test/infra/control/destroy-infras.bash
    needs: tier-selection
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.tier-selection.outputs.tiers) }}
    name: PostgreSQL compatibility / ${{ matrix.tier }}
'on':
  workflow_dispatch: null
  workflow_call:
    inputs:
      control_ref:
        type: string
        default: GH-Actions
      trigger:
        type: string
