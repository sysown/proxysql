name: CI-CodeQL
run-name: v3.0 CI-CodeQL ${{ github.sha }} (${{ github.event_name }})
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
concurrency:
  group: CI-CodeQL-nightly-v3.0
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  run:
    if: ${{ github.repository == 'sysown/proxysql' && github.ref == 'refs/heads/v3.0' }}
    uses: sysown/proxysql/.github/workflows/ci-codeql.yml@GH-Actions
