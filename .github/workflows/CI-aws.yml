name: CI-AWS

on:
  pull_request:
    paths:
      - '.github/workflows/CI-aws.yml'
      - 'Makefile'
      - 'deps/aws-sdk-cpp/**'
      - 'deps/Makefile'
      - 'common_mk/aws_sdk_cpp_flags.mk'
      - 'include/Aws_Iam_Sdk.h'
      - 'include/ProxySQL_Plugin.h'
      - 'include/makefiles_paths.mk'
      - 'lib/Aws_Iam_Sdk.cpp'
      - 'lib/Makefile'
      - 'lib/ProxySQL_PluginManager.cpp'
      - 'plugins/aws/**'
      - 'src/Makefile'
      - 'src/main.cpp'
      - 'etc/proxysql.cnf'
      - 'docker/images/proxysql/**'
      - 'test/infra/control/check-vendored-aws-sdk-build.bash'
      - 'test/tap/tests/**aws_iam**'
      - 'test/tap/tests/**aws_plugin**'
      - 'test/tap/tests/unit/Makefile'
      - 'README.md'
      - 'doc/aws_iam_database_authentication.md'
      - 'doc/PLUGIN_API.md'
  push:
    branches: [v3.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-free-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: 'false'
          lfs: true
          fetch-depth: 0
      - name: Build v4 daemon and general AWS plugin
        run: PROXYSQL40=1 make -j
      - name: Require an SDK-free daemon
        run: |
          daemon_nm="$RUNNER_TEMP/proxysql.nm"
          daemon_ldd="$RUNNER_TEMP/proxysql.ldd"
          nm -C src/proxysql >"$daemon_nm"
          ldd src/proxysql >"$daemon_ldd"
          if grep -Fq 'Aws::' "$daemon_nm"; then
            echo 'SDK-free daemon unexpectedly contains AWS C++ SDK symbols' >&2
            exit 1
          fi
          aws_dso_pattern='aws-cpp-sdk|aws-crt-cpp|aws-c-[[:alnum:]_-]+|aws-checksums|aws-lc|s2n'
          if grep -Eq "$aws_dso_pattern" "$daemon_ldd"; then
            echo 'SDK-free daemon unexpectedly links an AWS SDK or CRT DSO' >&2
            exit 1
          fi
      - name: Build and run controlled TLS/protocol coverage
        run: |
          PROXYSQL40=1 make -C test/tap/tests -j test_aws_iam_backend_auth-t
          timeout 45s test/tap/tests/test_aws_iam_backend_auth-t

  aws-vendored-plugin-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: 'false'
          lfs: true
          fetch-depth: 0
      - name: Verify immutable vendored SDK bundle
        run: bash test/infra/control/check-vendored-aws-sdk-build.bash
      - name: Build static AWS plugin
        run: PROXYSQL40=1 make -j
      - name: Verify plugin ownership and static linkage
        run: |
          PROXYSQL40=1 make -j -C test/tap/tests/unit \
            aws_plugin_linkage-t aws_plugin_load_unit-t
          test/tap/tests/unit/aws_plugin_load_unit-t
          daemon_nm="$RUNNER_TEMP/proxysql.nm"
          plugin_nm="$RUNNER_TEMP/aws-plugin.nm"
          nm -C src/proxysql >"$daemon_nm"
          nm -C plugins/aws/ProxySQL_Aws_Plugin.so >"$plugin_nm"
          if grep -Fq 'Aws::' "$daemon_nm"; then
            echo 'daemon unexpectedly contains AWS C++ SDK symbols' >&2
            exit 1
          fi
          if ! grep -Fq 'Aws::RDS::RDSClient::GenerateConnectAuthToken' "$plugin_nm"; then
            echo 'plugin does not contain the static RDS signer' >&2
            exit 1
          fi
          aws_dso_pattern='aws-cpp-sdk|aws-crt-cpp|aws-c-[[:alnum:]_-]+|aws-checksums|aws-lc|s2n'
          for artifact in src/proxysql plugins/aws/ProxySQL_Aws_Plugin.so; do
            artifact_ldd="$RUNNER_TEMP/$(basename "$artifact").ldd"
            ldd "$artifact" >"$artifact_ldd"
            if grep -Eq "$aws_dso_pattern" "$artifact_ldd"; then
              echo "$artifact unexpectedly dynamically links an AWS SDK or CRT library" >&2
              exit 1
            fi
          done

  fake-provider-sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: 'false'
          lfs: true
          fetch-depth: 0
      - name: Relax ASLR for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build ASan fake-provider tests
        if: matrix.sanitizer == 'asan'
        run: |
          NOJEMALLOC=1 WITHASAN=1 PROXYSQL40=1 make -j build_lib_debug
          NOJEMALLOC=1 WITHASAN=1 PROXYSQL40=1 make -C test/tap/tests/unit -j \
            aws_iam_token_manager_unit-t aws_iam_connection_secret_unit-t \
            aws_iam_completion_queue_unit-t aws_iam_session_state_unit-t
      - name: Run ASan fake-provider tests
        if: matrix.sanitizer == 'asan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          test/tap/tests/unit/aws_iam_token_manager_unit-t
          test/tap/tests/unit/aws_iam_connection_secret_unit-t
          test/tap/tests/unit/aws_iam_completion_queue_unit-t
          test/tap/tests/unit/aws_iam_session_state_unit-t
      - name: Build TSan fake-provider tests
        if: matrix.sanitizer == 'tsan'
        run: |
          NOJEMALLOC=1 WITHTSAN=1 PROXYSQL40=1 make -j build_lib_debug
          NOJEMALLOC=1 WITHTSAN=1 PROXYSQL40=1 make -C test/tap/tests/unit -j \
            aws_iam_token_manager_unit-t aws_iam_completion_queue_unit-t \
            aws_iam_session_state_unit-t
      - name: Run TSan fake-provider tests
        if: matrix.sanitizer == 'tsan'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          test/tap/tests/unit/aws_iam_token_manager_unit-t
          test/tap/tests/unit/aws_iam_completion_queue_unit-t
          test/tap/tests/unit/aws_iam_session_state_unit-t

  real-aws-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: aws-iam-integration
    outputs:
      configured: ${{ steps.integration-config.outputs.configured }}
    env:
      AWS_IAM_ROLE_ARN: ${{ secrets.AWS_IAM_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
      RDS_PORT: ${{ secrets.RDS_PORT }}
      RDS_DB_USER: ${{ secrets.RDS_DB_USER }}
      RDS_CA_FILE: ${{ secrets.RDS_CA_FILE }}
      AWS_IAM_INTEGRATION_RUNNER: ${{ secrets.AWS_IAM_INTEGRATION_RUNNER }}
    steps:
      - name: Check protected integration contract
        id: integration-config
        shell: bash
        run: |
          integration_present=false
          integration_missing=false
          for name in AWS_IAM_ROLE_ARN AWS_REGION RDS_ENDPOINT RDS_PORT \
              RDS_DB_USER RDS_CA_FILE AWS_IAM_INTEGRATION_RUNNER; do
            if [[ -n ${!name:-} ]]; then
              integration_present=true
            else
              integration_missing=true
            fi
          done
          if [[ $integration_present == false ]]; then
            echo 'configured=false' >>"$GITHUB_OUTPUT"
            echo 'Real AWS IAM integration skipped: protected environment configuration is absent.'
            exit 0
          fi
          if [[ $integration_missing == true ]]; then
            echo 'Real AWS IAM integration unavailable: protected environment configuration is partial.' >&2
            exit 1
          fi
          echo 'configured=true' >>"$GITHUB_OUTPUT"

  real-aws-integration:
    needs: real-aws-preflight
    if: needs.real-aws-preflight.outputs.configured == 'true'
    runs-on: [self-hosted, linux, x64, aws-iam-integration]
    timeout-minutes: 90
    environment: aws-iam-integration
    permissions:
      contents: read
      id-token: write
    env:
      AWS_IAM_ROLE_ARN: ${{ secrets.AWS_IAM_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
      RDS_PORT: ${{ secrets.RDS_PORT }}
      RDS_DB_USER: ${{ secrets.RDS_DB_USER }}
      RDS_CA_FILE: ${{ secrets.RDS_CA_FILE }}
      AWS_IAM_INTEGRATION_RUNNER: ${{ secrets.AWS_IAM_INTEGRATION_RUNNER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: 'false'
          lfs: true
          fetch-depth: 0
      - name: Require external real-RDS runner
        run: |
          if [[ $AWS_IAM_INTEGRATION_RUNNER != /* || \
                ! -x $AWS_IAM_INTEGRATION_RUNNER ]]; then
            echo 'Real AWS IAM integration unavailable: configured external runner is not an executable absolute path.' >&2
            exit 1
          fi
          if [[ $RDS_CA_FILE != /* || ! -f $RDS_CA_FILE || \
                ! -r $RDS_CA_FILE ]]; then
            echo 'Real AWS IAM integration unavailable: configured RDS CA is not a readable absolute file.' >&2
            exit 1
          fi
      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      - name: Run externally provisioned real-RDS suite
        env:
          RUN_AWS_IAM_INTEGRATION: '1'
        run: '"$AWS_IAM_INTEGRATION_RUNNER"'
