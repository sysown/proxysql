name: CI-3p-sqlalchemy

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string
#      testtree:
#        type: string
      infradb:
        type: string
      connector:
        type: string
      # Cross-repository callers (e.g. ProxySQL/proxysql_3p_testing_public) pass the tested ProxySQL
      # repository, commit, branch and CI-builds run explicitly. Empty = the sysown/proxysql caller's
      # workflow_run event, as before.
      proxysql_repo:
        type: string
        default: ''
      sha:
        type: string
        default: ''
      branch:
        type: string
        default: ''
      build_run_id:
        type: string
        default: ''
    # Declared so that callers outside this organization can pass them explicitly: 'secrets: inherit'
    # only works for callers in the same organization/enterprise (sysown/proxysql callers are unchanged).
    secrets:
      GH_TOKEN_PROXYSQL:
        required: false
      PROXYSQL_3P_TESTING_DEPLOY_KEY:
        required: false
      PROXYSQL_ARTIFACTS_TOKEN:
        required: false

env:
  TESTTREE: ${{ inputs.testtree || inputs.trigger.event.inputs.testtree || 'main' }}
  TESTNAME: sqlalchemy
  TESTDIST: ubuntu24
  PROXYSQL_REPO: ${{ inputs.proxysql_repo || github.repository }}
  SHA: ${{ inputs.sha || inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
  BRANCH: ${{ inputs.branch || inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_branch || github.ref_name }}
  SUMMARY: ''

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
#        infradb: [ 'mysql57', 'mysql80', 'mysql81', 'mysql82', 'mysql83', 'mysql84', 'mysql90', 'mariadb10', 'mariadb11' ]
#        infradb: [ 'mysql57', 'mysql80', 'mysql84', 'mysql90' ]
        infradb: ${{ fromJson( inputs.infradb ) }}
#        connector: [ 'pymysql', 'mysqldb', 'asyncmy', 'mariadbconnector' ]
        connector: ${{ fromJson( inputs.connector ) }}
    env:
      INFRADB:  ${{ matrix.infradb }}
      CONNECTOR: ${{ matrix.connector }}
      MATRIX: '(${{ matrix.infradb }},${{ matrix.connector }})'
    outputs:
      summary: ${{ steps.check_baseline.outputs.summary }}
        
    steps:
        
    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      id: checks
      if: ${{ always() && env.PROXYSQL_REPO == github.repository }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: '${{ github.workflow }} / ${{ github.job }} ${{ env.MATRIX }}'
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        status: 'in_progress'
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    
    - name: Checkout proxysql_3p_testing
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: 'proxysql/proxysql_3p_testing'
        ref: ${{ env.TESTTREE }}
        fetch-depth: 1
        path: 'proxysql_3p_testing'
        # nothing later in the job needs git credentials, keep the PAT out of .git/config
        persist-credentials: false
        token: ${{ secrets.GH_TOKEN_PROXYSQL || github.token }}
        # optional read-only deploy key of proxysql/proxysql_3p_testing, used instead of the token when set
        # (cross-repository callers that do not hold GH_TOKEN_PROXYSQL)
        ssh-key: ${{ secrets.PROXYSQL_3P_TESTING_DEPLOY_KEY }}
        sparse-checkout: |
          common
          libs
          test_${{ env.TESTNAME }}
#          proxysql

    - name: Checkout proxysql
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ env.PROXYSQL_REPO }}
        ref: ${{ env.SHA }}
        # full (blobless) history so 'git describe' reports the tested version
        fetch-depth: 0
        filter: 'blob:none'
        path: 'proxysql'
        # the checkout is moved into the harness and mounted into the test containers, keep the token out of .git/config
        persist-credentials: false
        # include/lib/src so fastcov can resolve the gcov sources
        sparse-checkout: |
          include
          lib
          src

    - name: Download build handoff
      # CI-builds publishes the v4.0 tier (PROXYSQL40=1 WITHGCOV=1) ubuntu24 debug build as the
      # ci-builds-handoff-<sha>-ubuntu24-tap-genai-gcov-full artifact (same resolution logic as
      # ci-mysql84-g1.yml). Only src/ and the .gcno files are unpacked, the TAP binaries are not needed.
      env:
        # PROXYSQL_ARTIFACTS_TOKEN: optional, for callers whose token cannot read PROXYSQL_REPO artifacts
        GH_TOKEN: ${{ secrets.PROXYSQL_ARTIFACTS_TOKEN || secrets.GITHUB_TOKEN }}
        REPO: ${{ env.PROXYSQL_REPO }}
        BUILD_RUN_ID: ${{ inputs.build_run_id || inputs.trigger && fromJson(inputs.trigger).event.workflow_run.id || '' }}
        HANDOFF_VARIANT: ubuntu24-tap-genai-gcov
      run: |
        set -uo pipefail
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        : "${HANDOFF_MAX_ATTEMPTS:=20}"   # bounded: 20 x 15s = up to ~5 min
        ERRLOG="$(mktemp)"
        resolve_aid() {
          local name="$1" out=""
          if [ -n "${BUILD_RUN_ID:-}" ]; then
            out=$(gh api "repos/${REPO}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
                    --jq "[.artifacts[]|select(.name==\"${name}\" and .expired==false)]|sort_by(.created_at)|last|.id // empty" 2>>"$ERRLOG") || true
            [ -n "$out" ] && { printf '%s' "$out"; return 0; }
          fi
          out=$(gh api "repos/${REPO}/actions/artifacts?name=${name}&per_page=100" \
                  --jq '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id // empty' 2>>"$ERRLOG") || true
          [ -n "$out" ] && { printf '%s' "$out"; return 0; }
          return 1
        }
        name="ci-builds-handoff-${SHA}-${HANDOFF_VARIANT}-full"
        aid=""
        for attempt in $(seq 1 "$HANDOFF_MAX_ATTEMPTS"); do
          aid=$(resolve_aid "$name") && [ -n "$aid" ] && break
          aid=""
          echo ">>> ${name} not resolvable yet (${attempt}/${HANDOFF_MAX_ATTEMPTS}); sleeping 15s"; sleep 15
        done
        if [ -z "$aid" ]; then
          echo "ERROR: handoff artifact ${name} not found after ${HANDOFF_MAX_ATTEMPTS} attempts (build_run=${BUILD_RUN_ID:-n/a}) -- did CI-builds succeed for ${SHA}?" >&2
          echo "--- last gh errors ---" >&2; tail -n 20 "$ERRLOG" >&2
          exit 1
        fi
        echo ">>> downloading ${name} (id=${aid})"
        gh api "repos/${REPO}/actions/artifacts/${aid}/zip" > handoff-full.zip || { echo "ERROR: download ${name} failed" >&2; exit 1; }
        cd proxysql/
        unzip -p ../handoff-full.zip cache_full.tar.zst | zstd -d | tar -xf - --wildcards 'src/*' 'lib/obj/*' \
          || { echo "ERROR: unpack ${name} failed" >&2; exit 1; }
        rm -f ../handoff-full.zip
        chmod +x src/proxysql
        file src/proxysql

    - name: Prepare
      run: |
        set +e

        cd proxysql_3p_testing/
        ./setup.sh test_${{ env.TESTNAME }}/${{ env.TESTNAME }}
        #git switch ${{ env.TESTTREE }}
        #git config user.email "GH-Actions@proxysql.com"
        #git config user.name "GH-Actions"
        #git rebase main -f -s recursive -X theirs

        sed -i 's|image: .*|image: ghcr.io/mrmohebi/docker-hoster|' common/infra-docker-hoster/docker-compose.yml

        # use the CI-builds handoff (ubuntu24, v4.0 tier)
        rm -rf ./proxysql && mv ../proxysql .
        ls -l proxysql/src/proxysql
        git -C ./proxysql describe --long --abbrev=7

    - name: Run tests
      timeout-minutes: 90
      run: |
        set +e
        
        cd proxysql_3p_testing/test_${{ env.TESTNAME }}
        #./run-tests.bash test/dialect
        ./run-tests.bash
        RC=$?
        
        #sudo chmod -R 777 ${{ github.workspace }}/*
        exit $RC
        
    - name: Check baseline
      if: ${{ !cancelled() }}
      id: check_baseline
      run: |
        set +e
        cd proxysql_3p_testing/test_${{ env.TESTNAME }}

        GHUSER="$(id -u):$(id -g)"
        sudo chown -R ${GHUSER} ./logs

        if ! ls ./logs/*/*_summary.log 1>/dev/null 2>&1; then
          echo "ERROR: No summary log found — tests likely did not run"
          STATUS='ERROR'
          SUM="{'STATUS':'${STATUS}','INFRADB':'${INFRADB}','CONNECTOR':'${CONNECTOR}','FAILS':x,'ERRORS':x}"
          echo "SUMMARY=${SUM}"
          echo "SUMMARY="${SUM//\'/\"} >> $GITHUB_ENV
          exit 1
        fi

        cat ./logs/*/*_summary.log
        # raw value of every "FAIL: <n>" / "ERROR: <n>" line of every summary: the totals are printed more
        # than once and "FAIL: -" means no baseline matched. Any non-integer value is kept verbatim, so the
        # integer checks below fail; otherwise the highest count, so any summary with failures fails the step.
        FAIL_VALUES=$(cat ./logs/*/*_summary.log | grep -oP '(?<=^FAIL: )\S+' | sort -u)
        ERROR_VALUES=$(cat ./logs/*/*_summary.log | grep -oP '(?<=^ERROR: )\S+' | sort -u)
        if grep -qvxE '[0-9]+' <<< "${FAIL_VALUES}"; then
          FAILS="${FAIL_VALUES//$'\n'/,}"
        else
          FAILS=$(sort -n <<< "${FAIL_VALUES}" | tail -1)
        fi
        ERRORS=''
        if [[ -n "${ERROR_VALUES}" ]]; then
          if grep -qvxE '[0-9]+' <<< "${ERROR_VALUES}"; then
            ERRORS="${ERROR_VALUES//$'\n'/,}"
          else
            ERRORS=$(sort -n <<< "${ERROR_VALUES}" | tail -1)
          fi
        fi

        STATUS='PASS'
        [[ "${FAILS}" =~ ^[0-9]+$ && ${FAILS} -ne 0 ]] && STATUS='FAIL'
        [[ "${ERRORS}" =~ ^[0-9]+$ && ${ERRORS} -ne 0 ]] && STATUS='FAIL'
        [[ "${FAILS}" =~ ^[0-9]+$ && ( -z "${ERRORS}" || "${ERRORS}" =~ ^[0-9]+$ ) ]] || STATUS='ERROR'

        SUM="{'STATUS':'${STATUS}','INFRADB':'${INFRADB}','CONNECTOR':'${CONNECTOR}','FAILS':${FAILS:-x},'ERRORS':${ERRORS:-0}}"
        echo "SUMMARY=${SUM}"
        echo "SUMMARY="${SUM//\'/\"} >> $GITHUB_ENV

        if ! [[ "${FAILS}" =~ ^[0-9]+$ ]]; then
          echo "ERROR: Could not parse FAIL count from summary log: '${FAILS}'"
          exit 1
        fi
        if [[ ${FAILS} -ne 0 ]]; then
          echo "FAILED: ${FAILS} test failure(s)"
          exit 1
        fi
        if [[ -n "${ERRORS}" && ! "${ERRORS}" =~ ^[0-9]+$ ]]; then
          echo "ERROR: Could not parse ERROR count from summary log: '${ERRORS}'"
          exit 1
        fi
        if [[ -n "${ERRORS}" && ${ERRORS} -ne 0 ]]; then
          echo "FAILED: ${ERRORS} test error(s) (setup/fixture failures)"
          exit 1
        fi

        echo "All tests passed"

    - name: Summary output
      if: ${{ !cancelled() }}
      uses: hoverkraft-tech/ci-github-common/actions/set-matrix-output@d6367a8f0299d93cca9b42e287a56d2157f72060 # 0.14.0
      with:
        value: ${{ env.SUMMARY }}
        artifact-name: ${{ github.run_number }}-${{ matrix.infradb }}-summary

    - name: Archive artifacts logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-${{ matrix.infradb }}-${{ matrix.connector }}-logs-run#${{ github.run_number }}
        path: |
          proxysql_3p_testing/test_${{ env.TESTNAME }}/logs
          
    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      if: ${{ always() && env.PROXYSQL_REPO == github.repository }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        check_id: ${{ steps.checks.outputs.check_id }}
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        conclusion: ${{ job.status }}
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'


  summarize:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: [ test ]
    continue-on-error: true
    if: ${{ !cancelled() }}
    steps:
      - name: Collect summary
        id: collect
        uses: hoverkraft-tech/ci-github-common/actions/get-matrix-outputs@d6367a8f0299d93cca9b42e287a56d2157f72060 # 0.14.0
        with:
          artifact-name: ${{ github.run_number }}-${{ matrix.infradb }}-summary
          remove-artifact: true
      
      - name: Output summary
        run:
          #echo '${{ steps.collect.outputs.result }}' | jq -c '.[]' | sort
          echo '${{ steps.collect.outputs.result }}' | jq -c '.[]' | sort >> $GITHUB_STEP_SUMMARY
