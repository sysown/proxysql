name: CI-3p-sqlalchemy

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string
#      testtree:
#        type: string
      infradb:
        type: string
      connector:
        type: string

env:
  TESTTREE: ${{ inputs.testtree || inputs.trigger.event.inputs.testtree || 'main' }}
  TESTNAME: sqlalchemy
  TESTDIST: debian12
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
  BRANCH: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_branch || github.ref_name }}
  SUMMARY: ''

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
#        infradb: [ 'mysql57', 'mysql80', 'mysql81', 'mysql82', 'mysql83', 'mysql84', 'mysql90', 'mariadb10', 'mariadb11' ]
#        infradb: [ 'mysql57', 'mysql80', 'mysql84', 'mysql90' ]
        infradb: ${{ fromJson( inputs.infradb ) }}
#        connector: [ 'pymysql', 'mysqldb', 'asyncmy', 'mariadbconnector' ]
        connector: ${{ fromJson( inputs.connector ) }}
    env:
      INFRADB:  ${{ matrix.infradb }}
      CONNECTOR: ${{ matrix.connector }}
      BLDCACHE: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}_debian12-dbg_bin
      MATRIX: '(${{ matrix.infradb }},${{ matrix.connector }})'
    outputs:
      summary: ${{ steps.check_baseline.outputs.summary }}
        
    steps:
        
    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      id: checks
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: '${{ github.workflow }} / ${{ github.job }} ${{ env.MATRIX }}'
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        status: 'in_progress'
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    
    - name: Checkout proxysql_3p_testing
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: 'proxysql/proxysql_3p_testing'
        ref: ${{ env.TESTTREE }}
        fetch-depth: 1
        path: 'proxysql_3p_testing'
        token: ${{ secrets.GH_TOKEN_PROXYSQL }}
        sparse-checkout: |
          common
          libs
          test_${{ env.TESTNAME }}
#          proxysql

#    - name: Wait for cache
#      if: ${{ env.BRANCH != 'none' }}
#      env:
#        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#      run: |
#        echo "Wating for cache '${BLDCACHE}' ..."
#        sleep $(( $RANDOM / 1024 ))
#        PROBE="$(gh cache list --limit 300 --repo ${{ github.repository }} | grep -i ${BLDCACHE} || echo '')"
#        while [[ -z ${PROBE} ]]; do
#          echo "Wating for cache '${BLDCACHE}' ..."
#          sleep 30
#          PROBE="$(gh cache list --limit 300 --repo ${{ github.repository }} | grep -i ${BLDCACHE} || echo '')"
#        done
#        echo "Cache available '${BLDCACHE}'"

    - name: Cache restore bin
      if: ${{ env.BRANCH != 'none' }}
      uses: actions/cache/restore@v4
      with:
        key: ${{ env.BLDCACHE }}
        fail-on-cache-miss: true
        path: cache_bin.tar.zst

    - name: Unpack bin cache
      if: ${{ env.BRANCH != 'none' }}
      run: |
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        cd proxysql/
        zstd -d < ../cache_bin.tar.zst | tar -xf -
        rm ../cache_bin.tar.zst
        
    - name: Prepare
      run: |
        set +e

        cd proxysql_3p_testing/
        ./setup.sh test_${{ env.TESTNAME }}/${{ env.TESTNAME }}
        #git switch ${{ env.TESTTREE }}
        #git config user.email "GH-Actions@proxysql.com"
        #git config user.name "GH-Actions"
        #git rebase main -f -s recursive -X theirs

        sed -i 's|image: .*|image: ghcr.io/mrmohebi/docker-hoster|' common/infra-docker-hoster/docker-compose.yml

        # use cached build
        rm -rf ./proxysql && mv ../proxysql . || true
        ls -l proxysql/binaries/
        git -C ./proxysql describe --long --abbrev=7 

    - name: Run tests
      timeout-minutes: 90
      run: |
        set +e
        
        cd proxysql_3p_testing/test_${{ env.TESTNAME }}
        #./run-tests.bash test/dialect
        ./run-tests.bash
        RC=$?
        
        #sudo chmod -R 777 ${{ github.workspace }}/*
        exit $RC
        
    - name: Check baseline
      if: ${{ !cancelled() }}
      id: check_baseline
      run: |
        set +e
        cd proxysql_3p_testing/test_${{ env.TESTNAME }}

        GHUSER="$(id -u):$(id -g)"
        sudo chown -R ${GHUSER} ./logs

        if ! ls ./logs/*/*_summary.log 1>/dev/null 2>&1; then
          echo "ERROR: No summary log found — tests likely did not run"
          STATUS='ERROR'
          SUM="{'STATUS':'${STATUS}','INFRADB':'${INFRADB}','CONNECTOR':'${CONNECTOR}','FAILS':x,'ERRORS':x}"
          echo "SUMMARY=${SUM}"
          echo "SUMMARY="${SUM//\'/\"} >> $GITHUB_ENV
          exit 1
        fi

        cat ./logs/*/*_summary.log
        FAILS=$(cat ./logs/*/*_summary.log | grep -oP '(?<=^FAIL: )\d+')
        ERRORS=$(cat ./logs/*/*_summary.log | grep -oP '(?<=^ERROR: )\d+')

        STATUS='PASS'
        [[ -z ${FAILS} ]] && STATUS='ERROR'
        [[ ${FAILS} -ne 0 ]] && STATUS='FAIL'
        [[ -n "${ERRORS}" && ${ERRORS} -ne 0 ]] && STATUS='FAIL'

        SUM="{'STATUS':'${STATUS}','INFRADB':'${INFRADB}','CONNECTOR':'${CONNECTOR}','FAILS':${FAILS:-x},'ERRORS':${ERRORS:-0}}"
        echo "SUMMARY=${SUM}"
        echo "SUMMARY="${SUM//\'/\"} >> $GITHUB_ENV

        if [[ -z "${FAILS}" ]]; then
          echo "ERROR: Could not parse FAIL count from summary log"
          exit 1
        fi
        if [[ ${FAILS} -ne 0 ]]; then
          echo "FAILED: ${FAILS} test failure(s)"
          exit 1
        fi
        if [[ -n "${ERRORS}" && ${ERRORS} -ne 0 ]]; then
          echo "FAILED: ${ERRORS} test error(s) (setup/fixture failures)"
          exit 1
        fi

        echo "All tests passed"

    - name: Summary output
      if: ${{ !cancelled() }}
      uses: hoverkraft-tech/ci-github-common/actions/set-matrix-output@0.14.0
      with:
        value: ${{ env.SUMMARY }}
        artifact-name: ${{ github.run_number }}-${{ matrix.infradb }}-summary

    - name: Archive artifacts logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-${{ matrix.infradb }}-${{ matrix.connector }}-logs-run#${{ github.run_number }}
        path: |
          proxysql_3p_testing/test_${{ env.TESTNAME }}/logs
          
    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        check_id: ${{ steps.checks.outputs.check_id }}
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        conclusion: ${{ job.status }}
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'


  summarize:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: [ test ]
    continue-on-error: true
    if: ${{ !cancelled() }}
    steps:
      - name: Collect summary
        id: collect
        uses: hoverkraft-tech/ci-github-common/actions/get-matrix-outputs@0.14.0
        with:
          artifact-name: ${{ github.run_number }}-${{ matrix.infradb }}-summary
          remove-artifact: true
      
      - name: Output summary
        run:
          #echo '${{ steps.collect.outputs.result }}' | jq -c '.[]' | sort
          echo '${{ steps.collect.outputs.result }}' | jq -c '.[]' | sort >> $GITHUB_STEP_SUMMARY
