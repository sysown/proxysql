name: CI-package-amd64-opensuse16-genai
run-name: openSUSE recovery opensuse16-4.0.13-amd64 from e49994f4ab7a31ba1c70c98b4ac20ea51eaf4fd9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == 'release-3.0.13-opensuse-recovery-e49994f'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out pinned package source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e49994f4ab7a31ba1c70c98b4ac20ea51eaf4fd9
          fetch-depth: 0
          persist-credentials: false

      - name: Build RPM from pinned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e49994f4ab7a31ba1c70c98b4ac20ea51eaf4fd9
          test "$(git describe --long --abbrev=7)" = 3.0.13-613-ge49994f
          git diff --exit-code HEAD
          GITHUB_ACTIONS=false PROXYSQL40=1 make opensuse16
          cd binaries
          test -s proxysql-4.0.13-1-opensuse16.x86_64.rpm
          test -s proxysql-4.0.13-1-opensuse16.x86_64.id-hash
          sha256sum proxysql-4.0.13-1-opensuse16.x86_64.rpm proxysql-4.0.13-1-opensuse16.x86_64.id-hash > SHA256SUMS
          printf '%s\n' e49994f4ab7a31ba1c70c98b4ac20ea51eaf4fd9 > PACKAGE-SOURCE

      - name: Save RPM and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opensuse16-4.0.13-amd64
          path: |
            binaries/proxysql-4.0.13-1-opensuse16.x86_64.rpm
            binaries/proxysql-4.0.13-1-opensuse16.x86_64.id-hash
            binaries/SHA256SUMS
            binaries/PACKAGE-SOURCE
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Install and smoke-test on clean openSUSE
        shell: bash
        run: |
          set -euo pipefail
          original=test/infra/control/verify-package-install.bash
          verifier="$RUNNER_TEMP/verify-package-install.bash"
          test "$(grep -Fc 'sleep 120' "$original")" -eq 1
          sed 's/sleep 120/sleep infinity/' "$original" > "$verifier"
          bash -n "$verifier"
          timeout --kill-after=15s 15m bash "$verifier" "binaries/proxysql-4.0.13-1-opensuse16.x86_64.rpm"
