name: CI-mysql-router-ic-g1
run-name: "${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }} ${{ github.workflow }} ${{ github.event.workflow_run && github.event.workflow_run.head_sha || github.sha }} ${{ inputs.producer_run_id && format('producer={0}/{1}', inputs.producer_run_id, inputs.producer_attempt) || format('trigger={0}/{1}', github.event.workflow_run.id || github.run_id, github.event.workflow_run.run_attempt || github.run_attempt) }}"

on:
  workflow_dispatch:
    inputs:
      control_ref:
        type: string
        default: GH-Actions
        description: CI script ref; candidate workflow validation also requires repinning uses
      producer_run_id:
        type: string
        required: true
        description: Exact producer workflow run ID (manual tests)
      producer_attempt:
        type: string
        required: true
        description: Exact producer attempt (manual tests)
  workflow_run:
    workflows: [CI-trigger]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' || ! github.event.workflow_run }}
    # The shared ubuntu24 PROXYSQL40+GCOV handoff builds every chassis plugin.
    # mysql_router stages its real .so in test/tap/tap/_runtime_libs so this
    # group does not depend on the GenAI-only restore destination.
    permissions: write-all # NOSONAR: required by and consistent with the shared CI caller contract.
    uses: sysown/proxysql/.github/workflows/ci-ai-gcov.yml@GH-Actions # NOSONAR: repository-owned integration branch.
    secrets: inherit # NOSONAR: the shared CI workflow selects the credentials needed by its infrastructure.
    with:
      trigger: ${{ toJson(github) }}
      tap_group: mysql-router-ic-g1
      infra_id: ci-mysql-router-ic-g1
      consumer_id: run
      control_ref: ${{ inputs.control_ref || 'GH-Actions' }}
      producer_run_id: ${{ inputs.producer_run_id || '' }}
      producer_attempt: ${{ inputs.producer_attempt || '' }}
