name: CI-cluster-simulator
run-name: ${{ github.head_ref || github.ref_name }} ${{ github.workflow }} ${{ github.sha }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
env:
  RUNTIME_CACHE_DIR: .cluster-simulator-runtime
jobs:
  tier-selection:
    uses: sysown/proxysql/.github/workflows/ci-tier-selection.yml@GH-Actions
    permissions:
      contents: read
      actions: read
      pull-requests: read
  build:
    name: build / ${{ matrix.tier }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      groups: ${{ steps.simulator-groups.outputs.groups }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout CI verification code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-selection.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Discover simulation groups
      id: simulator-groups
      run: test/infra/control/cluster-simulator-ci.bash discover
    - name: Restore simulation build
      id: simulator-build
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: ${{ env.BUILD_CACHE_KEY }}
        path: ${{ env.RUNTIME_CACHE_DIR }}
    - name: Install cached simulation runtime
      if: steps.simulator-build.outputs.cache-hit == 'true'
      run: test/infra/control/cluster-simulator-ci.bash install
    - name: Build simulation test runtime
      timeout-minutes: 90
      if: steps.simulator-build.outputs.cache-hit != 'true'
      run: test/infra/control/cluster-simulator-ci.bash build
      env:
        PROXYSQL40: ${{ matrix.tier == 'v40' && '1' || '' }}
        PROXYSQL31: ${{ matrix.tier == 'v31' && '1' || '' }}
    - name: Verify simulation build
      run: test/infra/control/cluster-simulator-ci.bash verify
    - name: Verify compiled product tier
      env:
        EXPECTED_TIER: ${{ matrix.tier }}
      run: |
        python3 - <<'PY_TIER'
        import os
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path('ci-control/.github/scripts').resolve()))
        from ci_tier_artifacts import binary_version, validate_binary
        version = binary_version(Path.cwd())
        validate_binary(os.environ['EXPECTED_TIER'], version)
        print(version)
        PY_TIER
    - name: Stage simulation runtime
      if: steps.simulator-build.outputs.cache-hit != 'true'
      run: test/infra/control/cluster-simulator-ci.bash stage
    - name: Save simulation build
      if: steps.simulator-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: ${{ env.BUILD_CACHE_KEY }}
        path: ${{ env.RUNTIME_CACHE_DIR }}
    needs: tier-selection
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.tier-selection.outputs.tiers) }}
    env:
      BUILD_CACHE_KEY: cluster-simulator-v3-ubuntu24-${{ matrix.tier }}-${{ github.sha }}
  test:
    name: test / ${{ matrix.tier }} / ${{ matrix.group }}
    needs:
    - tier-selection
    - build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.build.outputs.groups) }}
        tier: ${{ fromJson(needs.tier-selection.outputs.tiers) }}
    env:
      INFRA_ID: ${{ matrix.group }}-${{ matrix.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
      TAP_GROUP: ${{ matrix.group }}
      COVERAGE: '1'
      BUILD_CACHE_KEY: cluster-simulator-v3-ubuntu24-${{ matrix.tier }}-${{ github.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout CI verification code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-selection.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Restore simulation build
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: ${{ env.BUILD_CACHE_KEY }}
        fail-on-cache-miss: true
        path: ${{ env.RUNTIME_CACHE_DIR }}
    - name: Install simulation runtime
      run: test/infra/control/cluster-simulator-ci.bash install
    - name: Verify simulation build
      run: test/infra/control/cluster-simulator-ci.bash verify "${TAP_GROUP}"
    - name: Verify compiled product tier
      env:
        EXPECTED_TIER: ${{ matrix.tier }}
      run: |
        python3 - <<'PY_TIER'
        import os
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path('ci-control/.github/scripts').resolve()))
        from ci_tier_artifacts import binary_version, validate_binary
        version = binary_version(Path.cwd())
        validate_binary(os.environ['EXPECTED_TIER'], version)
        print(version)
        PY_TIER
    - name: Build CI base image
      run: docker build --network host -t proxysql-ci-base:latest test/infra/docker-base
    - name: Start infrastructure
      run: test/infra/control/ensure-infras.bash
    - name: Run simulation tests
      timeout-minutes: 90
      run: test/infra/control/run-tests-isolated.bash
    - name: Cleanup
      if: always()
      run: |
        test/infra/control/stop-proxysql-isolated.bash || true
        test/infra/control/destroy-infras.bash || true
    - name: Require non-empty simulator coverage LCOV
      id: require-lcov
      if: always()
      run: test -s ci_infra_logs/${{ env.INFRA_ID }}/coverage-report/${{ env.INFRA_ID }}.info
    - name: Upload coverage to Codecov
      if: always() && steps.require-lcov.outcome == 'success'
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
      with:
        codecov_yml_path: codecov.yml
        override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
        files: ci_infra_logs/${{ env.INFRA_ID }}/coverage-report/${{ env.INFRA_ID }}.info
        flags: simulation-tests
        name: ${{ matrix.group }}-coverage-${{ matrix.tier }}
        use_oidc: true
        disable_search: true
        plugins: noop
        fail_ci_if_error: false
        verbose: true
    - name: Archive failure logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ matrix.group }}-${{ github.sha }}-logs-run${{ github.run_number }}-${{ matrix.tier }}-attempt${{ github.run_attempt }}
        path: ci_infra_logs/
'on':
  pull_request: null
  workflow_dispatch: null
