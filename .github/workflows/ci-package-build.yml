name: CI-package-build

on:
  workflow_dispatch:
    inputs:
      control_ref:
        type: string
        default: GH-Actions
  workflow_call:
    inputs:
      control_ref:
        type: string
        default: GH-Actions
      trigger:
        type: string

env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
  BRANCH: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_branch || github.ref_name }}
  BIN_PKG:

jobs:
  clean:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      gitdescribe: ${{ steps.gitdescribe.outputs.gitdescribe }}
    steps:
    
    - name: Git describe
      id: gitdescribe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERS=$(gh api repos/${{ github.repository }}/git/refs/tags/${BRANCH#v} | jq -r '.[-1].ref' | sed -e 's|refs/tags/||g')
        HASH=$(gh api repos/${{ github.repository }}/git/refs/heads/${BRANCH} | jq -r '.object.sha' | cut -c-7)
        CMTS=$(gh api repos/${{ github.repository }}/compare/${VERS}...${BRANCH} | jq -r '.ahead_by')
        echo "GIT_VERSION=${VERS}-${CMTS}-g${HASH}" >> $GITHUB_ENV
        echo "gitdescribe=${VERS}-${CMTS}-g${HASH}" >> $GITHUB_OUTPUT
    
    - name: Clean packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # gh release delete-asset ${BRANCH}-head
        gh release delete ${{ env.BRANCH }}-head --repo ${{ github.repository }} --cleanup-tag || true
        gh release create ${{ env.BRANCH }}-head --repo ${{ github.repository }} --title "${{ env.BRANCH }}-head - ${{ env.GIT_VERSION }}" --target ${{ env.SHA }} --draft --prerelease --notes-file - << EOF
        ## Development Snapshot
        
        GH-Action Package-Build on ${{ env.BRANCH }} merge
        
        Version : **${{ env.GIT_VERSION }}**
        
        Started : **$(date '+%Y-%m-%d %H:%M:%S %Z')**
        
        Status : **Build in progress**
        
        [![CI-Package-Build](https://github.com/${{ github.repository }}/actions/workflows/CI-package-build.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/CI-package-build.yml)
        
        EOF
   
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      dists: ${{ steps.select.outputs.dists }}
    steps:
    
    - name: Select distros
      id: select
      run: |
        set -x
        fn_get_targets () {
          # make -n amd64-packages | grep -i binaries/proxysql | wc -l
          # make -n arm64-packages | grep -i binaries/proxysql | wc -l
          # recursive get targets
          [[ -z ${MKFL} ]] && MKFL=$(curl -sL https://raw.githubusercontent.com/sysown/proxysql/${BRANCH}/Makefile)
          for TRG in ${@}; do
            local SUBTRG=$(echo "${MKFL}" | grep "${TRG}:")
            if [[ "${SUBTRG#*:}" =~ (arm64|amd64) ]]; then
              fn_get_targets ${SUBTRG#*:}
            else
              echo "${SUBTRG#*: }" | sed 's/ /\n/g'
            fi
          done
        }
        echo "dists=$(fn_get_targets amd64-packages | sed 's/-clang//g; s/-dbg//g' | sort | uniq | jq -Rcs 'split("\n") | .[:-1]')" >> $GITHUB_OUTPUT
        #echo "dists=$(fn_get_targets arm64-packages | sed 's/-clang//g; s/-dbg//g' | sort | uniq | jq -Rcs 'split("\n") | .[:-1]')" >> $GITHUB_OUTPUT
        #echo "dists=$(make pkglist | sed 's/proxysql[_0-9.-]*//g; s/[._].*//; s/dbg-//; s/-clang//' | sort | uniq | jq -Rcs 'split("\n") | .[:-1]')" >> $GITHUB_OUTPUT

  build:
    permissions:
      contents: read
      checks: write
      actions: read
    needs: [ clean, select ]
    strategy:
      fail-fast: false
      matrix:
#       # v2.7
#        dist: [ 'almalinux8','almalinux9','centos7','centos8','centos9','debian10','debian11','debian12','fedora38','fedora39','fedora40','fedora41','opensuse15','ubuntu16','ubuntu18','ubuntu20','ubuntu22','ubuntu24' ]
#       # v3.0
#        dist: [ 'almalinux8','almalinux9','centos9','debian12','fedora40','fedora41','opensuse15','ubuntu22','ubuntu24' ]
        arch: [ 'amd64','arm64' ]
        dist: ${{ fromJson(needs.select.outputs.dists) }}
        type: [ '','-dbg','-clang' ]
        exclude:
#         broken - clang too old
          - dist: 'centos7'
            type: '-clang'
          - dist: 'debian10'
            type: '-clang'
          - dist: 'ubuntu16'
            type: '-clang'
          - dist: 'ubuntu18'
            type: '-clang'
#         unneded - not build before v3.0.0
          - arch: 'arm64'
            type: '-clang'
          - arch: 'arm64'
            type: '-dbg'
#         tarball Compose only provides tarball_build
          - dist: 'tarball-almalinux9'
            type: '-clang'
          - dist: 'tarball-almalinux9'
            type: '-dbg'

    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
      DIST: ${{ matrix.dist }}
      TYPE: ${{ matrix.type }}
      MATRIX: '(${{ matrix.arch }},${{ matrix.dist }},${{ matrix.type }})'

    steps:

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      id: checks
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: '${{ github.workflow }} / ${{ github.job }} ${{ env.MATRIX }}'
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        status: 'in_progress'
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    
    # This job builds a shippable package from source. Vendored dependency
    # archives are committed directly to git (no Git LFS), so a plain
    # checkout already contains the real archives.
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        fetch-depth: 0
        persist-credentials: false

    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ inputs.control_ref || 'GH-Actions' }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Restore or build exact dependency bundles
      id: dependencies
      uses: ./ci-control/.github/actions/dependency-cache
      with:
        source-path: .
        service: ${{ startsWith(matrix.dist, 'tarball') && 'tarball_build' || format('{0}{1}_build', matrix.dist, matrix.type == '-dbg' && '_dbg' || matrix.type == '-clang' && '_clang' || '') }}
        tier: v30
        sanitizer: none
        coverage: 'false'

    - name: Build package
      run: |
        #[[ $(git describe --long --abbrev=7) == ${{ needs.clean.outputs.gitdescribe }} ]] || exit 1
        make ${{ matrix.dist }}${{ matrix.type }}
        shopt -s nullglob
        packages=(binaries/*.deb binaries/*.rpm binaries/*.tar.gz)
        if [[ ${#packages[@]} -ne 1 ]]; then
          echo "ERROR: expected exactly one package artifact, found ${#packages[@]}" >&2
          printf '  %s\n' "${packages[@]:-<none>}" >&2
          exit 1
        fi
        echo "BIN_PKG=${packages[0]}" >> $GITHUB_ENV

    - name: Test tarball runtime
      if: startsWith(matrix.dist, 'tarball')
      env:
        TARBALL_TEST_IMAGES: almalinux:9 debian:12 ubuntu:22.04
      run: tools/test-tarball-runtime.sh

    - name: Retain package for isolated upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: package-${{ matrix.arch }}-${{ matrix.dist }}${{ matrix.type }}
        path: ${{ env.BIN_PKG }}
        # Artifacts are scoped to this run. A retried build replaces its own
        # leg; retain successful legs for the full 30-day job rerun window.
        overwrite: true
        compression-level: 0
        if-no-files-found: error
        retention-days: 30

    - name: Retain openssl dependency publication candidate
      if: ${{ success() && steps.dependencies.outputs.openssl-key != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dependency-candidate-a${{ github.run_attempt }}-${{ matrix.arch }}-${{ matrix.dist }}${{ matrix.type }}-openssl
        path: |
          ${{ steps.dependencies.outputs.openssl-path }}/entry.json
          ${{ steps.dependencies.outputs.openssl-path }}/bundle.tar.gz
        include-hidden-files: true
        compression-level: 0
        if-no-files-found: error
        retention-days: 3

    - name: Retain duckdb dependency publication candidate
      if: ${{ success() && steps.dependencies.outputs.duckdb-key != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dependency-candidate-a${{ github.run_attempt }}-${{ matrix.arch }}-${{ matrix.dist }}${{ matrix.type }}-duckdb
        path: |
          ${{ steps.dependencies.outputs.duckdb-path }}/entry.json
          ${{ steps.dependencies.outputs.duckdb-path }}/bundle.tar.gz
        include-hidden-files: true
        compression-level: 0
        if-no-files-found: error
        retention-days: 3

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        check_id: ${{ steps.checks.outputs.check_id }}
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        conclusion: ${{ job.status }}
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  upload:
    needs: [clean, select, build]
    # Keep successful packages even when a sibling source build fails.
    if: ${{ always() && !cancelled() && needs.clean.result == 'success' && needs.select.result == 'success' && needs.build.result != 'cancelled' }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
#       # v2.7
#        dist: [ 'almalinux8','almalinux9','centos7','centos8','centos9','debian10','debian11','debian12','fedora38','fedora39','fedora40','fedora41','opensuse15','ubuntu16','ubuntu18','ubuntu20','ubuntu22','ubuntu24' ]
#       # v3.0
#        dist: [ 'almalinux8','almalinux9','centos9','debian12','fedora40','fedora41','opensuse15','ubuntu22','ubuntu24' ]
        arch: [ 'amd64','arm64' ]
        dist: ${{ fromJson(needs.select.outputs.dists) }}
        type: [ '','-dbg','-clang' ]
        exclude:
#         broken - clang too old
          - dist: 'centos7'
            type: '-clang'
          - dist: 'debian10'
            type: '-clang'
          - dist: 'ubuntu16'
            type: '-clang'
          - dist: 'ubuntu18'
            type: '-clang'
#         unneded - not build before v3.0.0
          - arch: 'arm64'
            type: '-clang'
          - arch: 'arm64'
            type: '-dbg'
#         tarball Compose only provides tarball_build
          - dist: 'tarball-almalinux9'
            type: '-clang'
          - dist: 'tarball-almalinux9'
            type: '-dbg'

    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Download this matrix leg's package
      id: package
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: package-${{ matrix.arch }}-${{ matrix.dist }}${{ matrix.type }}
        path: package
    - name: Require package artifact after successful builds
      if: ${{ needs.build.result == 'success' }}
      env:
        DOWNLOAD_OUTCOME: ${{ steps.package.outcome }}
      run: test "$DOWNLOAD_OUTCOME" = success
    - name: Push package without executing source code
      if: ${{ steps.package.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXPECTED_VERSION: ${{ needs.clean.outputs.gitdescribe }}
      run: |
        set -euo pipefail
        version=$(gh release --repo "$GITHUB_REPOSITORY" view "${BRANCH}-head" | tr -d '*' | grep -Po "(?<=Version : ).*")
        test "$version" = "$EXPECTED_VERSION"
        shopt -s nullglob
        packages=(package/*.deb package/*.rpm package/*.tar.gz)
        test "${#packages[@]}" -eq 1
        gh release upload "${BRANCH}-head" --repo "$GITHUB_REPOSITORY" --clobber "${packages[0]}"

  finalize:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [ clean, select, build, upload ]
    steps:
    - name: Update release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        GIT_VERSION=$(gh release --repo ${{ github.repository }} view ${{ env.BRANCH }}-head | tr -d '*' | grep -Po "(?<=Version : ).*")
        [[ ${GIT_VERSION} == ${{ needs.clean.outputs.gitdescribe }} ]] || exit 1
        gh release edit ${{ env.BRANCH }}-head --draft --prerelease --repo ${{ github.repository }} --tag ${{ env.BRANCH }}-head --notes-file - << EOF
        ## Development Snapshot
        
        GH-Action Package-Build on ${{ env.BRANCH }} merge
        
        Version : **${{ needs.clean.outputs.gitdescribe }}**
        
        Finished : **$(date '+%Y-%m-%d %H:%M:%S %Z')**
        
        Status : **Build is finished**
        
        [![CI-Package-Build](https://github.com/${{ github.repository }}/actions/workflows/CI-package-build.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/CI-package-build.yml)
        
        EOF
        
        

  dependency-publication:
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/ci-publish-dependency-cache.yml
    with:
      source_sha: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
