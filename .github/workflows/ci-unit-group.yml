name: CI unit group

on:
  workflow_call:
    inputs:
      trigger:
        type: string
      tap_group:
        type: string
        required: true

      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: '1'
env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:
  tier-context:
    uses: ./.github/workflows/ci-tier-context.yml
    with:
      trigger: ${{ inputs.trigger }}
      consumer_id: ${{ inputs.consumer_id }}
      control_ref: ${{ inputs.control_ref }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
    secrets: inherit
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read
    steps:
    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-context.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Start selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: proxysql
        persist-credentials: false

    - name: Restore selected product handoff
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py restore
    - name: Pull Ubuntu 24 build image
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5; do
          echo ">>> GHCR login+pull attempt ${attempt}/5"
          if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin \
            && docker pull proxysql/packaging:build-ubuntu24-v4.0.0; then
            exit 0
          fi
          if [ "${attempt}" -lt 5 ]; then
            sleep "$((attempt * 10))"
          fi
        done
        echo "ERROR: failed to pull Ubuntu 24 build image after 5 attempts" >&2
        exit 1

    - name: Run selected unit group
      env:
        TAP_GROUP: ${{ inputs.tap_group }}
      run: |
        set -euo pipefail
        unit_list="$(mktemp "${RUNNER_TEMP}/unit-tests.XXXXXX")"
        trap 'rm -f "${unit_list}"' EXIT
        python3 - <<'PY' > "${unit_list}"
        import json
        import os
        import pathlib

        group = os.environ["TAP_GROUP"]
        repo_root = pathlib.Path("proxysql").resolve(strict=True)
        with (repo_root / "test/tap/groups/groups.json").open(encoding="utf-8") as source:
            groups = json.load(source)
        selected = sorted(name for name, tags in groups.items() if group in tags)
        if not selected:
            raise SystemExit(f"ERROR: no tests are registered for {group}")
        unit_dir = (repo_root / "test/tap/tests/unit").resolve(strict=True)
        for name in selected:
            try:
                path = (unit_dir / name).resolve(strict=True)
                path.relative_to(unit_dir)
            except (OSError, RuntimeError, ValueError):
                raise SystemExit(
                    f"ERROR: {group} selects non-unit or missing executable: {name}"
                )
            if not path.is_file() or not os.access(path, os.X_OK):
                raise SystemExit(
                    f"ERROR: {group} selects non-unit or missing executable: {name}"
                )
            print(path.relative_to(repo_root))
        PY
        docker run --rm --network none \
          -e TAP_GROUP \
          -v "${PWD}/proxysql:/opt/proxysql" \
          -v "${unit_list}:/tmp/unit-tests:ro" \
          -w /opt/proxysql \
          -e LD_LIBRARY_PATH=/opt/proxysql/test/tap/tap:/opt/proxysql/test/tap/tap/_runtime_libs \
          proxysql/packaging:build-ubuntu24-v4.0.0 \
          bash -ceu '
            failed=""
            while IFS= read -r test_binary; do
              echo ">>> ${test_binary}"
              if ! "${test_binary}"; then
                failed="${failed} ${test_binary}"
              fi
            done < /tmp/unit-tests
            if [ -n "${failed}" ]; then
              echo ">>> FAILED:${failed}" >&2
              exit 1
            fi
          '

    - name: Archive unit-test logs on failure
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-${{ inputs.tap_group }}-logs-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: proxysql/test/tap/tests/unit/*.log
        if-no-files-found: ignore

    - name: Complete selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ always() }}
    needs:
    - tier-context
    name: ${{ matrix.check_name }}
    if: ${{ needs.tier-context.result == 'success' && fromJson(needs.tier-context.outputs.matrices)['tests'][0] != null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tier-context.outputs.matrices)['tests'] || fromJson('[{}]') }}
    env:
      SHA: ${{ needs.tier-context.outputs.sha }}
      CI_BINDING: ${{ needs.tier-context.outputs.binding }}
      CI_LEG: ${{ toJson(matrix) }}
      TIER: ${{ matrix.tier }}
      COVERAGE: ${{ matrix.coverage && '1' || '0' }}
  tier-summary:
    needs:
    - tier-context
    - tests
    if: ${{ always() && needs.tier-context.result == 'success' }}
    uses: ./.github/workflows/ci-tier-summary.yml
    with:
      binding: ${{ needs.tier-context.outputs.binding }}
      control_ref: ${{ needs.tier-context.outputs.control_sha }}
    secrets: inherit
