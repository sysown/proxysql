name: CI-builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string
      trusted:
        description: Whether the caller may use privileged CI infrastructure.
        required: false
        type: boolean
        default: true

# Intentionally NO `permissions:` block here.
#
# A reusable workflow may not request more than its caller grants, so a
# static declaration must be <= the LEAST privileged caller. That is
# unsatisfiable here: trusted builds need the cache and artifact scopes,
# while fork builds must hold no write-capable token at all (see
# docs/superpowers/specs/2026-08-09-fork-pr-builds-design.md, "Security
# Constraints"). Declaring `write-all` made every call from the
# least-privilege caller fail before any job started -- which is why
# CI-builds-fork.yml has never once run (startup_failure on every fork PR).
#
# With no block the called workflow inherits the caller's permissions:
#   CI-builds.yml      (trusted)   grants write-all      -> unchanged
#   CI-builds-fork.yml (untrusted) grants contents:read  -> now starts
#
# contents:read is sufficient for an `inputs.trusted == false` run: only
# `Checkout repository` executes. Every cache/restore, cache/save,
# upload-artifact and archive step is gated on inputs.trusted, and BOTH
# LouisBrunner/checks-action steps are `inputs.trusted && always()`, so the
# fork path creates no custom checks and needs no checks:write -- exactly as
# the design spec requires.
#
# On a direct `workflow_dispatch` there is no caller, so the repository
# default token applies (currently `write`), which covers the cache and
# artifact steps. This workflow uses no OIDC, so the absence of id-token
# in that default is not a concern.

env:
  LOCK: CI_BUILDS_${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:

  resolve-tap-mode:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: GH-Actions
        path: ci-control
        sparse-checkout: |
          .github/scripts/resolve-tap-build-mode.bash
        sparse-checkout-cone-mode: false
    - name: Resolve TAP build mode from PR label
      id: resolve
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TRUSTED: ${{ inputs.trusted }}
        TRIGGER_JSON: ${{ inputs.trigger }}
      run: |
        chmod +x ci-control/.github/scripts/resolve-tap-build-mode.bash
        mode="$(ci-control/.github/scripts/resolve-tap-build-mode.bash)"
        echo "Selected TAP build mode: ${mode}"
        printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

#  lock:
#    runs-on: ubuntu-22.04
#    env:
#      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#
#    steps:
#
#    - name: Concurency locking
#      run: |
#        # lock fast
#        echo "Setting lock '${LOCK^^}' to '${{ github.workflow }}'"
#        gh variable -R ${{ github.repository }} list | grep -i ${LOCK} >/dev/null || gh variable -R ${{ github.repository }} set ${LOCK} -b '${{ github.workflow }}' >/dev/null
#
#        # wait for unlock
#        sleep 5
#        PROBE="$(gh variable -R ${{ github.repository }} list | grep -i ${LOCK} || echo '')"
#        if [[ ! ${PROBE} =~ ${{ github.workflow }} ]]; then
#          while [[ ! -z ${PROBE} ]]; do
#            echo "Wating for unlock '${LOCK^^}' by '$(echo ${PROBE} | awk '{ print $2 }')' ..."
#            sleep 15
#            PROBE="$(gh variable -R ${{ github.repository }} list | grep -i ${LOCK} || echo '')"
#          done
#        else
#          echo "Aquired lock '${LOCK^^}' by '${{ github.workflow }}'"
#        fi



  builds:
    needs: resolve-tap-mode
    # Route to the self-hosted proxysql-ci pool only when: the actor is renecannao
    # (trusted) AND this workflow is listed in the SELFHOSTED_WORKFLOWS repo variable.
    # Otherwise fall back to GitHub-hosted ubuntu-24.04. Empty/absent variable = no routing.
    runs-on: ${{ inputs.trusted && ((github.actor == 'renecannao' || (inputs.trigger && fromJson(inputs.trigger).event.workflow_run.actor.login == 'renecannao')) && vars.SELFHOSTED_WORKFLOWS && contains(fromJson(vars.SELFHOSTED_WORKFLOWS), github.workflow) && fromJson('["self-hosted","proxysql-ci"]')) || 'ubuntu-24.04' }}
    timeout-minutes: 120
#    needs: [ lock ]
#    outputs:
#      matrix: ${{ steps.set-matrix.outputs.matrix }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # debian12 is needed for 3p testing
          - dist: 'debian12'
            type: '-dbg'
#          - dist: 'opensuse15'
#            type: '-clang'

          # ubuntu22 is needed for TAP testing
          - dist: 'ubuntu22'
            type: '-tap'

          # ubuntu24 GenAI build with code coverage
          - dist: 'ubuntu24'
            type: '-tap-genai-gcov'

          # ubuntu22 chassis build for the mysqlx plugin. Injects
          # PROXYSQL40=1 into docker-compose (see the Build step). The
          # chassis cascade in Makefile sets PROXYSQL31 / PROXYSQLFFTO /
          # PROXYSQLTSDB automatically, and entrypoint.bash descends into
          # plugins/mysqlx so the .so lands at
          # proxysql/plugins/mysqlx/ProxySQL_MySQLX_Plugin.so. CI-mysqlx's
          # callee on this branch (ci-mysqlx.yml) restores this matrix's
          # _src and _test caches and runs the tests without compiling
          # anything on the bare runner -- mirroring how every other
          # CI-* test workflow consumes the CI-builds caches.
          - dist: 'ubuntu22'
            type: '-tap-mysqlx'
          # ubuntu22 is needed for ASAN TAP testing
          # disabled to save cache space
          #- dist: 'ubuntu22'
          #  type: '-tap-asan'
#          - dist: 'ubuntu22'
#            type: '-clang'
#          - dist: 'ubuntu22'
#            type: '-clang-tap'
#          - dist: 'ubuntu22'
#            type: '-clang-tap-asan'
    env:
      TAP_BUILD_MODE: ${{ needs.resolve-tap-mode.outputs.mode }}
      BLDCACHE: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}_${{ matrix.dist }}${{ matrix.type }}${{ needs.resolve-tap-mode.outputs.mode == 'asan' && '_asan' || '' }}
      MATRIX: '(${{ matrix.dist }},${{ matrix.type }},${{ needs.resolve-tap-mode.outputs.mode }})'

    steps:

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      id: checks
      if: ${{ inputs.trusted && always() }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: '${{ github.workflow }} / ${{ github.job }} ${{ env.MATRIX }}'
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        status: 'in_progress'
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    
    - name: Cache check
      id: cache-check
      if: ${{ inputs.trusted && success() }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ env.BLDCACHE }}_bin
        enableCrossOsArchive: true
        lookup-only: true
        path: |
          proxysql/binaries/

    # Self-hosted runners reuse the working directory between jobs. A cancelled
    # dockerized build can leave its Compose stack running against the
    # bind-mounted checkout (./:/opt/proxysql), where it continues to create
    # root-owned files while the next job starts. A VM receives all CI-builds
    # matrix legs serially, so the stale writer can belong to a different
    # distribution than the new leg. The previous project-name-filtered cleanup
    # never matched, because the Makefile names each project
    # <BLD_NAME>-<GITVERSION> (e.g. ubuntu22-tap-3.0.11-502-gd8bdd5a), not the
    # bare distribution name. Nuke ALL docker state on the runner instead: every
    # container, every volume, every network. Nothing dockerized may survive
    # into the next job.
    - name: Nuke all docker state (self-hosted)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && steps.cache-check.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        echo ">>> removing all docker containers"
        containers="$(docker ps -aq)"
        if [ -n "${containers}" ]; then
          docker rm -f ${containers}
        fi
        echo ">>> removing all docker volumes"
        docker volume prune -af
        echo ">>> removing all docker networks"
        docker network prune -f

    # The dockerized build writes files as root, so on the next job the
    # actions/checkout pre-clean can otherwise trip over them:
    #   ##[error]File was unable to be removed Error: EACCES: permission denied,
    #   unlink '.../proxysql/deps/prometheus-cpp/.../.bazelignore'
    # and the job fails before it even builds. Reclaim ownership for the runner
    # user first so checkout can clean. GitHub-hosted runners use an ephemeral
    # workspace and do not need this privileged operation.
    - name: Reclaim workspace ownership (self-hosted contamination guard)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && steps.cache-check.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"

        echo ">>> reclaiming self-hosted workspace ownership: ${workspace}"
        sudo -n chown -R "${runner_uid}:${runner_gid}" "${workspace}"
        sudo -n chmod -R u+rwX "${workspace}"

        remaining="$(sudo -n find "${workspace}" ! -uid "${runner_uid}" -print -quit)"
        if [ -n "${remaining}" ]; then
          echo "::error::workspace still contains files not owned by the runner: ${remaining}"
          sudo -n find "${workspace}" ! -uid "${runner_uid}" -print | head -n 20
          exit 1
        fi

    # Vendored dependencies are hydrated after checkout, before the Docker
    # build container starts. Keep this guard on the self-hosted pool:
    # GitHub-hosted images already provide git-lfs, while ci-vm-1 does not.
    - name: Install Git LFS when absent (self-hosted)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && steps.cache-check.outputs.cache-hit != 'true' }}
      run: |
        set -euo pipefail
        if command -v git-lfs >/dev/null 2>&1; then
          git-lfs --version
          exit 0
        fi
        sudo -n apt-get update
        sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install --yes git-lfs
        git-lfs --version

    - name: Checkout repository
      if: ${{ steps.cache-check.outputs.cache-hit != 'true' }}
      env:
        # The self-hosted workspaces are persistent. Hydrating after the
        # target commit is checked out avoids git-lfs scanning the previous
        # checkout while actions/checkout is still changing refs.
        GIT_LFS_SKIP_SMUDGE: "1"
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        fetch-depth: 0
        path: 'proxysql'

    # Checkout above sets GIT_LFS_SKIP_SMUDGE (see the comment on that step),
    # so every LFS-tracked file -- vendored source tarballs -- currently sits
    # in the "proxysql" checkout as a pointer stub. Hydrate them here, driven
    # entirely by what the checked-out branch's .gitattributes declares.
    #
    # This is deliberately generic rather than a per-archive step, because
    # this file is shared by ALL branches (every CI-*.yml caller on every
    # branch pins `ci-builds.yml@GH-Actions`): a hardcoded archive name/
    # version can only ever be correct for one branch at a time, and a
    # version bump would require an atomic-impossible cross-branch edit
    # (workflow here, archive on the target branch). The concrete proof this
    # already bit us: this step used to hardcode
    # "deps/libssl/openssl-3.5.7.tar.gz", a path that does not exist on v3.0
    # at all -- so it silently hydrated nothing on every v3.0 build, saved
    # only by its own `-f` guard. PR #6133 then added a second vendored
    # archive (deps/duckdb/duckdb-1.4.5.tar.gz) and hit the same wall: no
    # amount of hardcoding one archive name generalizes to two, let alone to
    # whatever the next branch vendors.
    #
    # `git lfs pull` with no --include fetches every LFS object the checked-
    # out branch's .gitattributes tracks -- so a version bump, or a brand
    # new vendored dep, needs no change here at all. The tradeoff: it also
    # fetches LFS objects a given build tier won't use (e.g. DuckDB's 98MB
    # on a build that never touches PROXYSQL40). That's accepted deliberately
    # for correctness and zero per-dep maintenance; if LFS bandwidth becomes
    # a real problem, this is the place to add filtering back -- but note
    # any such filter reintroduces per-dep knowledge here and its own
    # staleness risk (exactly the bug being fixed now).
    #
    # Each vendored dep may ship its own verify-source.bash (today only
    # deps/libssl/ has one); run whichever exist. The glob is guarded so a
    # branch with no verifier scripts (or no LFS files at all) still
    # succeeds. `git lfs pull` itself fails when the branch has no LFS
    # attributes, so enumerate tracked paths first; `for` over a non-matching
    # glob iterates the literal, unexpanded pattern once, so the `[ -x ... ]`
    # test is what actually skips it.
    - name: Hydrate vendored source archives
      if: ${{ inputs.trusted && steps.cache-check.outputs.cache-hit != 'true' }}
      working-directory: proxysql
      run: |
        set -euo pipefail
        lfs_files="$(git lfs ls-files --name-only)"
        if [ -n "${lfs_files}" ]; then
          git lfs pull --include="" --exclude=""
        fi
        for v in deps/*/verify-source.bash; do
          [ -x "$v" ] && "$v"
        done

#    - name: Patch TAP-tests
#      if: ${{ steps.cache-check.outputs.cache-hit != 'true' }}
#      run: |
#         apply patches
#        for PATCH in $(cd jenkins-build-scripts/test-scripts/patches && find . -type f); do
#          if [[ $PATCH =~ \.patch ]]; then
#            patch --verbose proxysql/${PATCH%.patch} jenkins-build-scripts/test-scripts/patches/${PATCH} || true
#          elif [[ ! -f jenkins-build-scripts/test-scripts/patches/${PATCH#./}.patch ]]; then
#            cp -v jenkins-build-scripts/test-scripts/patches/${PATCH#./} proxysql/${PATCH#./} || true
#          fi
#        done
#        ls -l proxysql/test/tap

    - name: Build
      timeout-minutes: 90
      id: build
      if: ${{ steps.cache-check.outputs.cache-hit != 'true' }}
      run: |
        cd proxysql/
        echo "TAP build mode: ${TAP_BUILD_MODE}"
        echo "Build matrix variant: ${{ matrix.dist }}${{ matrix.type }}"
        #sed -i 's/docker-compose/docker compose/g' Makefile
        git fetch --tags --force
        mkdir ci_build_log
        if [[ "${TAP_BUILD_MODE}" = 'asan' && "${{ matrix.dist }}${{ matrix.type }}" = 'ubuntu24-tap-genai-gcov' ]]; then
          sed -i "/command/i \      - WITHASAN=1" docker-compose.yml
          sed -i "/command/i \      - TEST_WITHASAN=1" docker-compose.yml
        fi
        if [[ "${{ matrix.type }}" =~ "-genai" ]]; then
          # GenAI / v4.0 chassis tier flag. PROXYSQLGENAI was REMOVED in
          # #5815 -- the GenAI/MCP/AI/RAG tier is now selected with
          # PROXYSQL40=1, which the top-level Makefile cascades into
          # PROXYSQL31 / PROXYSQLFFTO / PROXYSQLTSDB automatically. Injecting
          # the dead PROXYSQLGENAI flag was a silent no-op, so this build's
          # core libproxysql compiled as BARE STABLE (GITVERSION 3.0.x, no
          # tier defines) -- every test group consuming the genai-gcov cache
          # was exercising a Stable core, with FFTO/TSDB/genai/pass-through
          # #ifdef'd out. Use PROXYSQL40=1 so the core matches the tier.
          sed -i "/command/i \      - PROXYSQL40=1" docker-compose.yml
          # Skip the ~14 genai_*_unit-t binaries. With PROXYSQL40=1 the unit
          # Makefile's `ifeq ($(PROXYSQL40),1)` block would otherwise add them
          # to UNIT_TESTS; they statically link 30+ plugins/genai/.cpp at
          # -O0 -ggdb (~160 MB each, ~2 GB total, larger still under gcov) and
          # blow the runner's free disk. This build feeds TAP integration
          # groups, not unit-test groups (which build separately).
          sed -i "/command/i \      - SKIP_GENAI_UNIT_TESTS=1" docker-compose.yml
        fi
        if [[ "${{ matrix.type }}" =~ "-mysqlx" ]]; then
          # Chassis tier flag for plugins/mysqlx build. _build.environment
          # in docker-compose.yml already lists PROXYSQL40 as a pass-through
          # var, and entrypoint.bash routes on it (install libprotobuf-dev,
          # add PROXYSQL40=1 to make EXTRA, build plugins/mysqlx + plugins/
          # genai). Setting PROXYSQL40=1 alone is enough -- Makefile cascades
          # it into PROXYSQL31/PROXYSQLFFTO/PROXYSQLTSDB automatically.
          sed -i "/command/i \      - PROXYSQL40=1" docker-compose.yml
          # Skip the ~14 genai_*_unit-t binaries. With PROXYSQL40=1 the
          # unit Makefile's `ifeq ($(PROXYSQL40),1)` block would otherwise
          # add them to UNIT_TESTS, and they statically link 30+
          # plugins/genai/.cpp at -O0 -ggdb (~160 MB each, ~2 GB total).
          # That blew the runner's ~14 GB free disk on the first attempt
          # at this matrix entry. CI-mysqlx never runs genai_*_unit-t.
          sed -i "/command/i \      - SKIP_GENAI_UNIT_TESTS=1" docker-compose.yml
        fi
        if [[ "${{ matrix.type }}" =~ "-gcov" ]]; then
          sed -i "/command/i \      - WITHGCOV=1" docker-compose.yml
        fi
        if [[ "${{ matrix.type }}" =~ "-tap" ]]; then
          # prebuild dependencies without debug
          #sed -i "/command/c \    command: bash -l -c '${ASAN} cd /opt/proxysql && make -j$(nproc) build_deps_clickhouse'" docker-compose.yml
          #make ${{ matrix.dist }} | tee ci_build_log/build-deps.log
          # build tap tests
          #sed -i "s/^build_tap_test_debug: build_src_debug$/build_tap_test_debug: build_src_debug_clickhouse/" Makefile
          #sed -i "/command/c \    command: bash -l -c 'cd /opt/proxysql && make -j$(nproc) build_tap_test_debug'" docker-compose.yml
          # NOTE: target must be -tap (not -dbg): entrypoint.bash routes on BLD_NAME
          # matching \-test|\-tap and selects build_tap_test_debug; -dbg takes the else
          # branch which only builds src/proxysql, leaving test/tap/tests/**/*-t unbuilt
          # (silent false-green — see v3.0 doc/GH-Actions/README.md debugging section).
          # On shared self-hosted runners, cap build parallelism so concurrent
          # jobs don't oversubscribe the box (Makefile honours MAKEOPT ?=, and it
          # propagates into the build container via docker-compose + entrypoint.bash).
          if [ "${{ runner.environment }}" = "self-hosted" ]; then export MAKEOPT="-j8"; fi
          make ${{ matrix.dist }}-tap | tee ci_build_log/build-tap.log
          
          # create matrix of all test folders containing *-t
          echo "[ "$(find test/tap/ -name '*-t' | xargs -n1 dirname | uniq | sed 's|test/tap/||' | xargs -I{} -n1 echo -n "'{}', ")"]" > tap-matrix.json
          find test/tap/ -name *-t | xargs -n1 dirname | uniq  > tap-matrix.txt
          echo "===================="
          echo ">>>tap-matrix.txt<<<"
          cat tap-matrix.txt
          echo "===================="
          # create matrixes of all tests
          for TESTS in test/tap/tests*; do
            echo "[ "$(find -L $TESTS -type f -name '*-t' -executable -printf "'%f', ")" ]" > tap-matrix-${TESTS##*/}.json
            find -L $TESTS -type f -name '*-t' -executable -printf "%f\n" > tap-matrix-${TESTS##*/}.txt
            echo "===================="
            echo ">>>${TESTS##*/}<<<"
            cat tap-matrix-${TESTS##*/}.txt
            echo "===================="
          done

          # ------------------------------------------------------------
          # Cache size control: prune artifacts the _test cache doesn't
          # need before it gets saved. Without this pruning, the _test
          # cache grows to ~4 GB compressed (~16 GB uncompressed), and
          # two concurrent cascades (each saving one ubuntu22-tap cache
          # and one ubuntu24-tap-genai-gcov cache) exceed GitHub's 10 GB
          # per-repo cache quota. LRU eviction then deletes caches
          # between when CI-builds saves them and when downstream test
          # workflows try to restore them, causing "Cache restore test"
          # to fail and the entire TAP pipeline to break.
          # ------------------------------------------------------------

          # Stage the runtime .so needed by the e2e test binaries
          # into a path that's both already part of the _test cache
          # (test/tap/tap/ is in `tar -cf - test/`) AND has its parent
          # git-tracked (so post-checkout `mkdir -p` works on restore
          # at the consumer side). The e2e -t binaries DT_NEEDED
          # libre2.so.10 when built as a shared library; static RE2
          # builds do not need it. Its baked RUNPATH points at
          # /opt/proxysql/deps/re2/.../obj/so, a tarball-unpacked path
          # that does not exist post-checkout. CI-mysqlx exports
          # LD_LIBRARY_PATH pointing at this directory when running the
          # e2e binaries inside the build image, which overrides RUNPATH
          # lookup. The normal TAP executables link libpq statically, but
          # libtap.so is a shared object and has a DT_NEEDED entry for the
          # project-built libpq.so.5.  The libpq static archive is not PIC,
          # so it cannot be linked into libtap.so.  Carry that exact shared
          # library with the handoff instead of relying on a runner package.
          if [[ "${{ matrix.type }}" =~ "-mysqlx" ]]; then
            mkdir -p test/tap/tap/_runtime_libs
            # Stage the versioned runtime .so by its SONAME, tolerating a lost
            # symlink. Resolve the SONAME if present, else fall back to the
            # newest matching real file. Only a genuine deps-build break (no
            # file at all) fails loudly, with a directory listing.
            stage_lib() {
              local dir="$1" soname="$2" dest="$3" src=""
              if [ -e "$dir/$soname" ]; then
                src="$dir/$soname"
              else
                src=$(ls -1 "$dir/$soname."* 2>/dev/null | sort -V | tail -n1 || true)
              fi
              if [ -z "$src" ] || [ ! -e "$src" ]; then
                echo "ERROR: cannot stage $soname -- no file matching $dir/$soname* (deps build incomplete or shared lib not produced)"
                ls -la "$dir" || true
                return 1
              fi
              cp -L "$src" "$dest/$soname"
              echo "staged $soname <- $(readlink -f "$src")"
            }
            # Current v3.0 RE2 builds are static-only, so obj/so is not
            # created. Keep staging for branches that intentionally build
            # shared RE2, where a missing library remains a real failure.
            if [ -d deps/re2/re2/obj/so ]; then
              stage_lib deps/re2/re2/obj/so libre2.so.10 test/tap/tap/_runtime_libs
            else
              echo "RE2 is static-only; no libre2 runtime library to stage"
            fi
            stage_lib deps/postgresql/postgresql/src/interfaces/libpq libpq.so.5 test/tap/tap/_runtime_libs
            # Stage the chassis plugin .so files into the same dir for
            # the same reason: the _src cache path list is shared
            # infrastructure that we MUST NOT extend (changing it
            # invalidates every downstream workflow's cache restore).
            # The _test cache covers anything under test/, so anything
            # we stash here travels along with the test/ tree from
            # CI-builds to CI-mysqlx. CI-mysqlx's restore step copies
            # them back to plugins/mysqlx/ before the soak harness
            # bind-mounts the .so into the ProxySQL container.
            cp -L plugins/mysqlx/ProxySQL_MySQLX_Plugin.so test/tap/tap/_runtime_libs/
            cp -L plugins/genai/ProxySQL_GenAI_Plugin.so test/tap/tap/_runtime_libs/ 2>/dev/null || true
            ls -la test/tap/tap/_runtime_libs/
          fi
          # ------------------------------------------------------------

          # Compile-time safety checks. A normal TAP build produces the
          # integration binaries in tests/; it need not build tests/unit.
          # The -tap-mysqlx cache is the exception: CI-mysqlx runs its
          # mysqlx_*_unit-t and plugin_*_unit-t binaries directly.
          # Fail loudly when the expected binaries are absent rather than
          # letting cache-pruning succeed on an empty set.
          TAP_COUNT=$(find test/tap/tests test/tap/tests_with_deps -path test/tap/tests/unit -prune -o -type f -name '*-t' -executable -print 2>/dev/null | wc -l)
          UNIT_COUNT=$(find test/tap/tests/unit -type f -name '*-t' -executable 2>/dev/null | wc -l)
          echo ">>> Compiled ${TAP_COUNT} TAP test binaries, including ${UNIT_COUNT} unit test binaries"
          if [ "${TAP_COUNT}" -lt 1 ]; then
            echo "ERROR: no executable TAP test binaries found under test/tap/tests"
            echo "       This typically means the TAP build did not run or failed."
            exit 1
          fi
          if [[ "${{ matrix.type }}" =~ "-mysqlx" ]] && [ "${UNIT_COUNT}" -lt 1 ]; then
            echo "ERROR: no unit test binaries found at test/tap/tests/unit/*-t for the mysqlx cache"
            exit 1
          fi

          # Delete unit test binaries before the cache save. Each is ~170 MB
          # because they statically link libproxysql.a in debug mode
          # (52 binaries × 170 MB = 8.8 GB). CI-unittests on v3.0 is
          # disabled for now; when it's re-enabled it will need its own
          # rebuild strategy (probably a full docker-compose rebuild).
          #
          # sudo is required: files under test/tap/tests/unit/ and test/deps/
          # are created inside the docker build container running as root,
          # and the host-side runner user can't always remove root-owned
          # files under root-owned subdirectories (unlink needs write access
          # to the parent directory, which the runner doesn't always have).
          #
          # On the -tap-mysqlx matrix variant, CI-mysqlx (downstream) runs
          # the mysqlx_*_unit-t and plugin_*_unit-t binaries directly against
          # this cache, so preserve those and delete only the rest. Spot-
          # checks (readelf) confirm the kept binaries do not dyn-link to
          # test/deps -- the test/deps deletion below still applies.
          if [[ "${{ matrix.type }}" =~ "-mysqlx" ]]; then
            sudo find test/tap/tests/unit -type f -name '*-t' \
              ! -name 'mysqlx_*_unit-t' ! -name 'plugin_*_unit-t' -delete
            KEPT=$(find test/tap/tests/unit -type f -name '*-t' 2>/dev/null | wc -l)
            echo ">>> Deleted $((UNIT_COUNT - KEPT)) unit test binaries, kept ${KEPT} mysqlx_*/plugin_* binaries"
          else
            sudo find test/tap/tests/unit -type f -name '*-t' -delete
            echo ">>> Deleted ${UNIT_COUNT} unit test binaries from the cache payload"
          fi

          # Delete test/deps (~2.8 GB on disk). These are the test-framework
          # dependencies (mariadb-connector-c, mysql-connector-c 5.7,
          # mysql-connector-c 8.4) that TAP binaries statically link against
          # at build time. Nothing at runtime looks at test/deps — the code
          # it contains already lives inside the compiled *-t binaries.
          # Dropping it from the cache saves ~700 MB per variant after
          # zstd compression.
          #
          # Safety check: verify no TAP binary dynamically links against
          # libraries that would be under test/deps, or has a RUNPATH /
          # RPATH pointing at test/deps. If this check fails, someone has
          # added a test that dynamically links to a test/deps library
          # and deleting test/deps will break that test at runtime (with
          # a cryptic .so-not-found error). Fail loudly in CI-builds now
          # instead of silently corrupting the cache.
          BAD_BINS=""
          while IFS= read -r b; do
            deps_needed=$(readelf -d "$b" 2>/dev/null | grep -E "NEEDED.*\b(libmysqlclient|libjson_binlog|libstrings_shared|libmariadbclient)\.so" || true)
            deps_rpath=$(readelf -d "$b" 2>/dev/null | grep -E "R(UN)?PATH.*test/deps" || true)
            if [ -n "${deps_needed}" ] || [ -n "${deps_rpath}" ]; then
              BAD_BINS="${BAD_BINS}${b}\n"
              echo ">>> UNSAFE: $(basename ${b})"
              [ -n "${deps_needed}" ] && echo "    ${deps_needed}"
              [ -n "${deps_rpath}" ] && echo "    ${deps_rpath}"
            fi
          done < <(find test/tap/tests test/tap/tests_with_deps -type f -name '*-t' 2>/dev/null)
          if [ -n "${BAD_BINS}" ]; then
            echo "ERROR: the following TAP binaries depend on test/deps at runtime:"
            printf "${BAD_BINS}"
            echo "       Cannot drop test/deps from the _test cache without"
            echo "       breaking these tests. Fix the Makefile to link"
            echo "       them statically, or update ci-builds.yml to keep"
            echo "       test/deps in the cache."
            exit 1
          fi
          echo ">>> test/deps runtime-dependency check passed"

          # Stage mysqlbinlog into the _test cache before the test/deps
          # deletion below. The mysql-connector-c-8.4.0 build above produces
          # the mysqlbinlog CLI under
          # test/deps/mysql-connector-c-8.4.0/<mysql-8.4>/runtime_output_directory/mysqlbinlog
          # as a side effect of `make` (cmake + the default target list).
          # test_com_binlog_dump_enables_fast_forward-t shells out to it at
          # runtime via system(); the test harness looks for it under
          # ${TEST_DEPS}/mysqlbinlog. Copy the binary into
          # test/tap/tap/bin/ (inside the _test cache's tar root) so it
          # survives the test/deps prune below and is available to every
          # CI-* test workflow that consumes this cache. The runner at
          # test/infra/control/run-tests-isolated.bash will then `find` it
          # here and symlink it into TEST_DEPS/mysqlbinlog. ~37 MB extra
          # in the _test cache -- small compared to the existing ~700 MB
          # saved by dropping the rest of test/deps.
          #
          # The bash glob `mysql-*-8.4*` matches whatever mysql source
          # dir the upstream cmake + ln created; the build steps above
          # always name the symlinked source dir `mysql-8.4.*` (today
          # `mysql-8.4.0`). If multiple versions coexist, the first match
          # is used -- which is fine because the runner only needs ONE
          # mysqlbinlog to satisfy ${TEST_DEPS}/mysqlbinlog.
          stage_mysqlbinlog=0
          for src in test/deps/mysql-connector-c-8.4.0/mysql-*/runtime_output_directory/mysqlbinlog; do
            if [ -x "${src}" ]; then
              mkdir -p test/tap/tap/bin
              sudo cp -f "${src}" test/tap/tap/bin/mysqlbinlog
              sudo chmod 0755 test/tap/tap/bin/mysqlbinlog
              echo ">>> Staged mysqlbinlog from ${src} -> test/tap/tap/bin/mysqlbinlog"
              stage_mysqlbinlog=1
              break
            fi
          done
          if [ "${stage_mysqlbinlog}" -eq 0 ]; then
            echo ">>> WARNING: no mysqlbinlog found under test/deps/mysql-connector-c-8.4.0/ — binlog TAP tests will fail" >&2
          fi

          # sudo required: test/deps contents are owned by root (created
          # inside the docker build container). See comment above on the
          # unit test delete.
          if [ -d test/deps ]; then
            sudo rm -rf test/deps
            echo ">>> Deleted test/deps from the cache payload"
          fi

        elif [[ "${{ matrix.type }}" =~ "-test" ]]; then
          TYPE=${{ matrix.type }}
          # build TYPE
          #sed -i "/command/c \    command: bash -l -c 'cd /opt/proxysql && make -j$(nproc) ${TYPE#-}'" docker-compose.yml
          make ${{ matrix.dist }}-test | tee ci_build_log/build.log
        else
          make ${{ matrix.dist }}${{ matrix.type }} | tee ci_build_log/build.log
        fi

    - name: Check build
      id: check_build
      if: ${{ steps.cache-check.outputs.cache-hit != 'true' }}
      run: |
        for LOG in proxysql/ci_build_log/build*.log ; do
          grep 'exited with code 0' ${LOG} || exit 1
        done

    - name: Stage GenAI plugin in test handoff
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-genai') }}
      run: |
        set -euo pipefail
        cd proxysql/
        plugin_src="plugins/genai/ProxySQL_GenAI_Plugin.so"
        plugin_dest="test/tap/tap/_runtime_libs/ProxySQL_GenAI_Plugin.so"
        if [ ! -s "${plugin_src}" ]; then
          echo "ERROR: required GenAI plugin missing after build: ${plugin_src}" >&2
          exit 1
        fi
        mkdir -p "$(dirname "${plugin_dest}")"
        cp -L "${plugin_src}" "${plugin_dest}"
        test -s "${plugin_dest}"
        ls -la "$(dirname "${plugin_dest}")"

    - name: Pack bin cache with zstd-15
      id: cache-pack-bin
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' }}
      # `actions/cache@v4` compresses with zstd level ~3; we pre-compress
      # with zstd -15 to fit more under the 10 GB repo quota. Level 15
      # captures most of the size win (~80% of what --ultra -22 gives
      # over default -3) at roughly 1/10 the time on this codebase --
      # `--ultra -22` measured 14-16 min just on the test cache step per
      # ubuntu build job (vs ~17 min for the build itself), pushing
      # CI-builds wall clock to ~38 min and gating every downstream TAP
      # workflow on it. Re-compression by actions/cache on the already-
      # compressed .tar.zst is a near-no-op. Symbols are preserved
      # bit-for-bit.
      run: |
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        cd proxysql/
        tar -cf - .git/ binaries/ | zstd -15 -T0 -o ../cache_bin.tar.zst

    - name: Cache save bin
      id: cache-save-bin
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ env.BLDCACHE }}_bin
        enableCrossOsArchive: true
        path: cache_bin.tar.zst

    - name: Cache save src
      id: cache-save-src
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ env.BLDCACHE }}_src
        enableCrossOsArchive: true
        # For -gcov variants, include lib/obj/*.gcno so the test
        # workflow's coverage collector can match .gcda (runtime data
        # written by the proxysql daemon under /gcov) to .gcno
        # (compile-time data). Without this, fastcov sees .gcda files
        # with no associated source-file mapping
        # (`Missing 'current_working_directory'`, `files: []`) and
        # produces a 0-byte .info report -- the bug that hid coverage
        # for as long as COVERAGE=1 has existed in run-tests-isolated.bash.
        # src/obj/*.gcno is already captured by `proxysql/src/`. The
        # extra entry is a no-op for non-gcov builds (lib/obj/*.gcno
        # won't exist) and adds only a few MB to the gcov cache.
        #
        # The plugins/mysqlx and plugins/genai .so paths are no-ops on
        # builds without PROXYSQL40=1 (the files don't exist). For the
        # -tap-mysqlx matrix variant they're the whole point: CI-mysqlx
        # restores this cache and bind-mounts the .so into the ProxySQL
        # container at /usr/lib/proxysql/ProxySQL_MySQLX_Plugin.so.
        #
        # IMPORTANT: this path list determines the actions/cache "version"
        # hash. Every downstream test workflow's `Cache restore src`
        # step on GH-Actions (ci-legacy-g1.yml, ci-mysql84-g3.yml,
        # every ci-mariadb10-galera-*.yml, etc.) uses exactly the two
        # paths below. DO NOT add or remove entries here without updating
        # every downstream callee in lockstep -- adding entries here
        # changed the cache version hash and broke ~40 downstream
        # workflows with "Failed to restore cache entry" even though
        # the cache existed. Plugin .so artefacts and other matrix-
        # specific extras must ride along inside the test/ tree (where
        # the _test cache catches them) rather than be added here.
        path: |
          proxysql/src/
          proxysql/lib/obj/*.gcno

    - name: Pack test cache with zstd-15
      id: cache-pack-test
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      # `actions/cache@v4` compresses with zstd level ~3; we pre-compress
      # with zstd -15 to fit more under the 10 GB repo quota. See the
      # bin-cache pack step above for the rationale on dropping from
      # `--ultra -22` to -15: this step alone was taking 14-16 min per
      # ubuntu build job at --ultra -22, doubling CI-builds wall clock
      # and blocking every downstream TAP workflow on it. Re-compression
      # by actions/cache on the already-compressed .tar.zst is a near-
      # no-op. Symbols are preserved bit-for-bit.
      run: |
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        cd proxysql/
        tar -cf - test/ | zstd -15 -T0 -o ../cache_test.tar.zst

    - name: Cache save test
      id: cache-save-test
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ env.BLDCACHE }}_test
        enableCrossOsArchive: true
        path: cache_test.tar.zst

    - name: Cache save matrix
      id: cache-save-matrix
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ env.BLDCACHE }}_matrix
        enableCrossOsArchive: true
        path: |
          proxysql/tap-matrix*

    # === Build → test handoff via workflow artifacts ===
    # GitHub made Actions cache WRITES read-only for untrusted / workflow_run
    # triggers operating in default-branch context (changelog 2026-06-26): the
    # `Cache save *` steps above get "cache write denied: token has no writable
    # scopes" on PR/workflow_run runs even with permissions: write-all, so every
    # downstream test workflow fails at `fail-on-cache-miss`. Workflow ARTIFACTS
    # are not subject to that policy, so we publish the same payloads the caches
    # carried as per-type artifacts named `ci-builds-handoff-<sha>-<variant>-<t>`
    # (t = src|test|matrix|bin). Each test workflow downloads only the types it
    # used to restore -- a faithful 1:1 replacement of its cache keys. The
    # `Cache save *` steps above are now dead weight (they warn-and-noop on PRs);
    # kept for one release to preserve the fast path on trusted `push` builds,
    # and slated for removal once every consumer is on artifacts.
    #
    # env.SHA is the real head SHA (identical to the value each consumer
    # computes), NOT the workflow_run default-branch SHA, so names line up
    # without any run-id correlation.
    - name: Pack src + matrix for handoff (zstd-15)
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      run: |
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        cd proxysql/
        shopt -s nullglob
        # _src payload: src/ (proxysql binary + src gcno) plus the lib gcno the
        # gcov coverage collector matches against .gcda (gcov build only; the
        # nullglob array is empty and harmless on non-gcov -tap variants).
        gcno=(lib/obj/*.gcno)
        tar -cf - src/ "${gcno[@]}" | zstd -15 -T0 -o ../cache_src.tar.zst
        # _matrix payload (tap-matrix* json) -- only the taptests* groups consume
        # it, and only ubuntu22-tap generates it; skip when absent.
        mtx=(tap-matrix*)
        if [ ${#mtx[@]} -gt 0 ]; then
          tar -cf - "${mtx[@]}" | zstd -15 -T0 -o ../cache_matrix.tar.zst
        fi

    - name: Upload handoff (src)
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-builds-handoff-${{ env.SHA }}-${{ matrix.dist }}${{ matrix.type }}-src
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        path: cache_src.tar.zst

    - name: Upload handoff (test)
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-builds-handoff-${{ env.SHA }}-${{ matrix.dist }}${{ matrix.type }}-test
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        # cache_test.tar.zst is produced by the "Pack test cache" step above.
        path: cache_test.tar.zst

    - name: Upload handoff (matrix)
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-tap') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-builds-handoff-${{ env.SHA }}-${{ matrix.dist }}${{ matrix.type }}-matrix
        retention-days: 1
        compression-level: 0
        # Only ubuntu22-tap generates tap-matrix*; ignore on variants without it.
        if-no-files-found: ignore
        path: cache_matrix.tar.zst

    - name: Upload handoff (bin)
      # Only the debian12-dbg build feeds the 3p suites, and they consume bin
      # only. bin is large (.git/ + binaries/), so don't ship it for -tap.
      if: ${{ inputs.trusted && success() && steps.cache-check.outputs.cache-hit != 'true' && contains(matrix.type,'-dbg') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-builds-handoff-${{ env.SHA }}-${{ matrix.dist }}${{ matrix.type }}-bin
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        # cache_bin.tar.zst is produced by the "Pack bin cache" step above.
        path: cache_bin.tar.zst

    # Nuke ALL docker state before leaving the runner clean for its next job.
    # This prevents a failed or cancelled build from continuing to write
    # root-owned files into the bind mount while the runner is being cleaned.
    # Run on every outcome and fail loudly if Docker cannot be fully cleaned.
    # As with preflight, this is intentionally an unconditional wipe of every
    # container, volume and network -- nothing dockerized may survive.
    - name: Nuke all docker state (leave runner clean)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && always() }}
      run: |
        set -euo pipefail
        echo ">>> removing all docker containers"
        containers="$(docker ps -aq)"
        if [ -n "${containers}" ]; then
          docker rm -f ${containers}
        fi
        echo ">>> removing all docker volumes"
        docker volume prune -af
        echo ">>> removing all docker networks"
        docker network prune -f

    # Undo the root ownership the dockerized build left behind so the next job
    # on this self-hosted runner can clean and check out without EACCES.
    - name: Reclaim workspace ownership (leave runner clean)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && always() }}
      run: |
        set -euo pipefail
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"

        echo ">>> returning self-hosted workspace ownership to the runner: ${workspace}"
        sudo -n chown -R "${runner_uid}:${runner_gid}" "${workspace}"
        sudo -n chmod -R u+rwX "${workspace}"

        remaining="$(sudo -n find "${workspace}" ! -uid "${runner_uid}" -print -quit)"
        if [ -n "${remaining}" ]; then
          echo "::error::workspace cleanup incomplete; first foreign-owned path: ${remaining}"
          sudo -n find "${workspace}" ! -uid "${runner_uid}" -print | head -n 20
          exit 1
        fi

    - name: Archive artifacts
      if: ${{ inputs.trusted && failure() && !cancelled() && (steps.build.outcome == 'failure' || steps.check_build.outcome == 'failure') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-builds-${{ env.SHA }}-run#${{ github.run_number }}-${{ matrix.dist }}${{ matrix.type }}
        # The checkout is a live bind mount on self-hosted runners. Uploading
        # it after an unrelated preflight failure can race a stale container
        # and turn a diagnostic upload into a second failure. Build logs are
        # the relevant evidence when Build or its log validation fails.
        path: proxysql/ci_build_log/
        if-no-files-found: warn

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      if: ${{ inputs.trusted && always() }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        check_id: ${{ steps.checks.outputs.check_id }}
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        conclusion: ${{ job.status }}
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

