name: CI-builds

on:
  workflow_dispatch:
    inputs:
      trusted:
        type: boolean
        default: true
        description: Use trusted repository CI infrastructure
      control_ref:
        type: string
        default: GH-Actions
        description: CI control revision
  workflow_call:
    inputs:
      trigger:
        type: string
      trusted:
        description: Whether the caller may use privileged CI infrastructure.
        required: false
        type: boolean
        default: true
      control_ref:
        type: string
        default: GH-Actions
env:
  LOCK: CI_BUILDS_${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:

  plan:
    runs-on: ${{ inputs.trusted && ((github.actor == 'renecannao' || (inputs.trigger && fromJson(inputs.trigger).event.workflow_run.actor.login == 'renecannao')) && vars.SELFHOSTED_WORKFLOWS && contains(fromJson(vars.SELFHOSTED_WORKFLOWS), github.workflow) && fromJson('["self-hosted","proxysql-ci"]')) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      execution_id: ${{ steps.plan.outputs.execution_id }}
      control_sha: ${{ steps.plan.outputs.control_sha }}
    steps:
    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ inputs.control_ref }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Resolve selected product configurations
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        TRIGGER_JSON: ${{ inputs.trigger }}
        TRUSTED: ${{ inputs.trusted }}
        CI_VARIABLES: ${{ toJson(vars) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py plan
      id: plan
    - name: Publish execution plan
      if: ${{ inputs.trusted && success() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-plan-${{ steps.plan.outputs.execution_id }}
        path: plan.json
        retention-days: 3
  builds:
    needs:
    - plan
    # Route to the self-hosted proxysql-ci pool only when: the actor is renecannao
    # (trusted) AND this workflow is listed in the SELFHOSTED_WORKFLOWS repo variable.
    # Otherwise fall back to GitHub-hosted ubuntu-24.04. Empty/absent variable = no routing.
    runs-on: ${{ inputs.trusted && ((github.actor == 'renecannao' || (inputs.trigger && fromJson(inputs.trigger).event.workflow_run.actor.login == 'renecannao')) && vars.SELFHOSTED_WORKFLOWS && contains(fromJson(vars.SELFHOSTED_WORKFLOWS), github.workflow) && fromJson('["self-hosted","proxysql-ci"]')) || 'ubuntu-24.04' }}
    timeout-minutes: 120
#    needs: [ lock ]
#    outputs:
#      matrix: ${{ steps.set-matrix.outputs.matrix }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # Feature tier and instrumentation come from the single label snapshot.
      TIER: ${{ matrix.tier }}
      VARIANT: ${{ matrix.variant }}
      TAP_BUILD_MODE: ${{ matrix.mode }}
      MATRIX: '(${{ matrix.tier }},${{ matrix.mode }})'

      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CI_LEG: ${{ toJson(matrix) }}
    steps:

    - name: Nuke all docker state (self-hosted)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' }}
      run: |
        set -euo pipefail
        echo ">>> removing all docker containers"
        containers="$(docker ps -aq)"
        if [ -n "${containers}" ]; then
          docker rm -f ${containers}
        fi
        echo ">>> removing all docker volumes"
        docker volume prune -af
        echo ">>> removing all docker networks"
        docker network prune -f

    # The dockerized build writes files as root, so on the next job the
    # actions/checkout pre-clean can otherwise trip over them:
    #   ##[error]File was unable to be removed Error: EACCES: permission denied,
    #   unlink '.../proxysql/deps/prometheus-cpp/.../.bazelignore'
    # and the job fails before it even builds. Reclaim ownership for the runner
    # user first so checkout can clean. GitHub-hosted runners use an ephemeral
    # workspace and do not need this privileged operation.
    - name: Reclaim workspace ownership (self-hosted contamination guard)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' }}
      run: |
        set -euo pipefail
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"

        echo ">>> reclaiming self-hosted workspace ownership: ${workspace}"
        sudo -n chown -R "${runner_uid}:${runner_gid}" "${workspace}"
        sudo -n chmod -R u+rwX "${workspace}"

        remaining="$(sudo -n find "${workspace}" ! -uid "${runner_uid}" -print -quit)"
        if [ -n "${remaining}" ]; then
          echo "::error::workspace still contains files not owned by the runner: ${remaining}"
          sudo -n find "${workspace}" ! -uid "${runner_uid}" -print | head -n 20
          exit 1
        fi

    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.plan.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Check immutable artifacts retained by a partial rerun
      id: artifacts
      if: ${{ inputs.trusted && success() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py artifact-status
    - name: Start product build check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ inputs.trusted && success() }}
    - name: Checkout repository
      if: ${{ success() }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        fetch-depth: 0
        path: 'proxysql'

    # Stage the shared version filter for every build leg.
    #
    # It lives under .github/scripts/, which exists ONLY on the GH-Actions
    # branch -- the main `Checkout repository` step above checks out the
    # *commit under test* (env.SHA, i.e. a v3.0 commit) into proxysql/, and
    # v3.0 has no .github/scripts/ at all. This is precisely why
    # resolve-tap-mode does its own sparse checkout with `ref: GH-Actions`;
    # mirror that pattern rather than assuming proxysql/.github/scripts/ exists.
    #
    # Staged into ci-control/ (a sibling of proxysql/) so that the Build step,
    # which does `cd proxysql/`, can invoke it by a short path while the
    # script's own relative test/tap/... lookups still resolve against the
    # commit under test.
    - name: Verify vendored source archives
      if: ${{ inputs.trusted && success() }}
      working-directory: proxysql
      run: |
        set -euo pipefail
        shopt -s nullglob
        for v in deps/*/verify-source.bash; do
          "$v"
        done

#        ls -l proxysql/test/tap

    - name: Build
      timeout-minutes: 90
      id: build
      if: ${{ inputs.trusted && success() }}
      run: |
        cd proxysql/
        echo "TAP build mode: ${TAP_BUILD_MODE}"
        echo "Build matrix variant: ${{ matrix.dist }}${{ matrix.type }} (tier=${TIER}, variant=${VARIANT})"
        #sed -i 's/docker-compose/docker compose/g' Makefile
        git fetch --tags --force
        mkdir ci_build_log
        # NOTE: `type` is '-tap', so this concatenation is now 'ubuntu24-tap'.
        # It used to compare against 'ubuntu24-tap-genai-gcov' because the tier
        # was encoded in `type`; keep this string in sync with the matrix leg.
        if [[ "${TAP_BUILD_MODE}" = 'asan' && "${{ matrix.dist }}${{ matrix.type }}" = 'ubuntu24-tap' ]]; then
          sed -i "/command/i \      - WITHASAN=1" docker-compose.yml
          sed -i "/command/i \      - TEST_WITHASAN=1" docker-compose.yml
        fi
        # Feature tier. The Makefile cascades the defines itself
        # (PROXYSQL40=1 => PROXYSQL31/FFTO/TSDB; Makefile:66-79) and bumps
        # GITVERSION per tier (Makefile:82-92), which is what makes
        # `proxysql --version` -- and therefore the @proxysql_min_version filter
        # in run-tests-isolated.bash -- tier-aware. v30 injects nothing: the
        # bare tree already *is* the Stable tier.
        #
        # docker-compose.yml needs no edit for this: the `_build` service's
        # `environment:` block already passes PROXYSQL40/PROXYSQL31/PROXYSQLFFTO/
        # PROXYSQLTSDB through to the container (docker-compose.yml:9-25), and
        # `Makefile:106-111` re-exports them, so a value injected here reaches
        # make. PROXYSQL40 is additionally forwarded to the plugin sub-makes by
        # entrypoint.bash's EXTRA (entrypoint.bash:52-53).
        # Instrument every product tier identically.
        sed -i "/command/i \      - WITHGCOV=1" docker-compose.yml
        case "${TIER}" in
          v40)
            # GenAI / v4.0 chassis tier flag. PROXYSQLGENAI was REMOVED in
            # #5815 -- the GenAI/MCP/AI/RAG tier is now selected with
            # PROXYSQL40=1, which the top-level Makefile cascades into
            # PROXYSQL31 / PROXYSQLFFTO / PROXYSQLTSDB automatically. Injecting
            # the dead PROXYSQLGENAI flag was a silent no-op, so this build's
            # core libproxysql compiled as BARE STABLE (GITVERSION 3.0.x, no
            # tier defines) -- every test group consuming the genai-gcov cache
            # was exercising a Stable core, with FFTO/TSDB/genai/pass-through
            # #ifdef'd out. Use PROXYSQL40=1 so the core matches the tier.
            sed -i "/command/i \      - PROXYSQL40=1" docker-compose.yml
            ;;
          v31)
            # v3.1 tier: FFTO + TSDB + ED25519, no plugin chassis.
            sed -i "/command/i \      - PROXYSQL31=1" docker-compose.yml
            ;;
          v30)
            echo ">>> v30 (Stable) tier: injecting no tier flag"
            ;;
          *)
            echo "::error::unhandled tier '${TIER}' reached the Build step"
            exit 1
            ;;
        esac
        if [[ "${{ matrix.type }}" =~ "-tap" ]]; then
          # prebuild dependencies without debug
          #sed -i "/command/c \    command: bash -l -c '${ASAN} cd /opt/proxysql && make -j$(nproc) build_deps_clickhouse'" docker-compose.yml
          #make ${{ matrix.dist }} | tee ci_build_log/build-deps.log
          # build tap tests
          #sed -i "s/^build_tap_test_debug: build_src_debug$/build_tap_test_debug: build_src_debug_clickhouse/" Makefile
          #sed -i "/command/c \    command: bash -l -c 'cd /opt/proxysql && make -j$(nproc) build_tap_test_debug'" docker-compose.yml
          # NOTE: target must be -tap (not -dbg): entrypoint.bash routes on BLD_NAME
          # matching \-test|\-tap and selects build_tap_test_debug; -dbg takes the else
          # branch which only builds src/proxysql, leaving test/tap/tests/**/*-t unbuilt
          # (silent false-green — see v3.0 doc/GH-Actions/README.md debugging section).
          # On shared self-hosted runners, cap build parallelism so concurrent
          # jobs don't oversubscribe the box (Makefile honours MAKEOPT ?=, and it
          # propagates into the build container via docker-compose + entrypoint.bash).
          if [ "${{ runner.environment }}" = "self-hosted" ]; then export MAKEOPT="-j8"; fi
          make ${{ matrix.dist }}-tap | tee ci_build_log/build-tap.log

          # Filter by the built product version in every tier. The same
          # selection applies to the handoff and standalone sanitizer builds.
          sudo "${GITHUB_WORKSPACE}/ci-control/.github/scripts/prune-tier-handoff.bash" \
            --binary src/proxysql --groups test/tap/groups/groups.json

          # create matrix of all test folders containing *-t
          echo "[ "$(find test/tap/ -name '*-t' | xargs -n1 dirname | uniq | sed 's|test/tap/||' | xargs -I{} -n1 echo -n "'{}', ")"]" > tap-matrix.json
          find test/tap/ -name *-t | xargs -n1 dirname | uniq  > tap-matrix.txt
          echo "===================="
          echo ">>>tap-matrix.txt<<<"
          cat tap-matrix.txt
          echo "===================="
          # create matrixes of all tests
          for TESTS in test/tap/tests*; do
            echo "[ "$(find -L $TESTS -type f -name '*-t' -executable -printf "'%f', ")" ]" > tap-matrix-${TESTS##*/}.json
            find -L $TESTS -type f -name '*-t' -executable -printf "%f\n" > tap-matrix-${TESTS##*/}.txt
            echo "===================="
            echo ">>>${TESTS##*/}<<<"
            cat tap-matrix-${TESTS##*/}.txt
            echo "===================="
          done

          # ------------------------------------------------------------
          # Cache size control: prune artifacts the _test cache doesn't
          # need before it gets saved. Without this pruning, the _test
          # cache grows to ~4 GB compressed (~16 GB uncompressed), and
          # two concurrent cascades (each saving a regular and a gcov cache)
          # exceed GitHub's 10 GB
          # per-repo cache quota. LRU eviction then deletes caches
          # between when CI-builds saves them and when downstream test
          # workflows try to restore them, causing "Cache restore test"
          # to fail and the entire TAP pipeline to break.
          # ------------------------------------------------------------

          # Every successful handoff must contain integration and unit tests.
          TAP_COUNT=$(find test/tap/tests test/tap/tests_with_deps -path test/tap/tests/unit -prune -o -type f -name '*-t' -executable -print 2>/dev/null | wc -l)
          UNIT_COUNT=$(find test/tap/tests/unit -type f -name '*-t' -executable 2>/dev/null | wc -l)
          echo ">>> Compiled ${TAP_COUNT} TAP test binaries, including ${UNIT_COUNT} unit test binaries"
          if [ "${TAP_COUNT}" -lt 1 ]; then
            echo "ERROR: no executable TAP test binaries found under test/tap/tests"
            echo "       This typically means the TAP build did not run or failed."
            exit 1
          fi
          # Every tier's handoff retains unit binaries, so this guard is
          # tier-agnostic. It used to be gated on the '-gcov' substring, which
          # only the v40 leg carried.
          if [ "${UNIT_COUNT}" -lt 1 ]; then
            echo "ERROR: no unit test binaries found for the ${TIER} handoff"
            exit 1
          fi

          # Every handoff retains the complete applicable unit test set.
          echo ">>> Retaining ${UNIT_COUNT} applicable unit test binaries"

          # Delete test/deps (~2.8 GB on disk). These are the test-framework
          # dependencies (mariadb-connector-c, mysql-connector-c 5.7,
          # mysql-connector-c 8.4) that TAP binaries statically link against
          # at build time. Nothing at runtime looks at test/deps — the code
          # it contains already lives inside the compiled *-t binaries.
          # Dropping it from the cache saves ~700 MB per variant after
          # zstd compression.
          #
          # Safety check: verify no TAP binary dynamically links against
          # libraries that would be under test/deps, or has a RUNPATH /
          # RPATH pointing at test/deps. If this check fails, someone has
          # added a test that dynamically links to a test/deps library
          # and deleting test/deps will break that test at runtime (with
          # a cryptic .so-not-found error). Fail loudly in CI-builds now
          # instead of silently corrupting the cache.
          BAD_BINS=""
          while IFS= read -r b; do
            deps_needed=$(readelf -d "$b" 2>/dev/null | grep -E "NEEDED.*\b(libmysqlclient|libjson_binlog|libstrings_shared|libmariadbclient)\.so" || true)
            deps_rpath=$(readelf -d "$b" 2>/dev/null | grep -E "R(UN)?PATH.*test/deps" || true)
            if [ -n "${deps_needed}" ] || [ -n "${deps_rpath}" ]; then
              BAD_BINS="${BAD_BINS}${b}\n"
              echo ">>> UNSAFE: $(basename ${b})"
              [ -n "${deps_needed}" ] && echo "    ${deps_needed}"
              [ -n "${deps_rpath}" ] && echo "    ${deps_rpath}"
            fi
          done < <(find test/tap/tests test/tap/tests_with_deps -type f -name '*-t' 2>/dev/null)
          if [ -n "${BAD_BINS}" ]; then
            echo "ERROR: the following TAP binaries depend on test/deps at runtime:"
            printf "${BAD_BINS}"
            echo "       Cannot drop test/deps from the _test cache without"
            echo "       breaking these tests. Fix the Makefile to link"
            echo "       them statically, or update ci-builds.yml to keep"
            echo "       test/deps in the cache."
            exit 1
          fi
          echo ">>> test/deps runtime-dependency check passed"

          # Stage mysqlbinlog into the _test cache before the test/deps
          # deletion below. The mysql-connector-c-8.4.0 build above produces
          # the mysqlbinlog CLI under
          # test/deps/mysql-connector-c-8.4.0/<mysql-8.4>/runtime_output_directory/mysqlbinlog
          # as a side effect of `make` (cmake + the default target list).
          # test_com_binlog_dump_enables_fast_forward-t shells out to it at
          # runtime via system(); the test harness looks for it under
          # ${TEST_DEPS}/mysqlbinlog. Copy the binary into
          # test/tap/tap/bin/ (inside the _test cache's tar root) so it
          # survives the test/deps prune below and is available to every
          # CI-* test workflow that consumes this cache. The runner at
          # test/infra/control/run-tests-isolated.bash will then `find` it
          # here and symlink it into TEST_DEPS/mysqlbinlog. ~37 MB extra
          # in the _test cache -- small compared to the existing ~700 MB
          # saved by dropping the rest of test/deps.
          #
          # The bash glob `mysql-*-8.4*` matches whatever mysql source
          # dir the upstream cmake + ln created; the build steps above
          # always name the symlinked source dir `mysql-8.4.*` (today
          # `mysql-8.4.0`). If multiple versions coexist, the first match
          # is used -- which is fine because the runner only needs ONE
          # mysqlbinlog to satisfy ${TEST_DEPS}/mysqlbinlog.
          stage_mysqlbinlog=0
          for src in test/deps/mysql-connector-c-8.4.0/mysql-*/runtime_output_directory/mysqlbinlog; do
            if [ -x "${src}" ]; then
              mkdir -p test/tap/tap/bin
              sudo cp -f "${src}" test/tap/tap/bin/mysqlbinlog
              sudo chmod 0755 test/tap/tap/bin/mysqlbinlog
              echo ">>> Staged mysqlbinlog from ${src} -> test/tap/tap/bin/mysqlbinlog"
              stage_mysqlbinlog=1
              break
            fi
          done
          if [ "${stage_mysqlbinlog}" -eq 0 ]; then
            echo ">>> WARNING: no mysqlbinlog found under test/deps/mysql-connector-c-8.4.0/ — binlog TAP tests will fail" >&2
          fi

          # sudo required: test/deps contents are owned by root (created
          # inside the docker build container). See comment above on the
          # unit test delete.
          if [ -d test/deps ]; then
            sudo rm -rf test/deps
            echo ">>> Deleted test/deps from the cache payload"
          fi

        elif [[ "${{ matrix.type }}" =~ "-test" ]]; then
          TYPE=${{ matrix.type }}
          # build TYPE
          #sed -i "/command/c \    command: bash -l -c 'cd /opt/proxysql && make -j$(nproc) ${TYPE#-}'" docker-compose.yml
          make ${{ matrix.dist }}-test | tee ci_build_log/build.log
        else
          make ${{ matrix.dist }}${{ matrix.type }} | tee ci_build_log/build.log
        fi

    - name: Check build
      id: check_build
      if: ${{ inputs.trusted && success() }}
      run: |
        for LOG in proxysql/ci_build_log/build*.log ; do
          grep 'exited with code 0' ${LOG} || exit 1
        done

    - name: Stage compiled runtime libraries in test handoff
      if: ${{ inputs.trusted && success() }}
      run: |
        set -euo pipefail
        cd proxysql/
        runtime_dir="test/tap/tap/_runtime_libs"
        mkdir -p "${runtime_dir}"

        # Stage a versioned runtime .so by its SONAME, tolerating a lost
        # symlink. Resolve the SONAME if present, else fall back to the newest
        # matching real file. A missing library is fatal only when a built
        # consumer actually declares it in DT_NEEDED.
        stage_lib() {
          local dir="$1" soname="$2" dest="$3" src=""
          if [ -e "$dir/$soname" ]; then
            src="$dir/$soname"
          else
            src=$(ls -1 "$dir/$soname."* 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -z "$src" ] || [ ! -e "$src" ]; then
            echo "ERROR: cannot stage $soname -- no file matching $dir/$soname* (deps build incomplete or shared lib not produced)"
            ls -la "$dir" || true
            return 1
          fi
          cp -fL "$src" "$dest/$soname"
          echo "staged $soname <- $(readlink -f "$src")"
        }

        # Shared RE2 is optional because some branches build it statically.
        if [ -d deps/re2/re2/obj/so ]; then
          stage_lib deps/re2/re2/obj/so libre2.so.10 "${runtime_dir}"
        else
          echo "RE2 is static-only; no libre2 runtime library to stage"
        fi

        # v3.0 links libpq into libtap.so dynamically. Issue #6115 links
        # libpq.a into each TAP executable and deliberately omits libpq.so.
        # Inspect the built consumer so both source layouts work with this
        # reusable workflow, while still failing if a required .so is absent.
        if ! libtap_dynamic=$(readelf -d test/tap/tap/libtap.so); then
          echo "ERROR: cannot inspect test/tap/tap/libtap.so" >&2
          exit 1
        fi
        if grep -Fq 'Shared library: [libpq.so.5]' <<< "${libtap_dynamic}"; then
          stage_lib deps/postgresql/postgresql/src/interfaces/libpq libpq.so.5 "${runtime_dir}"
        else
          echo "libtap.so uses static libpq; no libpq runtime library to stage"
        fi

        # The build decides which plugins exist. Package all of its outputs
        # identically, including builds with no plugins.
        shopt -s nullglob
        for plugin in plugins/*/*.so; do
          if [ ! -s "${plugin}" ]; then
            echo "ERROR: empty or missing plugin: ${plugin}" >&2
            exit 1
          fi
          # Replace root-owned files pre-staged by the container build.
          cp -fL "${plugin}" "${runtime_dir}/"
        done
        ls -la "${runtime_dir}/"

    - name: Record built product metadata
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py stamp
      if: ${{ inputs.trusted && success() }}
    - name: Publish product metadata
      if: ${{ inputs.trusted && success() && steps.artifacts.outputs.publish_metadata == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-leg-${{ needs.plan.outputs.execution_id }}-${{ matrix.tier }}
        path: metadata.json
        retention-days: 3
    - name: Pack complete regular handoff (zstd-15)
      # Tier-agnostic. This used to be gated on the '-gcov' substring, i.e. on
      # the v40 leg only. The pack itself is tier-agnostic already: every entry
      # is nullglob-guarded, so a downgrade leg with no .gcno and no plugins
      # simply omits them.
      if: ${{ inputs.trusted && success() }}
      run: |
        set -euo pipefail
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        cd proxysql/
        shopt -s nullglob
        gcno=(lib/obj/*.gcno plugins/*/obj/*.gcno)
        matrix_files=(tap-matrix*)
        plugin_files=(plugins/*/*.so)
        echo ">>> packing handoff: tier=${TIER} variant=${VARIANT} gcno=${#gcno[@]} matrix=${#matrix_files[@]} plugins=${#plugin_files[@]}"
        # "${arr[@]}" on an empty array is a no-op under set -u on bash >= 4.4
        # (all packaging containers), which is what lets the tier-agnostic
        # pack work with no .gcno / no plugins.
        tar -cf - src/ test/ "${gcno[@]}" "${matrix_files[@]}" "${plugin_files[@]}" \
          | zstd -15 -T0 -o ../cache_full.tar.zst

    - name: Upload complete regular handoff
      if: ${{ inputs.trusted && success() && steps.artifacts.outputs.publish_handoff == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        # Execution, product tier and mode identify this immutable handoff.
        name: ${{ matrix.artifact_name }}
        retention-days: 1
        # 0 is deliberate: the payload is already zstd-15 compressed by the pack
        # step, and re-compressing it measures at <=0.23% size for minutes of
        # CPU. See issue #6232.
        compression-level: 0
        if-no-files-found: error
        path: cache_full.tar.zst


    # Nuke ALL docker state before leaving the runner clean for its next job.
    # This prevents a failed or cancelled build from continuing to write
    # root-owned files into the bind mount while the runner is being cleaned.
    # Run on every outcome and fail loudly if Docker cannot be fully cleaned.
    # As with preflight, this is intentionally an unconditional wipe of every
    # container, volume and network -- nothing dockerized may survive.
    - name: Nuke all docker state (leave runner clean)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && always() }}
      run: |
        set -euo pipefail
        echo ">>> removing all docker containers"
        containers="$(docker ps -aq)"
        if [ -n "${containers}" ]; then
          docker rm -f ${containers}
        fi
        echo ">>> removing all docker volumes"
        docker volume prune -af
        echo ">>> removing all docker networks"
        docker network prune -f

    # Undo the root ownership the dockerized build left behind so the next job
    # on this self-hosted runner can clean and check out without EACCES.
    - name: Reclaim workspace ownership (leave runner clean)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && always() }}
      run: |
        set -euo pipefail
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"

        echo ">>> returning self-hosted workspace ownership to the runner: ${workspace}"
        sudo -n chown -R "${runner_uid}:${runner_gid}" "${workspace}"
        sudo -n chmod -R u+rwX "${workspace}"

        remaining="$(sudo -n find "${workspace}" ! -uid "${runner_uid}" -print -quit)"
        if [ -n "${remaining}" ]; then
          echo "::error::workspace cleanup incomplete; first foreign-owned path: ${remaining}"
          sudo -n find "${workspace}" ! -uid "${runner_uid}" -print | head -n 20
          exit 1
        fi

    - name: Archive artifacts
      if: ${{ inputs.trusted && failure() && !cancelled() && (steps.build.outcome == 'failure' || steps.check_build.outcome == 'failure') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-builds-${{ needs.plan.outputs.execution_id }}-${{ matrix.tier }}-${{ matrix.mode }}-logs-attempt${{ github.run_attempt }}
        # The checkout is a live bind mount on self-hosted runners. Uploading
        # it after an unrelated preflight failure can race a stale container
        # and turn a diagnostic upload into a second failure. Build logs are
        # the relevant evidence when Build or its log validation fails.
        path: proxysql/ci_build_log/
        if-no-files-found: warn

    - name: Complete product build check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ inputs.trusted && always() }}
    name: ${{ matrix.check_name }}
  finalize:
    needs:
    - plan
    - builds
    if: ${{ inputs.trusted && always() && needs.plan.result == 'success' }}
    runs-on: ${{ inputs.trusted && ((github.actor == 'renecannao' || (inputs.trigger && fromJson(inputs.trigger).event.workflow_run.actor.login == 'renecannao')) && vars.SELFHOSTED_WORKFLOWS && contains(fromJson(vars.SELFHOSTED_WORKFLOWS), github.workflow) && fromJson('["self-hosted","proxysql-ci"]')) || 'ubuntu-24.04' }}
    steps:
    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.plan.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Finalize build manifest
      id: finalize
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CI_PLAN: ${{ needs.plan.outputs.plan }}
        BUILD_RESULT: ${{ needs.builds.result }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py finalize
    - name: Publish immutable manifest
      if: ${{ inputs.trusted && steps.finalize.outputs.publish_manifest == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-manifest-${{ needs.plan.outputs.execution_id }}
        path: manifest.json
        retention-days: 3
