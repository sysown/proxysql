name: CI-builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string
      trusted:
        description: Whether the caller may use privileged CI infrastructure.
        required: false
        type: boolean
        default: true
      tier:
        # Feature tier to build. v30 = Stable (no flag at all), v31 =
        # PROXYSQL31=1, v40 = PROXYSQL40=1 (implies PROXYSQL31).
        #
        # The default is v40 because that is what every historical caller has
        # built: PRs and merges alike run the v4.0 tier. CI-tier-sweep.yml is
        # the only caller that passes anything else, and it does so with its
        # own explicit matrix leg. Keeping the default at v40 is what makes
        # this change a no-op for the ~51 existing consumers.
        description: Feature tier to build (v30, v31 or v40).
        required: false
        type: string
        default: 'v40'
      variant:
        # Artifact variant name, published as
        # ci-builds-handoff-<sha>-<variant>-full. Defaults to the historical
        # v40 variant so the existing consumers' hardcoded
        # HANDOFF_VARIANT: ubuntu24-tap-genai-gcov keeps resolving.
        description: Handoff artifact variant name.
        required: false
        type: string
        default: 'ubuntu24-tap-genai-gcov'

# This branch requires a pull request, including for admins
# (enforce_admins is on). `CI-builds-fork.yml` pins a commit on this
# branch, so anything that lands here changes what an untrusted fork
# build executes -- direct pushes skip that review entirely.
#
# Intentionally NO `permissions:` block here.
#
# A reusable workflow may not request more than its caller grants, so a
# static declaration must be <= the LEAST privileged caller. That is
# unsatisfiable here: trusted builds need the cache and artifact scopes,
# while fork builds must hold no write-capable token at all (see
# docs/superpowers/specs/2026-08-09-fork-pr-builds-design.md, "Security
# Constraints"). Declaring `write-all` made every call from the
# least-privilege caller fail before any job started -- which is why
# CI-builds-fork.yml has never once run (startup_failure on every fork PR).
#
# With no block the called workflow inherits the caller's permissions:
#   CI-builds.yml      (trusted)   grants write-all      -> unchanged
#   CI-builds-fork.yml (untrusted) grants contents:read  -> now starts
#
# contents:read is sufficient for an `inputs.trusted == false` run: only
# `Checkout repository` executes. Every cache/restore, cache/save,
# upload-artifact and archive step is gated on inputs.trusted, and BOTH
# LouisBrunner/checks-action steps are `inputs.trusted && always()`, so the
# fork path creates no custom checks and needs no checks:write -- exactly as
# the design spec requires.
#
# On a direct `workflow_dispatch` there is no caller, so the repository
# default token applies (currently `write`), which covers the cache and
# artifact steps. This workflow uses no OIDC, so the absence of id-token
# in that default is not a concern.

env:
  LOCK: CI_BUILDS_${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:

  resolve-tap-mode:
    # NO `permissions:` block here -- same reason as the workflow-level one
    # above. A called workflow may only narrow the caller's token, never
    # widen it, and CI-builds-fork.yml grants exactly `contents: read`.
    # Requesting `pull-requests: read` here made every fork PR fail at
    # startup with zero jobs (`startup_failure`), because GitHub rejects a
    # called workflow that asks for a scope its caller did not grant.
    #
    # Nothing is lost: the trusted caller (CI-builds.yml) grants write-all,
    # so this job inherits pull-requests: read there, which is the only
    # caller whose path reaches the `gh api` label read in
    # resolve-tap-build-mode.bash. That script returns at its first line for
    # an untrusted caller, so the fork path never needs the scope at all.
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: GH-Actions
        path: ci-control
        sparse-checkout: |
          .github/scripts/resolve-tap-build-mode.bash
        sparse-checkout-cone-mode: false
    - name: Resolve TAP build mode from PR label
      id: resolve
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TRUSTED: ${{ inputs.trusted }}
        TRIGGER_JSON: ${{ inputs.trigger }}
      run: |
        chmod +x ci-control/.github/scripts/resolve-tap-build-mode.bash
        mode="$(ci-control/.github/scripts/resolve-tap-build-mode.bash)"
        echo "Selected TAP build mode: ${mode}"
        printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

  resolve-tier:
    # NO `permissions:` block here, for exactly the reason spelled out on
    # resolve-tap-mode above: a called workflow may only narrow the caller's
    # token, never widen it, and CI-builds-fork.yml grants exactly
    # `contents: read`. Declaring any scope here would make every fork PR fail
    # at startup with zero jobs. This job needs no token at all -- it is pure
    # shell, no checkout, no API call -- so it is safe for every caller.
    #
    # This job exists so that `tier` reaches `builds` the same way
    # `TAP_BUILD_MODE` does (a resolve-* job feeding `needs.*.outputs.*` into
    # the matrix and env), rather than by reading `inputs` inside
    # `strategy.matrix`. It matches the file's existing idiom, and it puts the
    # tier validation in exactly one place.
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.t.outputs.tier }}
      variant: ${{ steps.t.outputs.variant }}
      is_v40: ${{ steps.t.outputs.is_v40 }}
    steps:
    - name: Resolve feature tier
      id: t
      env:
        TIER_IN: ${{ inputs.tier }}
        VARIANT_IN: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        case "${TIER_IN}" in
          v30)
            TIER=v30
            VARIANT="${VARIANT_IN}"
            [ "${VARIANT}" = 'ubuntu24-tap-genai-gcov' ] && VARIANT=ubuntu24-tap-v30
            ;;
          v31)
            TIER=v31
            VARIANT="${VARIANT_IN}"
            [ "${VARIANT}" = 'ubuntu24-tap-genai-gcov' ] && VARIANT=ubuntu24-tap-v31
            ;;
          v40)
            TIER=v40
            # The v40 variant is load-bearing: 49 existing consumers hardcode
            # it. Never let a caller silently repoint it.
            VARIANT=ubuntu24-tap-genai-gcov
            ;;
          *)
            echo "::error::unknown tier '${TIER_IN}' (expected v30, v31 or v40)"
            exit 1
            ;;
        esac
        echo "Resolved feature tier: ${TIER} (variant=${VARIANT})"
        printf 'tier=%s\n'    "${TIER}"    >> "$GITHUB_OUTPUT"
        printf 'variant=%s\n' "${VARIANT}" >> "$GITHUB_OUTPUT"
        printf 'is_v40=%s\n'  "$([ "${TIER}" = v40 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

#  lock:
#    runs-on: ubuntu-22.04
#    env:
#      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#
#    steps:
#
#    - name: Concurency locking
#      run: |
#        # lock fast
#        echo "Setting lock '${LOCK^^}' to '${{ github.workflow }}'"
#        gh variable -R ${{ github.repository }} list | grep -i ${LOCK} >/dev/null || gh variable -R ${{ github.repository }} set ${LOCK} -b '${{ github.workflow }}' >/dev/null
#
#        # wait for unlock
#        sleep 5
#        PROBE="$(gh variable -R ${{ github.repository }} list | grep -i ${LOCK} || echo '')"
#        if [[ ! ${PROBE} =~ ${{ github.workflow }} ]]; then
#          while [[ ! -z ${PROBE} ]]; do
#            echo "Wating for unlock '${LOCK^^}' by '$(echo ${PROBE} | awk '{ print $2 }')' ..."
#            sleep 15
#            PROBE="$(gh variable -R ${{ github.repository }} list | grep -i ${LOCK} || echo '')"
#          done
#        else
#          echo "Aquired lock '${LOCK^^}' by '${{ github.workflow }}'"
#        fi



  builds:
    needs: [ resolve-tap-mode, resolve-tier ]
    # Route to the self-hosted proxysql-ci pool only when: the actor is renecannao
    # (trusted) AND this workflow is listed in the SELFHOSTED_WORKFLOWS repo variable.
    # Otherwise fall back to GitHub-hosted ubuntu-24.04. Empty/absent variable = no routing.
    runs-on: ${{ inputs.trusted && ((github.actor == 'renecannao' || (inputs.trigger && fromJson(inputs.trigger).event.workflow_run.actor.login == 'renecannao')) && vars.SELFHOSTED_WORKFLOWS && contains(fromJson(vars.SELFHOSTED_WORKFLOWS), github.workflow) && fromJson('["self-hosted","proxysql-ci"]')) || 'ubuntu-24.04' }}
    timeout-minutes: 120
#    needs: [ lock ]
#    outputs:
#      matrix: ${{ steps.set-matrix.outputs.matrix }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # The sole regular producer. It builds the complete chassis with
          # coverage metadata and retains every TAP/unit binary for every
          # downstream group.
          #
          # `type` is now just '-tap': that token is what selects
          # `make ubuntu24-tap` -> build_tap_test_debug (see the note at the
          # make invocation). The feature tier used to be smuggled into this
          # same string as a '-genai' / '-gcov' substring and then recovered by
          # pattern-matching it back out in five different places, which meant
          # the tier had two sources of truth. `tier` is now an explicit matrix
          # key, and `variant` is what actually names the handoff artifact.
          - dist: 'ubuntu24'
            type: '-tap'
            tier: ${{ needs.resolve-tier.outputs.tier }}
            variant: ${{ needs.resolve-tier.outputs.variant }}
          # ubuntu22 is needed for ASAN TAP testing
          # disabled to save cache space
          #- dist: 'ubuntu22'
          #  type: '-tap-asan'
#          - dist: 'ubuntu22'
#            type: '-clang'
#          - dist: 'ubuntu22'
#            type: '-clang-tap'
#          - dist: 'ubuntu22'
#            type: '-clang-tap-asan'
    env:
      # Feature tier, resolved once in the resolve-tier job and threaded in
      # here. IS_V40 is the single boolean every v4.0-only step gates on, so
      # "does this step need the plugin chassis?" is answered in one place
      # instead of by substring-matching `type` at each call site.
      TIER: ${{ needs.resolve-tier.outputs.tier }}
      IS_V40: ${{ needs.resolve-tier.outputs.is_v40 }}
      VARIANT: ${{ needs.resolve-tier.outputs.variant }}
      TAP_BUILD_MODE: ${{ needs.resolve-tap-mode.outputs.mode }}
      MATRIX: '(${{ matrix.dist }},${{ matrix.type }},${{ needs.resolve-tier.outputs.tier }},${{ needs.resolve-tap-mode.outputs.mode }})'

    steps:

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      id: checks
      if: ${{ inputs.trusted && always() }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: '${{ github.workflow }} / ${{ github.job }} ${{ env.MATRIX }}'
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        status: 'in_progress'
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    
    # Self-hosted runners reuse the working directory between jobs. A cancelled
    # dockerized build can leave its Compose stack running against the
    # bind-mounted checkout (./:/opt/proxysql), where it continues to create
    # root-owned files while the next job starts. A VM receives all CI-builds
    # matrix legs serially, so the stale writer can belong to a different
    # distribution than the new leg. The previous project-name-filtered cleanup
    # never matched, because the Makefile names each project
    # <BLD_NAME>-<GITVERSION> (e.g. ubuntu24-tap-genai-gcov-3.0.11-502-gd8bdd5a), not the
    # bare distribution name. Nuke ALL docker state on the runner instead: every
    # container, every volume, every network. Nothing dockerized may survive
    # into the next job.
    - name: Nuke all docker state (self-hosted)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' }}
      run: |
        set -euo pipefail
        echo ">>> removing all docker containers"
        containers="$(docker ps -aq)"
        if [ -n "${containers}" ]; then
          docker rm -f ${containers}
        fi
        echo ">>> removing all docker volumes"
        docker volume prune -af
        echo ">>> removing all docker networks"
        docker network prune -f

    # The dockerized build writes files as root, so on the next job the
    # actions/checkout pre-clean can otherwise trip over them:
    #   ##[error]File was unable to be removed Error: EACCES: permission denied,
    #   unlink '.../proxysql/deps/prometheus-cpp/.../.bazelignore'
    # and the job fails before it even builds. Reclaim ownership for the runner
    # user first so checkout can clean. GitHub-hosted runners use an ephemeral
    # workspace and do not need this privileged operation.
    - name: Reclaim workspace ownership (self-hosted contamination guard)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' }}
      run: |
        set -euo pipefail
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"

        echo ">>> reclaiming self-hosted workspace ownership: ${workspace}"
        sudo -n chown -R "${runner_uid}:${runner_gid}" "${workspace}"
        sudo -n chmod -R u+rwX "${workspace}"

        remaining="$(sudo -n find "${workspace}" ! -uid "${runner_uid}" -print -quit)"
        if [ -n "${remaining}" ]; then
          echo "::error::workspace still contains files not owned by the runner: ${remaining}"
          sudo -n find "${workspace}" ! -uid "${runner_uid}" -print | head -n 20
          exit 1
        fi

    - name: Checkout repository
      if: ${{ success() }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        fetch-depth: 0
        path: 'proxysql'

    # Stage the tier-prune helper for non-v40 legs.
    #
    # It lives under .github/scripts/, which exists ONLY on the GH-Actions
    # branch -- the main `Checkout repository` step above checks out the
    # *commit under test* (env.SHA, i.e. a v3.0 commit) into proxysql/, and
    # v3.0 has no .github/scripts/ at all. This is precisely why
    # resolve-tap-mode does its own sparse checkout with `ref: GH-Actions`;
    # mirror that pattern rather than assuming proxysql/.github/scripts/ exists.
    #
    # Staged into ci-control/ (a sibling of proxysql/) so that the Build step,
    # which does `cd proxysql/`, can invoke it by a short path while the
    # script's own relative test/tap/... lookups still resolve against the
    # commit under test.
    - name: Stage tier-prune helper
      if: ${{ inputs.trusted && success() && needs.resolve-tier.outputs.is_v40 != 'true' }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: GH-Actions
        path: ci-control
        sparse-checkout: |
          .github/scripts/prune-tier-handoff.bash
        sparse-checkout-cone-mode: false

    # Vendored dependency archives are committed directly to git (no Git LFS),
    # so a plain checkout already contains the real archives. Just run each
    # dep's verifier before the Docker build container starts. The glob is
    # guarded so a branch with no verifier scripts still succeeds; enable
    # nullglob so a missing verifier expands to no loop iterations rather
    # than a literal non-executable pattern that would fail under `set -e`.
    - name: Verify vendored source archives
      if: ${{ inputs.trusted && success() }}
      working-directory: proxysql
      run: |
        set -euo pipefail
        shopt -s nullglob
        for v in deps/*/verify-source.bash; do
          "$v"
        done

#        ls -l proxysql/test/tap

    - name: Build
      timeout-minutes: 90
      id: build
      if: ${{ inputs.trusted && success() }}
      run: |
        cd proxysql/
        echo "TAP build mode: ${TAP_BUILD_MODE}"
        echo "Build matrix variant: ${{ matrix.dist }}${{ matrix.type }} (tier=${TIER}, variant=${VARIANT})"
        #sed -i 's/docker-compose/docker compose/g' Makefile
        git fetch --tags --force
        mkdir ci_build_log
        # NOTE: `type` is '-tap', so this concatenation is now 'ubuntu24-tap'.
        # It used to compare against 'ubuntu24-tap-genai-gcov' because the tier
        # was encoded in `type`; keep this string in sync with the matrix leg.
        if [[ "${TAP_BUILD_MODE}" = 'asan' && "${{ matrix.dist }}${{ matrix.type }}" = 'ubuntu24-tap' ]]; then
          sed -i "/command/i \      - WITHASAN=1" docker-compose.yml
          sed -i "/command/i \      - TEST_WITHASAN=1" docker-compose.yml
        fi
        # Feature tier. The Makefile cascades the defines itself
        # (PROXYSQL40=1 => PROXYSQL31/FFTO/TSDB; Makefile:66-79) and bumps
        # GITVERSION per tier (Makefile:82-92), which is what makes
        # `proxysql --version` -- and therefore the @proxysql_min_version filter
        # in run-tests-isolated.bash -- tier-aware. v30 injects nothing: the
        # bare tree already *is* the Stable tier.
        #
        # docker-compose.yml needs no edit for this: the `_build` service's
        # `environment:` block already passes PROXYSQL40/PROXYSQL31/PROXYSQLFFTO/
        # PROXYSQLTSDB through to the container (docker-compose.yml:9-25), and
        # `Makefile:106-111` re-exports them, so a value injected here reaches
        # make. PROXYSQL40 is additionally forwarded to the plugin sub-makes by
        # entrypoint.bash's EXTRA (entrypoint.bash:52-53).
        case "${TIER}" in
          v40)
            # GenAI / v4.0 chassis tier flag. PROXYSQLGENAI was REMOVED in
            # #5815 -- the GenAI/MCP/AI/RAG tier is now selected with
            # PROXYSQL40=1, which the top-level Makefile cascades into
            # PROXYSQL31 / PROXYSQLFFTO / PROXYSQLTSDB automatically. Injecting
            # the dead PROXYSQLGENAI flag was a silent no-op, so this build's
            # core libproxysql compiled as BARE STABLE (GITVERSION 3.0.x, no
            # tier defines) -- every test group consuming the genai-gcov cache
            # was exercising a Stable core, with FFTO/TSDB/genai/pass-through
            # #ifdef'd out. Use PROXYSQL40=1 so the core matches the tier.
            sed -i "/command/i \      - PROXYSQL40=1" docker-compose.yml
            # Coverage instrumentation. v40-only: WITHGCOV=1 costs build time
            # and emits .gcno that only the Codecov collector consumes, and the
            # CI-tier-sweep consumer does not set COVERAGE=1. See the handoff
            # pack step, which tolerates a missing .gcno set.
            sed -i "/command/i \      - WITHGCOV=1" docker-compose.yml
            ;;
          v31)
            # v3.1 tier: FFTO + TSDB + ED25519, no plugin chassis.
            sed -i "/command/i \      - PROXYSQL31=1" docker-compose.yml
            ;;
          v30)
            echo ">>> v30 (Stable) tier: injecting no tier flag"
            ;;
          *)
            echo "::error::unhandled tier '${TIER}' reached the Build step"
            exit 1
            ;;
        esac
        if [[ "${{ matrix.type }}" =~ "-tap" ]]; then
          # prebuild dependencies without debug
          #sed -i "/command/c \    command: bash -l -c '${ASAN} cd /opt/proxysql && make -j$(nproc) build_deps_clickhouse'" docker-compose.yml
          #make ${{ matrix.dist }} | tee ci_build_log/build-deps.log
          # build tap tests
          #sed -i "s/^build_tap_test_debug: build_src_debug$/build_tap_test_debug: build_src_debug_clickhouse/" Makefile
          #sed -i "/command/c \    command: bash -l -c 'cd /opt/proxysql && make -j$(nproc) build_tap_test_debug'" docker-compose.yml
          # NOTE: target must be -tap (not -dbg): entrypoint.bash routes on BLD_NAME
          # matching \-test|\-tap and selects build_tap_test_debug; -dbg takes the else
          # branch which only builds src/proxysql, leaving test/tap/tests/**/*-t unbuilt
          # (silent false-green — see v3.0 doc/GH-Actions/README.md debugging section).
          # On shared self-hosted runners, cap build parallelism so concurrent
          # jobs don't oversubscribe the box (Makefile honours MAKEOPT ?=, and it
          # propagates into the build container via docker-compose + entrypoint.bash).
          if [ "${{ runner.environment }}" = "self-hosted" ]; then export MAKEOPT="-j8"; fi
          make ${{ matrix.dist }}-tap | tee ci_build_log/build-tap.log

          # ------------------------------------------------------------
          # Feature-tier handoff pruning (v30/v31 only).
          #
          # A downgrade build compiles a strictly smaller set of test
          # translation units, and run-tests-isolated.bash already refuses to
          # SELECT any binary whose @proxysql_min_version exceeds the running
          # binary's own compiled version. So the binaries that are too new for
          # this tier are dead weight in the handoff. Drop them here, which
          # does two things at once:
          #   1. shrinks the artifact -- the unit binaries are ~170 MB each
          #      because they statically link libproxysql.a in debug mode, so
          #      for a v30 leg this removes ~68 of 133 of them;
          #   2. makes a "not-found" false-red structurally impossible, since
          #      run-tests-isolated.bash:256-262 counts a missing binary as a
          #      FAILURE.
          #
          # This MUST run before the tap-matrix* generation below, so those
          # files describe the tree that actually ships.
          #
          # v40 is deliberately excluded: the existing consumers depend on the
          # complete binary set, and its version filter selects everything.
          # sudo is required -- the binaries are created by the build container
          # running as root, and unlink needs write access to the parent
          # directory, which the runner user does not have (same constraint as
          # the unit-binary deletion further down).
          # ------------------------------------------------------------
          if [ "${IS_V40}" != "true" ]; then
            # ABSOLUTE path on purpose. `actions/checkout` places its `path:`
            # relative to $GITHUB_WORKSPACE, so `path: ci-control` and
            # `path: proxysql` are SIBLINGS -- and this step has already run
            # `cd proxysql/`. A relative `ci-control/...` would therefore
            # resolve to proxysql/ci-control/... and not exist. (It did, and
            # every downgrade build died there; caught in PR #6234 review.)
            sudo "${GITHUB_WORKSPACE}/ci-control/.github/scripts/prune-tier-handoff.bash" \
              --binary src/proxysql --groups test/tap/groups/groups.json
          fi

          # create matrix of all test folders containing *-t
          echo "[ "$(find test/tap/ -name '*-t' | xargs -n1 dirname | uniq | sed 's|test/tap/||' | xargs -I{} -n1 echo -n "'{}', ")"]" > tap-matrix.json
          find test/tap/ -name *-t | xargs -n1 dirname | uniq  > tap-matrix.txt
          echo "===================="
          echo ">>>tap-matrix.txt<<<"
          cat tap-matrix.txt
          echo "===================="
          # create matrixes of all tests
          for TESTS in test/tap/tests*; do
            echo "[ "$(find -L $TESTS -type f -name '*-t' -executable -printf "'%f', ")" ]" > tap-matrix-${TESTS##*/}.json
            find -L $TESTS -type f -name '*-t' -executable -printf "%f\n" > tap-matrix-${TESTS##*/}.txt
            echo "===================="
            echo ">>>${TESTS##*/}<<<"
            cat tap-matrix-${TESTS##*/}.txt
            echo "===================="
          done

          # ------------------------------------------------------------
          # Cache size control: prune artifacts the _test cache doesn't
          # need before it gets saved. Without this pruning, the _test
          # cache grows to ~4 GB compressed (~16 GB uncompressed), and
          # two concurrent cascades (each saving a regular and a gcov cache)
          # exceed GitHub's 10 GB
          # per-repo cache quota. LRU eviction then deletes caches
          # between when CI-builds saves them and when downstream test
          # workflows try to restore them, causing "Cache restore test"
          # to fail and the entire TAP pipeline to break.
          # ------------------------------------------------------------

          # Compile-time safety checks. A normal TAP build produces the
          # integration binaries in tests/; it need not build tests/unit.
          # The -tap-mysqlx cache is the exception: CI-mysqlx runs its
          # mysqlx_*_unit-t and plugin_*_unit-t binaries directly.
          # Fail loudly when the expected binaries are absent rather than
          # letting cache-pruning succeed on an empty set.
          TAP_COUNT=$(find test/tap/tests test/tap/tests_with_deps -path test/tap/tests/unit -prune -o -type f -name '*-t' -executable -print 2>/dev/null | wc -l)
          UNIT_COUNT=$(find test/tap/tests/unit -type f -name '*-t' -executable 2>/dev/null | wc -l)
          echo ">>> Compiled ${TAP_COUNT} TAP test binaries, including ${UNIT_COUNT} unit test binaries"
          if [ "${TAP_COUNT}" -lt 1 ]; then
            echo "ERROR: no executable TAP test binaries found under test/tap/tests"
            echo "       This typically means the TAP build did not run or failed."
            exit 1
          fi
          # Every tier's handoff retains unit binaries, so this guard is
          # tier-agnostic. It used to be gated on the '-gcov' substring, which
          # only the v40 leg carried.
          if [ "${UNIT_COUNT}" -lt 1 ]; then
            echo "ERROR: no unit test binaries found for the ${TIER} handoff"
            exit 1
          fi

          # Delete unit test binaries before the cache save. Each is ~170 MB
          # because they statically link libproxysql.a in debug mode
          # (52 binaries × 170 MB = 8.8 GB). CI-unittests on v3.0 is
          # disabled for now; when it's re-enabled it will need its own
          # rebuild strategy (probably a full docker-compose rebuild).
          #
          # sudo is required: files under test/tap/tests/unit/ and test/deps/
          # are created inside the docker build container running as root,
          # and the host-side runner user can't always remove root-owned
          # files under root-owned subdirectories (unlink needs write access
          # to the parent directory, which the runner doesn't always have).
          #
          # On the -tap-mysqlx matrix variant, CI-mysqlx (downstream) runs
          # the mysqlx_*_unit-t and plugin_*_unit-t binaries directly against
          # this cache, so preserve those and delete only the rest. Spot-
          # checks (readelf) confirm the kept binaries do not dyn-link to
          # test/deps -- the test/deps deletion below still applies.
          # On the v40 leg, retain every unit binary: the ~51 existing consumers
          # may select any of them, and the complete handoff is the only thing
          # they get.
          #
          # On a v30/v31 leg, prune-tier-handoff.bash has ALREADY reduced
          # tests/unit to exactly the binaries this tier's version filter can
          # select, and UNIT_COUNT above is measured after that prune. So the
          # correct action is to keep them: ci-tier-sweep.yml runs the
          # `unit-tests-g1` group explicitly, and deleting them here would
          # leave the handoff unable to run it. (This branch used to be the
          # catch-all `else` that deleted every unit binary; for v30/v31 that
          # silently emptied tests/unit. Caught in PR #6234 review.)
          if [ "${IS_V40}" = "true" ]; then
            echo ">>> Retaining all ${UNIT_COUNT} unit test binaries for the complete v40 handoff"
          elif [[ "${{ matrix.type }}" =~ "-mysqlx" ]]; then
            sudo find test/tap/tests/unit -type f -name '*-t' \
              ! -name 'mysqlx_*_unit-t' ! -name 'plugin_*_unit-t' -delete
            KEPT=$(find test/tap/tests/unit -type f -name '*-t' 2>/dev/null | wc -l)
            echo ">>> Deleted $((UNIT_COUNT - KEPT)) unit test binaries, kept ${KEPT} mysqlx_*/plugin_* binaries"
          else
            # A non-v40 TAP leg was already pruned to its selectable set. Only a
            # leg that was NOT pruned (i.e. no -tap block ran) may still need
            # the bulk delete; assert that rather than deleting blind.
            echo ">>> Retaining the ${UNIT_COUNT} unit test binaries left by the ${TIER} tier prune"
          fi

          # Delete test/deps (~2.8 GB on disk). These are the test-framework
          # dependencies (mariadb-connector-c, mysql-connector-c 5.7,
          # mysql-connector-c 8.4) that TAP binaries statically link against
          # at build time. Nothing at runtime looks at test/deps — the code
          # it contains already lives inside the compiled *-t binaries.
          # Dropping it from the cache saves ~700 MB per variant after
          # zstd compression.
          #
          # Safety check: verify no TAP binary dynamically links against
          # libraries that would be under test/deps, or has a RUNPATH /
          # RPATH pointing at test/deps. If this check fails, someone has
          # added a test that dynamically links to a test/deps library
          # and deleting test/deps will break that test at runtime (with
          # a cryptic .so-not-found error). Fail loudly in CI-builds now
          # instead of silently corrupting the cache.
          BAD_BINS=""
          while IFS= read -r b; do
            deps_needed=$(readelf -d "$b" 2>/dev/null | grep -E "NEEDED.*\b(libmysqlclient|libjson_binlog|libstrings_shared|libmariadbclient)\.so" || true)
            deps_rpath=$(readelf -d "$b" 2>/dev/null | grep -E "R(UN)?PATH.*test/deps" || true)
            if [ -n "${deps_needed}" ] || [ -n "${deps_rpath}" ]; then
              BAD_BINS="${BAD_BINS}${b}\n"
              echo ">>> UNSAFE: $(basename ${b})"
              [ -n "${deps_needed}" ] && echo "    ${deps_needed}"
              [ -n "${deps_rpath}" ] && echo "    ${deps_rpath}"
            fi
          done < <(find test/tap/tests test/tap/tests_with_deps -type f -name '*-t' 2>/dev/null)
          if [ -n "${BAD_BINS}" ]; then
            echo "ERROR: the following TAP binaries depend on test/deps at runtime:"
            printf "${BAD_BINS}"
            echo "       Cannot drop test/deps from the _test cache without"
            echo "       breaking these tests. Fix the Makefile to link"
            echo "       them statically, or update ci-builds.yml to keep"
            echo "       test/deps in the cache."
            exit 1
          fi
          echo ">>> test/deps runtime-dependency check passed"

          # Stage mysqlbinlog into the _test cache before the test/deps
          # deletion below. The mysql-connector-c-8.4.0 build above produces
          # the mysqlbinlog CLI under
          # test/deps/mysql-connector-c-8.4.0/<mysql-8.4>/runtime_output_directory/mysqlbinlog
          # as a side effect of `make` (cmake + the default target list).
          # test_com_binlog_dump_enables_fast_forward-t shells out to it at
          # runtime via system(); the test harness looks for it under
          # ${TEST_DEPS}/mysqlbinlog. Copy the binary into
          # test/tap/tap/bin/ (inside the _test cache's tar root) so it
          # survives the test/deps prune below and is available to every
          # CI-* test workflow that consumes this cache. The runner at
          # test/infra/control/run-tests-isolated.bash will then `find` it
          # here and symlink it into TEST_DEPS/mysqlbinlog. ~37 MB extra
          # in the _test cache -- small compared to the existing ~700 MB
          # saved by dropping the rest of test/deps.
          #
          # The bash glob `mysql-*-8.4*` matches whatever mysql source
          # dir the upstream cmake + ln created; the build steps above
          # always name the symlinked source dir `mysql-8.4.*` (today
          # `mysql-8.4.0`). If multiple versions coexist, the first match
          # is used -- which is fine because the runner only needs ONE
          # mysqlbinlog to satisfy ${TEST_DEPS}/mysqlbinlog.
          stage_mysqlbinlog=0
          for src in test/deps/mysql-connector-c-8.4.0/mysql-*/runtime_output_directory/mysqlbinlog; do
            if [ -x "${src}" ]; then
              mkdir -p test/tap/tap/bin
              sudo cp -f "${src}" test/tap/tap/bin/mysqlbinlog
              sudo chmod 0755 test/tap/tap/bin/mysqlbinlog
              echo ">>> Staged mysqlbinlog from ${src} -> test/tap/tap/bin/mysqlbinlog"
              stage_mysqlbinlog=1
              break
            fi
          done
          if [ "${stage_mysqlbinlog}" -eq 0 ]; then
            echo ">>> WARNING: no mysqlbinlog found under test/deps/mysql-connector-c-8.4.0/ — binlog TAP tests will fail" >&2
          fi

          # sudo required: test/deps contents are owned by root (created
          # inside the docker build container). See comment above on the
          # unit test delete.
          if [ -d test/deps ]; then
            sudo rm -rf test/deps
            echo ">>> Deleted test/deps from the cache payload"
          fi

        elif [[ "${{ matrix.type }}" =~ "-test" ]]; then
          TYPE=${{ matrix.type }}
          # build TYPE
          #sed -i "/command/c \    command: bash -l -c 'cd /opt/proxysql && make -j$(nproc) ${TYPE#-}'" docker-compose.yml
          make ${{ matrix.dist }}-test | tee ci_build_log/build.log
        else
          make ${{ matrix.dist }}${{ matrix.type }} | tee ci_build_log/build.log
        fi

    - name: Check build
      id: check_build
      if: ${{ inputs.trusted && success() }}
      run: |
        for LOG in proxysql/ci_build_log/build*.log ; do
          grep 'exited with code 0' ${LOG} || exit 1
        done

    - name: Stage MySQLX runtime libraries in test handoff
      # v40 only: a downgrade build produces no plugins at all (the Makefile
      # prints "[skip] <plugin> (PROXYSQL40 not set)"), and the `cp -L
      # plugins/mysqlx/...` below is unconditional, so this step must not run
      # for v30/v31 or it aborts on a missing file.
      if: ${{ inputs.trusted && success() && needs.resolve-tier.outputs.is_v40 == 'true' }}
      run: |
        set -euo pipefail
        cd proxysql/
        runtime_dir="test/tap/tap/_runtime_libs"
        mkdir -p "${runtime_dir}"

        # Stage a versioned runtime .so by its SONAME, tolerating a lost
        # symlink. Resolve the SONAME if present, else fall back to the newest
        # matching real file. A missing library is fatal only when a built
        # consumer actually declares it in DT_NEEDED.
        stage_lib() {
          local dir="$1" soname="$2" dest="$3" src=""
          if [ -e "$dir/$soname" ]; then
            src="$dir/$soname"
          else
            src=$(ls -1 "$dir/$soname."* 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -z "$src" ] || [ ! -e "$src" ]; then
            echo "ERROR: cannot stage $soname -- no file matching $dir/$soname* (deps build incomplete or shared lib not produced)"
            ls -la "$dir" || true
            return 1
          fi
          cp -L "$src" "$dest/$soname"
          echo "staged $soname <- $(readlink -f "$src")"
        }

        # Shared RE2 is optional because some branches build it statically.
        if [ -d deps/re2/re2/obj/so ]; then
          stage_lib deps/re2/re2/obj/so libre2.so.10 "${runtime_dir}"
        else
          echo "RE2 is static-only; no libre2 runtime library to stage"
        fi

        # v3.0 links libpq into libtap.so dynamically. Issue #6115 links
        # libpq.a into each TAP executable and deliberately omits libpq.so.
        # Inspect the built consumer so both source layouts work with this
        # reusable workflow, while still failing if a required .so is absent.
        if ! libtap_dynamic=$(readelf -d test/tap/tap/libtap.so); then
          echo "ERROR: cannot inspect test/tap/tap/libtap.so" >&2
          exit 1
        fi
        if grep -Fq 'Shared library: [libpq.so.5]' <<< "${libtap_dynamic}"; then
          stage_lib deps/postgresql/postgresql/src/interfaces/libpq libpq.so.5 "${runtime_dir}"
        else
          echo "libtap.so uses static libpq; no libpq runtime library to stage"
        fi

        cp -L plugins/mysqlx/ProxySQL_MySQLX_Plugin.so "${runtime_dir}/"
        cp -L plugins/genai/ProxySQL_GenAI_Plugin.so "${runtime_dir}/" 2>/dev/null || true
        ls -la "${runtime_dir}/"

    - name: Stage GenAI plugin in test handoff
      # v40 only -- see the MySQLX staging step above.
      if: ${{ inputs.trusted && success() && needs.resolve-tier.outputs.is_v40 == 'true' }}
      run: |
        set -euo pipefail
        cd proxysql/
        plugin_src="plugins/genai/ProxySQL_GenAI_Plugin.so"
        plugin_dest="test/tap/tap/_runtime_libs/ProxySQL_GenAI_Plugin.so"
        if [ ! -s "${plugin_src}" ]; then
          echo "ERROR: required GenAI plugin missing after build: ${plugin_src}" >&2
          exit 1
        fi
        mkdir -p "$(dirname "${plugin_dest}")"
        cp -L "${plugin_src}" "${plugin_dest}"
        test -s "${plugin_dest}"
        ls -la "$(dirname "${plugin_dest}")"

    - name: Pack complete regular handoff (zstd-15)
      # Tier-agnostic. This used to be gated on the '-gcov' substring, i.e. on
      # the v40 leg only. The pack itself is tier-agnostic already: every entry
      # is nullglob-guarded, so a downgrade leg with no .gcno and no plugins
      # simply omits them.
      if: ${{ inputs.trusted && success() }}
      run: |
        set -euo pipefail
        command -v zstd >/dev/null || sudo apt-get install -y zstd
        cd proxysql/
        shopt -s nullglob
        gcno=(lib/obj/*.gcno)
        matrix_files=(tap-matrix*)
        plugin_files=(plugins/*/*.so)
        # Only the v40 leg can have plugins. Asserting their presence
        # unconditionally is what blocked every downgrade build: a v30/v31
        # build legitimately produces zero (Makefile prints
        # "[skip] <plugin> (PROXYSQL40 not set)" for each one). Assert on v40
        # so a chassis regression there still fails loudly.
        if [ "${IS_V40}" = "true" ] && [ "${#plugin_files[@]}" -lt 1 ]; then
          echo "ERROR: no plugin shared libraries were built for the v40 handoff" >&2
          exit 1
        fi
        echo ">>> packing handoff: tier=${TIER} variant=${VARIANT} gcno=${#gcno[@]} matrix=${#matrix_files[@]} plugins=${#plugin_files[@]}"
        # "${arr[@]}" on an empty array is a no-op under set -u on bash >= 4.4
        # (all packaging containers), which is what lets the tier-agnostic
        # pack work with no .gcno / no plugins.
        tar -cf - src/ test/ "${gcno[@]}" "${matrix_files[@]}" "${plugin_files[@]}" \
          | zstd -15 -T0 -o ../cache_full.tar.zst

    - name: Upload complete regular handoff
      if: ${{ inputs.trusted && success() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        # The variant is the tier's identity in the artifact namespace. Every
        # existing consumer hardcodes HANDOFF_VARIANT: ubuntu24-tap-genai-gcov,
        # so resolve-tier pins that exact name for v40; the sweep's legs publish
        # ubuntu24-tap-v30 / -v31 alongside it, with no collision.
        name: ci-builds-handoff-${{ env.SHA }}-${{ env.VARIANT }}-full
        retention-days: 1
        # 0 is deliberate: the payload is already zstd-15 compressed by the pack
        # step, and re-compressing it measures at <=0.23% size for minutes of
        # CPU. See issue #6232.
        compression-level: 0
        if-no-files-found: error
        path: cache_full.tar.zst


    # Nuke ALL docker state before leaving the runner clean for its next job.
    # This prevents a failed or cancelled build from continuing to write
    # root-owned files into the bind mount while the runner is being cleaned.
    # Run on every outcome and fail loudly if Docker cannot be fully cleaned.
    # As with preflight, this is intentionally an unconditional wipe of every
    # container, volume and network -- nothing dockerized may survive.
    - name: Nuke all docker state (leave runner clean)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && always() }}
      run: |
        set -euo pipefail
        echo ">>> removing all docker containers"
        containers="$(docker ps -aq)"
        if [ -n "${containers}" ]; then
          docker rm -f ${containers}
        fi
        echo ">>> removing all docker volumes"
        docker volume prune -af
        echo ">>> removing all docker networks"
        docker network prune -f

    # Undo the root ownership the dockerized build left behind so the next job
    # on this self-hosted runner can clean and check out without EACCES.
    - name: Reclaim workspace ownership (leave runner clean)
      if: ${{ inputs.trusted && runner.environment == 'self-hosted' && always() }}
      run: |
        set -euo pipefail
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"

        echo ">>> returning self-hosted workspace ownership to the runner: ${workspace}"
        sudo -n chown -R "${runner_uid}:${runner_gid}" "${workspace}"
        sudo -n chmod -R u+rwX "${workspace}"

        remaining="$(sudo -n find "${workspace}" ! -uid "${runner_uid}" -print -quit)"
        if [ -n "${remaining}" ]; then
          echo "::error::workspace cleanup incomplete; first foreign-owned path: ${remaining}"
          sudo -n find "${workspace}" ! -uid "${runner_uid}" -print | head -n 20
          exit 1
        fi

    - name: Archive artifacts
      if: ${{ inputs.trusted && failure() && !cancelled() && (steps.build.outcome == 'failure' || steps.check_build.outcome == 'failure') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ci-builds-${{ env.SHA }}-run#${{ github.run_number }}-${{ matrix.dist }}${{ matrix.type }}
        # The checkout is a live bind mount on self-hosted runners. Uploading
        # it after an unrelated preflight failure can race a stale container
        # and turn a diagnostic upload into a second failure. Build logs are
        # the relevant evidence when Build or its log validation fails.
        path: proxysql/ci_build_log/
        if-no-files-found: warn

    - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23 # v2.0.0
      if: ${{ inputs.trusted && always() }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        check_id: ${{ steps.checks.outputs.check_id }}
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        conclusion: ${{ job.status }}
#        action_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

