name: CI-legacy-g2-genai

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string

env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:
  tests:
    runs-on: ubuntu-22.04
    # `write-all` grants every default GITHUB_TOKEN scope plus the
    # id-token:write scope codecov-action@v4 needs to mint a GitHub OIDC
    # token for `use_oidc: true`. We arrived at this after a tight
    # ratchet of "add one specific scope, find the next missing one":
    # an explicit `permissions:` block makes the list exhaustive (every
    # scope not listed is revoked from GITHUB_TOKEN), and Phase 2 needs
    # contents, checks, packages, actions, AND id-token -- five
    # successive failed runs added each one in turn, and even with all
    # five listed the cache restore step still failed. Falling back to
    # `write-all` matches what the cascading workflow_run runs have
    # implicitly and is what the rest of the TAP group workflows in the
    # repo use (none of them declare `permissions:` at all). The only
    # ProxySQL-specific need we add over their defaults is OIDC, and
    # write-all includes id-token. Trade-off: broader scope than ideal,
    # but provably works and matches the rest of the repo's posture.
    # Caller workflow CI-legacy-g2-genai.yml on v3.0 must also declare
    # write-all for the permissions to propagate through the reusable
    # call (permissions are intersected caller-callee).
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        infradb: [ 'mysql57' ]
    env:
      BLDCACHE: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}_ubuntu24-tap-genai-gcov_src
      MATRIX: '(${{ matrix.infradb }},genai-gcov)'

    steps:

    - uses: LouisBrunner/checks-action@v2.0.0
      id: checks
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: '${{ github.workflow }} / ${{ github.job }} ${{ env.MATRIX }}'
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        status: 'in_progress'
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: 'proxysql'
        sparse-checkout: |
          test/infra
          test/tap/groups
          test/scripts

    - name: Cache restore src
      id: cache-src
      uses: actions/cache/restore@v4
      with:
        key: ${{ env.BLDCACHE }}
        fail-on-cache-miss: true
        # MUST exactly match the path list in CI-builds' "Cache save src"
        # step. actions/cache hashes the path list into the cache
        # "version" alongside the key -- different path lists = different
        # version = lookup miss, even if the key is identical and the
        # cache plainly exists in the repo (verified via gh api).
        # CI-builds added proxysql/lib/obj/*.gcno for the -gcov variants
        # so this restore needs the same entry; otherwise the restore
        # silently misses with "Failed to restore cache entry".
        path: |
          proxysql/src/
          proxysql/lib/obj/*.gcno

    - name: Cache restore test
      id: cache-test
      uses: actions/cache/restore@v4
      with:
        key: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}_ubuntu24-tap-genai-gcov_test
        fail-on-cache-miss: true
        path: |
          proxysql/test/

    - name: Verify binary
      run: |
        chmod +x proxysql/src/proxysql
        file proxysql/src/proxysql

    - name: Log in to GHCR and pull CI base image
      # Both `docker login` and `docker pull` against ghcr.io have been
      # observed to fail transiently with `net/http: request canceled
      # (Client.Timeout exceeded while awaiting headers)`. Wrap both in
      # a short retry loop with linear backoff so a single network blip
      # does not red the whole TAP group.
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        attempt=0
        max_attempts=5
        while [ $attempt -lt $max_attempts ]; do
          attempt=$((attempt + 1))
          echo ">>> GHCR login+pull attempt ${attempt}/${max_attempts}"
          if echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin \
              && docker pull ghcr.io/sysown/proxysql-ci-base:latest; then
            echo ">>> GHCR login+pull OK on attempt ${attempt}"
            docker tag ghcr.io/sysown/proxysql-ci-base:latest \
                proxysql-ci-base:latest
            exit 0
          fi
          if [ $attempt -lt $max_attempts ]; then
            sleep_for=$((attempt * 10))
            echo ">>> attempt ${attempt} failed; sleeping ${sleep_for}s"
            sleep $sleep_for
          fi
        done
        echo ">>> all ${max_attempts} GHCR attempts failed"
        exit 1

    - name: Start infrastructure
      run: |
        cd proxysql
        export INFRA_ID="ci-legacy-g2-genai"
        export TAP_GROUP="legacy-g2"
        export SKIP_CLUSTER_START=1
        test/infra/control/ensure-infras.bash

    - name: Run legacy-g2 tests (GenAI + Coverage)
      run: |
        cd proxysql
        export INFRA_ID="ci-legacy-g2-genai"
        export TAP_GROUP="legacy-g2"
        export SKIP_CLUSTER_START=1
        export TAP_USE_NOISE=1
        export COVERAGE=1
        test/infra/control/run-tests-isolated.bash

    - name: Cleanup
      if: always()
      run: |
        set +e
        cd proxysql
        export INFRA_ID="ci-legacy-g2-genai"
        export TAP_GROUP="legacy-g2"
        docker logs proxysql.ci-legacy-g2-genai 2>&1 | tail -50 || true
        test/infra/control/stop-proxysql-isolated.bash
        test/infra/control/destroy-infras.bash

    - name: Fix artifact permissions
      if: ${{ failure() && !cancelled() }}
      run: |
        # actions/upload-artifact dies with EACCES when it scandirs into
        # directories under ci_*_logs/ that were created inside docker
        # build containers (root-owned). Make everything readable by the
        # runner user before upload. sudo required because files are
        # root-owned; 2>/dev/null + || true because the path may not
        # exist on all failure paths (e.g. a cache-restore failure before
        # any test even runs).
        sudo chmod -R a+rX proxysql/ci_*_logs/ 2>/dev/null || true

    - name: Archive artifacts logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-logs-run#${{ github.run_number }}
        path: |
          proxysql/ci_*_logs/

    - name: Archive coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-coverage-run#${{ github.run_number }}
        path: |
          proxysql/ci_infra_logs/ci-legacy-g2-genai/coverage-report/
        if-no-files-found: ignore

    - name: Upload coverage to Codecov
      # Send the LCOV .info file fastcov produces in run-tests-isolated.bash
      # (under proxysql/ci_infra_logs/ci-legacy-g2-genai/coverage-report/)
      # to Codecov. This is REAL ProxySQL coverage -- the proxysql binary
      # was built WITHGCOV=1 (-tap-genai-gcov build cache) and was the live
      # daemon answering the legacy-g2 TAP suite, so the report reflects
      # production code paths exercised by integration tests, not just the
      # lib-only unit-test slice that CI-unit-tests-asan-coverage uploads.
      #
      # `flags: tap-legacy-g2` lets Codecov merge per-group uploads and
      # later show per-flag coverage trends. `use_oidc: true` is mandatory
      # -- the repo has no CODECOV_TOKEN secret and Codecov rejects
      # tokenless legacy uploads with "branch is protected" HTTP 400 (see
      # the Phase 1 commit history on CI-unit-tests-asan-coverage.yml).
      #
      # `fail_ci_if_error: false` so a Codecov outage never fails the
      # whole TAP group; `!cancelled()` so coverage uploads even when
      # the test step itself reported a failure (partial coverage is
      # still useful diagnostically).
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v4
      with:
        files: proxysql/ci_infra_logs/ci-legacy-g2-genai/coverage-report/ci-legacy-g2-genai.info
        flags: tap-legacy-g2
        name: tap-legacy-g2-genai-coverage
        use_oidc: true
        fail_ci_if_error: false
        verbose: true

    - uses: LouisBrunner/checks-action@v2.0.0
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        check_id: ${{ steps.checks.outputs.check_id }}
        repo: ${{ github.repository }}
        sha: ${{ env.SHA }}
        conclusion: ${{ job.status }}
        details_url: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
