name: CI-3p-mariadb-connector-c
run-name: '${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }} ${{ github.workflow }} ${{ github.event.workflow_run && github.event.workflow_run.head_sha || github.sha }}'

on:
  workflow_dispatch:
    inputs:
      testtree:
        description: 'proxysql_3p_testing treeish/branch/tag/hash'
        default: main
        type: string
  workflow_run:
    workflows: [ CI-trigger ]
    types: [ completed ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  run-mysql:
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' || ! github.event.workflow_run }}
    # `write-all` is required because reusable-workflow permissions are the
    # intersection of caller + callee. Without it the workflow_run event's
    # GITHUB_TOKEN has no cache-writable scope, so the callee's
    # actions/cache/save@v4 fails with 'cache write denied: token has no
    # writable scopes' (GitHub started enforcing this for workflow_run in
    # early July 2026 alongside the Node.js 20 -> 24 actions deprecation).
    # The callee at ci-<group>.yml@GH-Actions also declares write-all.
    permissions: write-all
    uses: sysown/proxysql/.github/workflows/ci-3p-mariadb-connector-c.yml@GH-Actions
    secrets: inherit
    with:
      trigger: ${{ toJson(github) }}
      infradb: ${{ vars.MATRIX_3P_MARIADB_CONNECTOR_C_infradb_mysql }}
      connector: ${{ vars.MATRIX_3P_MARIADB_CONNECTOR_C_connector_mysql }}

  run-mariadb:
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' || ! github.event.workflow_run }}
    # `write-all` is required because reusable-workflow permissions are the
    # intersection of caller + callee. Without it the workflow_run event's
    # GITHUB_TOKEN has no cache-writable scope, so the callee's
    # actions/cache/save@v4 fails with 'cache write denied: token has no
    # writable scopes' (GitHub started enforcing this for workflow_run in
    # early July 2026 alongside the Node.js 20 -> 24 actions deprecation).
    # The callee at ci-<group>.yml@GH-Actions also declares write-all.
    permissions: write-all
    uses: sysown/proxysql/.github/workflows/ci-3p-mariadb-connector-c.yml@GH-Actions
    secrets: inherit
    with:
      trigger: ${{ toJson(github) }}
      infradb: ${{ vars.MATRIX_3P_MARIADB_CONNECTOR_C_infradb_mariadb }}
      connector: ${{ vars.MATRIX_3P_MARIADB_CONNECTOR_C_connector_mariadb }}
