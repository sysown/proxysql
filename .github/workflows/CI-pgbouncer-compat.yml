name: CI-pgbouncer-compat

on:
  push:
    branches: [ 'feature/pgbouncer-compat' ]
    paths:
      - 'lib/pgbouncer_compat/**'
      - 'include/PgBouncer_*.h'
      - 'include/ProxySQL_CLI.h'
      - 'test/tap/tests/unit/pgbouncer_*'
      - '.github/workflows/CI-pgbouncer-compat.yml'
  pull_request:
    paths:
      - 'lib/pgbouncer_compat/**'
      - 'include/PgBouncer_*.h'
      - 'include/ProxySQL_CLI.h'
      - 'test/tap/tests/unit/pgbouncer_*'

jobs:
  unit-tests:
    name: PgBouncer Compat Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential g++ make libssl-dev

      - name: Build unit tests
        working-directory: test/tap/tests/unit
        run: |
          make pgbouncer_config_parser_unit-t
          make pgbouncer_converter_unit-t
          make pgbouncer_show_commands_unit-t

      - name: Run parser tests (127 tests)
        working-directory: test/tap/tests/unit
        run: ./pgbouncer_config_parser_unit-t

      - name: Run converter tests (39 tests)
        working-directory: test/tap/tests/unit
        run: ./pgbouncer_converter_unit-t

      - name: Run SHOW commands tests (39 tests)
        working-directory: test/tap/tests/unit
        run: ./pgbouncer_show_commands_unit-t
