name: CI-no-infra-g1
run-name: '${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }} ${{ github.workflow }} ${{ github.event.workflow_run && github.event.workflow_run.head_sha || github.sha }} trigger=${{ github.event.workflow_run.id || github.run_id }}/${{ github.event.workflow_run.run_attempt || github.run_attempt }}'

on:
  workflow_dispatch:
    inputs:
      control_ref:
        type: string
        default: GH-Actions
        description: CI implementation ref for isolated validation
      producer_run_id:
        type: string
        default: ''
        description: Exact producer workflow run ID (manual tests)
      producer_attempt:
        type: string
        default: '1'
        description: Exact producer attempt (manual tests)
  workflow_run:
    workflows: [CI-trigger]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' || ! github.event.workflow_run }}
    # `write-all` is required for the callee's `use_oidc: true` Codecov
    # upload step to mint a GitHub OIDC token. Reusable-workflow
    # permissions are the intersection of caller + callee, so the
    # caller has to grant id-token:write (and everything else included
    # in write-all) for the callee's declaration to take effect. The
    # callee at ci-<group>.yml@GH-Actions also declares write-all.
    permissions: write-all
    uses: sysown/proxysql/.github/workflows/ci-no-infra-g1.yml@GH-Actions
    secrets: inherit
    with:
      trigger: ${{ toJson(github) }}
      consumer_id: run
      control_ref: ${{ inputs.control_ref || 'GH-Actions' }}
      producer_run_id: ${{ inputs.producer_run_id || '' }}
      producer_attempt: ${{ inputs.producer_attempt || '1' }}
