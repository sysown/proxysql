name: CI-dependency-artifacts-checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - deps/artifacts/**
      - deps/duckdb/**
      - deps/libssl/**
      - common_mk/openssl_flags.mk
      - deps/Makefile
      - Makefile
      - plugins/duckdb/Makefile
      - docker-compose.yml
      - test/infra/control/test_dependency_artifact_*.py
      - test/infra/control/dependency-artifacts-smoke.bash
      - .github/workflows/CI-dependency-artifacts*.yml
  push:
    branches: [v3.0]
    paths:
      - deps/artifacts/**
      - deps/duckdb/**
      - deps/libssl/**
      - common_mk/openssl_flags.mk
      - .github/workflows/CI-dependency-artifacts*.yml

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Artifact behavior and existing build contracts
        run: |
          python3 -m unittest discover -s test/infra/control -p 'test_dependency_artifact_*.py' -v
          python3 test/infra/control/test_duckdb_archives.py
          bash test/infra/control/test-duckdb-platform-archives.bash
          bash test/infra/control/test-vendored-openssl-build-contract.bash
          bash test/infra/control/test-vendored-openssl-consumers.bash
          bash -n deps/artifacts/prepare.bash deps/artifacts/build.bash test/infra/control/dependency-artifacts-smoke.bash

  source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dependency: [duckdb, openssl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source build and relocated runtime smoke without publication
        env:
          DEPENDENCY: ${{ matrix.dependency }}
        run: |
          python3 deps/artifacts/publish.py build --profile ubuntu24-amd64-gcc --dependency "$DEPENDENCY" \
            --output .cache/dependency-artifacts/publication --repository "$GITHUB_REPOSITORY" \
            --tag "dependency-artifacts-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
