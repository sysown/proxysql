name: CI-mariadb10-binlog-g1

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string

      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: '1'
env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:
  tier-context:
    uses: ./.github/workflows/ci-tier-context.yml
    with:
      trigger: ${{ inputs.trigger }}
      consumer_id: ${{ inputs.consumer_id }}
      control_ref: ${{ inputs.control_ref }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
    secrets: inherit
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # Writes a check run and mints an OIDC token for Codecov, so keep the token
    # bounded to exactly those operations rather than write-all.
    #
    # This job is reached through the workflow_run cascade, so `ref: ${{ env.SHA }}`
    # is PR-controlled and the steps below execute scripts from that checkout.
    # Combined with write-all and checkout's default credential persistence, a
    # test change in a PR could read a contents-write token out of the cloned
    # .git/config. Hence the narrow scopes plus `persist-credentials: false`,
    # matching ci-ai-gcov.yml.
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
      packages: read
    env:
      BLDCACHE: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}_ubuntu24-tap-genai-gcov_src
      MATRIX: '(mariadb10-binlog,genai-gcov)'

      SHA: ${{ needs.tier-context.outputs.sha }}
      CI_BINDING: ${{ needs.tier-context.outputs.binding }}
      CI_LEG: ${{ toJson(matrix) }}
      TIER: ${{ matrix.tier }}
      COVERAGE: ${{ matrix.coverage && '1' || '0' }}
    steps:
    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-context.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Start selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: proxysql
        # Do not leave the token in the cloned .git/config: the PR-controlled
        # checkout is used to run test scripts later in this job.
        persist-credentials: false
        sparse-checkout: |
          include
          lib
          src
          test/infra
          test/tap
          test/scripts

    - name: Restore selected product handoff
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py restore
    - name: Verify GCOV daemon binary
      run: |
        chmod +x proxysql/src/proxysql
        file proxysql/src/proxysql

    - name: Log in to GHCR and pull CI base image
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        for attempt in 1 2 3 4 5; do
          if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
            && docker pull ghcr.io/sysown/proxysql-ci-base:latest; then
            docker tag ghcr.io/sysown/proxysql-ci-base:latest proxysql-ci-base:latest
            exit 0
          fi
          sleep $((attempt * 10))
        done
        echo 'ERROR: unable to pull proxysql-ci-base after 5 attempts' >&2
        exit 1

    - name: Start MariaDB 10.11 binlog infrastructure
      run: |
        cd proxysql
        export INFRA_ID=ci-mariadb10-binlog-g1
        export TAP_GROUP=mariadb10-binlog-g1
        test/infra/control/ensure-infras.bash

    - name: Run MariaDB 10.11 binlog TAP tests with coverage
      timeout-minutes: 90
      run: |
        cd proxysql
        export INFRA_ID=ci-mariadb10-binlog-g1
        export TAP_GROUP=mariadb10-binlog-g1
        export COVERAGE="${COVERAGE}"
        test/infra/control/run-tests-isolated.bash

      if: ${{ matrix.coverage && (success()) }}
    - name: Cleanup
      if: always()
      run: |
        set +e
        [ -d proxysql ] || exit 0
        cd proxysql
        export INFRA_ID=ci-mariadb10-binlog-g1
        export TAP_GROUP=mariadb10-binlog-g1
        docker logs proxysql.ci-mariadb10-binlog-g1 2>&1 | tail -50 || true
        test/infra/control/stop-proxysql-isolated.bash || true
        test/infra/control/destroy-infras.bash || true

    - name: Fix artifact permissions
      if: ${{ failure() && !cancelled() }}
      run: |-
        sudo chmod -R a+rX proxysql/ci_*_logs/ 2>/dev/null || true


    - name: Archive failure logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-logs-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: proxysql/ci_*_logs/

    - name: Archive coverage report
      if: ${{ matrix.coverage && (!cancelled()) }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-coverage-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: proxysql/ci_infra_logs/ci-mariadb10-binlog-g1/coverage-report/
        if-no-files-found: ignore

    - name: Require non-empty binlog coverage LCOV
      id: require_lcov
      if: ${{ matrix.coverage && (always()) }}
      run: |-
        test -s proxysql/ci_infra_logs/ci-mariadb10-binlog-g1/coverage-report/ci-mariadb10-binlog-g1.info


    - name: Upload coverage to Codecov
      if: ${{ matrix.coverage && (always() && steps.require_lcov.outcome == 'success') }}
      continue-on-error: true
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        codecov_yml_path: ${{ github.workspace }}/proxysql/codecov.yml
        override_commit: ${{ env.SHA }}
        files: proxysql/ci_infra_logs/ci-mariadb10-binlog-g1/coverage-report/ci-mariadb10-binlog-g1.info
        flags: integration-tests
        name: tap-mariadb10-binlog-g1-coverage
        use_oidc: true
        disable_search: true
        plugins: noop
        root_dir: proxysql
        disable_file_fixes: true
        fail_ci_if_error: false
        verbose: true

    - name: Complete selected product test check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ always() }}
    needs:
    - tier-context
    name: ${{ matrix.check_name }}
    if: ${{ needs.tier-context.result == 'success' && fromJson(needs.tier-context.outputs.matrices)['tests'][0] != null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tier-context.outputs.matrices)['tests'] || fromJson('[{}]') }}
  tier-summary:
    needs:
    - tier-context
    - tests
    if: ${{ always() && needs.tier-context.result == 'success' }}
    uses: ./.github/workflows/ci-tier-summary.yml
    with:
      binding: ${{ needs.tier-context.outputs.binding }}
      control_ref: ${{ needs.tier-context.outputs.control_sha }}
    secrets: inherit
