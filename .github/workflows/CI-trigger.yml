name: CI-trigger
#run-name: '${{ github.ref_name }} ${{ github.workflow }} ${{ github.sha }}'
run-name: ${{ contains(github.event.pull_request.labels.*.name, 'ci:skip') && '[ci:skip] ' || '' }}${{ github.head_ref || github.ref_name }} ${{ github.workflow }} ${{ github.event.after || github.sha }}

on:
  pull_request:
    paths-ignore:
    - '.github/**'
    - '**.md' 
  push:
    branches:
    - 'v[0-9].[0-9x]+.?[0-9xy]?[0-9]?'
    paths-ignore:
    - '.github/**'
    - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') && (!github.event.pull_request || !github.event.pull_request.head.repo.fork) }}
    uses: sysown/proxysql/.github/workflows/ci-trigger.yml@GH-Actions
    secrets: inherit
