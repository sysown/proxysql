name: CI-unittests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      trigger:
        type: string

      consumer_id:
        type: string
        default: run
      control_ref:
        type: string
        default: GH-Actions
      producer_run_id:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: ''
env:
  SHA: ${{ inputs.trigger && fromJson(inputs.trigger).event.workflow_run.head_sha || github.sha }}

jobs:
  tier-context:
    uses: ./.github/workflows/ci-tier-context.yml
    with:
      trigger: ${{ inputs.trigger }}
      consumer_id: ${{ inputs.consumer_id }}
      control_ref: ${{ inputs.control_ref }}
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
      consumer_file: ci-unittests.yml
      consumer_inputs: ${{ toJson(inputs) }}
    secrets: inherit
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      actions: read
      checks: write
      contents: read
    env:
      MATRIX: '(unit-tests-g1)'

      SHA: ${{ needs.tier-context.outputs.sha }}
      CI_BINDING: ${{ needs.tier-context.outputs.binding }}
      CI_LEG: ${{ toJson(matrix) }}
      TIER: ${{ matrix.tier }}
      COVERAGE: ${{ matrix.coverage && '1' || '0' }}
    steps:

    - name: Checkout CI control
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: sysown/proxysql
        ref: ${{ needs.tier-context.outputs.control_sha }}
        path: ci-control
        persist-credentials: false
        sparse-checkout: .github
    - name: Start selected product test check
      timeout-minutes: 30
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: in_progress
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ env.SHA }}
        path: 'proxysql'
        sparse-checkout: |
          test/infra/control
          test/tap/groups
          test/scripts
          docker-compose.yml
          docker/images/proxysql/deb-compliant/ctl
          docker/images/proxysql/deb-compliant/entrypoint

    - name: Restore selected product handoff
      timeout-minutes: 30
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py restore
    - name: Verify binary
      run: |
        chmod +x proxysql/src/proxysql
        file proxysql/src/proxysql

    - name: Restore AWS IAM auth test helper
      run: |
        set -euo pipefail
        cd proxysql
        aws_iam_unit=test/tap/tests/unit/test_aws_iam_backend_auth-t
        aws_iam_staged=test/tap/tap/bin/aws_iam_mysql_server-t
        aws_iam_helper=test/deps/aws_iam_mysql_server/aws_iam_mysql_server-t
        if [ ! -x "${aws_iam_unit}" ]; then
          echo ">>> AWS IAM auth unit not present; no helper restore required"
          exit 0
        fi
        if [ ! -x "${aws_iam_staged}" ]; then
          echo "ERROR: ${aws_iam_unit} requires ${aws_iam_staged}, but the staged helper is missing or not executable" >&2
          exit 1
        fi
        aws_iam_before_sha256=$(sha256sum "${aws_iam_staged}" | awk '{print $1}')
        mkdir -p "$(dirname "${aws_iam_helper}")"
        cp -f "${aws_iam_staged}" "${aws_iam_helper}"
        chmod 0755 "${aws_iam_helper}"
        aws_iam_after_sha256=$(sha256sum "${aws_iam_helper}" | awk '{print $1}')
        echo ">>> Restored AWS IAM helper ${aws_iam_staged} -> ${aws_iam_helper}"
        echo ">>> staged sha256:   ${aws_iam_before_sha256}"
        echo ">>> restored sha256: ${aws_iam_after_sha256}"
        if [ "${aws_iam_before_sha256}" != "${aws_iam_after_sha256}" ]; then
          echo "ERROR: restored AWS IAM helper bytes differ from the staged helper" >&2
          exit 1
        fi

    - name: Run unit-tests-g1
      timeout-minutes: 90
      run: |
        cd proxysql
        export INFRA_ID="ci-unittests-${{ matrix.tier }}-${{ github.run_id }}"
        export TAP_GROUP="unit-tests-g1"
        docker compose run --rm \
          -e INFRA_ID="${INFRA_ID}" \
          -e TAP_GROUP="${TAP_GROUP}" \
          -e COVERAGE="${COVERAGE}" \
          -e ASAN_OPTIONS="${ASAN_OPTIONS:-}" \
          -e UNIT_TEST_TIMEOUT_SECONDS \
          -e TSAN_OPTIONS \
          --entrypoint bash \
          ubuntu24_dbg_build \
          -lc 'apt-get update -qq && apt-get install -y --no-install-recommends python3-packaging libprotobuf-dev default-mysql-client postgresql-client && command -v mysql && command -v psql && cd /opt/proxysql && test/infra/control/run-tests-isolated.bash'

    - name: Fix artifact permissions
      if: ${{ failure() && !cancelled() }}
      run: |
        # actions/upload-artifact dies with EACCES when it scandirs into
        # directories under ci_*_logs/ that were created inside docker
        # build containers (root-owned). Make everything readable by the
        # runner user before upload. sudo required because files are
        # root-owned; 2>/dev/null + || true because the path may not
        # exist on all failure paths (e.g. a cache-restore failure before
        # any test even runs).
        sudo chmod -R a+rX proxysql/ci_*_logs/ 2>/dev/null || true

    - name: Archive artifacts logs
      if: ${{ failure() && !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.workflow }}-${{ env.SHA }}-logs-run#${{ github.run_number }}-${{ matrix.check_key }}-attempt${{ github.run_attempt }}
        path: |
          proxysql/ci_*_logs/

    - name: Complete selected product test check
      timeout-minutes: 30
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_JSON: ${{ toJson(github) }}
        CHECK_KEY: ${{ matrix.check_key }}
        CHECK_STATUS: ${{ job.status }}
      run: |
        python3 ci-control/.github/scripts/ci_tier_runtime.py result
      if: ${{ always() }}
    needs:
    - tier-context
    name: ${{ matrix.check_name }}
    if: ${{ needs.tier-context.result == 'success' && fromJson(needs.tier-context.outputs.matrices)['tests'][0] != null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.tier-context.outputs.matrices)['tests'] || fromJson('[{}]') }}
  tier-summary:
    permissions:
      actions: read
      checks: write
      contents: read
    needs:
    - tier-context
    - tests
    if: ${{ always() && needs.tier-context.result == 'success' }}
    uses: ./.github/workflows/ci-tier-summary.yml
    with:
      binding: ${{ needs.tier-context.outputs.binding }}
      control_ref: ${{ needs.tier-context.outputs.control_sha }}
    secrets: inherit
