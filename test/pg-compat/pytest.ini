[pytest]
testpaths = tests
# -r xX: always surface xfailed/xpassed summary lines by default (discovery-
# phase reporting, spec sec 2.1) so an xpass -- a fix that closed a catalogued
# divergence in xfail.toml -- is never missed just because -rxX wasn't passed
# on the command line. Still overridable/augmentable via extra -r flags.
addopts = -rxX
