# docker-compose-mysqlx.yml
#
# Standalone MySQL 8.4 container for MySQL X Protocol E2E testing.
# Exposes both classic MySQL (3306) and X Protocol (33060) ports.
#
# Usage:
#   MYSQLX_E2E_PORT=33060 docker compose -f docker-compose-mysqlx.yml up -d
#
# Environment variables consumed by the E2E tests:
#   MYSQLX_E2E_HOST   (default: 127.0.0.1)
#   MYSQLX_E2E_PORT   (default: 33060)
#   MYSQLX_E2E_USER   (default: mysqlx_test)
#   MYSQLX_E2E_PASS   (default: mysqlx_test)

services:

  mysqlx-backend:
    hostname: mysqlx-backend
    image: mysql:8.4
    container_name: proxysql-mysqlx-e2e
    ports:
      - "13306:3306"
      - "33060:33060"
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=test
      - MYSQL_USER=mysqlx_test
      - MYSQL_PASSWORD=mysqlx_test
    command: >
      --mysql-native-password=ON
      --authentication-policy=mysql_native_password
      --bind-address=0.0.0.0
      --mysqlx-bind-address=0.0.0.0
      --max-connections=100
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
