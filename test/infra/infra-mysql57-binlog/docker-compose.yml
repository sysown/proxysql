services:

  mysql1:
#    image: mysql:5.7
    image: proxysql/ci-infra:mysql57-binlogreader
    hostname: mysql1.${INFRA}
    networks:
      - backend
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./conf/mysql/mysql1:/etc/mysql/conf.d
      - ./conf/mysql/ssl:/docker-entrypoint-initdb.d
      - ${INFRA_LOGS_PATH}/${INFRA}/mysql1:/var/log/mysql
      - ${INFRA_LOGS_PATH}/${INFRA}/reader1:/var/log/mysqlbinlog
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  mysql2:
#    image: mysql:5.7
    image: proxysql/ci-infra:mysql57-binlogreader
    hostname: mysql2.${INFRA}
    networks:
      - backend
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./conf/mysql/mysql2:/etc/mysql/conf.d
      - ./conf/mysql/ssl:/docker-entrypoint-initdb.d
      - ${INFRA_LOGS_PATH}/${INFRA}/mysql2:/var/log/mysql
      - ${INFRA_LOGS_PATH}/${INFRA}/reader2:/var/log/mysqlbinlog
    depends_on:
      - mysql1
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  mysql3:
#    image: mysql:5.7
