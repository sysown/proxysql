      - ${INFRA_LOGS_PATH}/${INFRA}/mysql3:/var/log/mysql
      - ${INFRA_LOGS_PATH}/${INFRA}/reader3:/var/log/mysqlbinlog
    depends_on:
      - mysql1
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576


