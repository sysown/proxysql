services:
  docker-hoster:
    image: dvdarias/docker-hoster
    hostname: docker-hoster.
    container_name: -docker-hoster-1
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock
    networks:
      backend:
        aliases:
          - docker-hoster.

networks:
  backend:
    name: "_backend"
    external: true
