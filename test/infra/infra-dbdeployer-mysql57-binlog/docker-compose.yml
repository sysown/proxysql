services:

  dbdeployer1:
    hostname: dbdeployer1.${INFRA}
    image: proxysql/ci-infra:dbdeployer-mysql57-binlog
    container_name: ${COMPOSE_PROJECT}-dbdeployer1-1
    environment:
      - ROOT_PASSWORD=${ROOT_PASSWORD}
      - INFRA=${INFRA}
    networks:
      backend:
        aliases:
          - dbdeployer1.${INFRA}
          - dbdeployer1.infra-dbdeployer-mysql57-binlog
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

networks:
  backend:
    name: "${INFRA_ID}_backend"
    external: true
