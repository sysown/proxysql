---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: ${INFRA}
spec:
  clusterIP: None
  selector:
    pod: clickhouse
  ports:
  - name: httpapi
    port: 8123
  - name: client
    port: 9000
---
apiVersion: v1
kind: Pod
metadata:
  name: clickhouse
  namespace: ${INFRA}
  labels:
    pod: clickhouse
spec:
  containers:
    - name: clickhouse
# dont use :latest for now, some tap tests need fixes
      image: clickhouse/clickhouse-server:22.5.1.2079
      env:
      - name: MYSQL_ROOT_PASSWORD
        value: 'root'
      ports:
      - containerPort: 8123
      - containerPort: 9000
      volumeMounts:
      - mountPath: /var/log/clickhouse-server
        name: clickhouse-logs
      securityContext:
        capabilities:
          add: ['SYS_NICE']

  dnsConfig:
    options:
    - name: timeout
      value: '2'
    - name: ndots
      value: '1'
    - name: single-request-reopen

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane

  volumes:
  - name: clickhouse-logs
    hostPath:
      path: ${INFRA_LOGS_PATH:-./logs}/${INFRA}/clickhouse
      type: DirectoryOrCreate
