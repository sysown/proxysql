services:

  mysql1:
    image: mysql:8.4
    hostname: mysql1.${INFRA}
    container_name: ${COMPOSE_PROJECT}-mysql1-1
    networks:
      backend:
        aliases:
          - mysql1.${INFRA}
          - mysql1.infra-mysql84-binlog
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ./conf/mysql/mysql1:/etc/mysql/conf.d
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/mysql1:/var/log/mysql
    cap_add:
      - SYS_NICE
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  mysql2:
    image: mysql:8.4
    hostname: mysql2.${INFRA}
    container_name: ${COMPOSE_PROJECT}-mysql2-1
    networks:
      backend:
        aliases:
          - mysql2.${INFRA}
          - mysql2.infra-mysql84-binlog
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ./conf/mysql/mysql2:/etc/mysql/conf.d
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/mysql2:/var/log/mysql
    depends_on:
      - mysql1
    cap_add:
      - SYS_NICE
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  mysql3:
    image: mysql:8.4
    hostname: mysql3.${INFRA}
    container_name: ${COMPOSE_PROJECT}-mysql3-1
    networks:
      backend:
        aliases:
          - mysql3.${INFRA}
          - mysql3.infra-mysql84-binlog
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ./conf/mysql/mysql3:/etc/mysql/conf.d
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/mysql3:/var/log/mysql
    depends_on:
      - mysql1
    cap_add:
      - SYS_NICE
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  reader1:
    image: proxysql/ci-infra:proxysql-mysqlbinlog-v2.3
    container_name: ${COMPOSE_PROJECT}-reader1-1
    environment:
      - MYSQL_HOST=127.0.0.1
      - BINLOG_READER_USER=root
      - BINLOG_READER_PASSWORD=${ROOT_PASSWORD}
      - LISTEN_PORT=6020
      - BINLOG_READER_START_DELAY=${BINLOG_READER_START_DELAY}
    command: >
      bash -c "sleep ${BINLOG_READER_START_DELAY};
      while true; do
        sleep 5;
        proxysql_binlog_reader -h \"$${MYSQL_HOST:-127.0.0.1}\" -u \"$${BINLOG_READER_USER:=root}\" -p \"$${BINLOG_READER_PASSWORD:-root}\" -P \"$${MYSQL_PORT:-3306}\" -l \"$${LISTEN_PORT:-6020}\" -f 2>&1 | tee -a /var/log/mysqlbinlog/error.log;
      done"
    volumes:
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/reader1:/var/log/mysqlbinlog
    network_mode: service:mysql1
    depends_on:
      - mysql1

  reader2:
    image: proxysql/ci-infra:proxysql-mysqlbinlog-v2.3
    container_name: ${COMPOSE_PROJECT}-reader2-1
    environment:
      - MYSQL_HOST=127.0.0.1
      - BINLOG_READER_USER=root
      - BINLOG_READER_PASSWORD=${ROOT_PASSWORD}
      - LISTEN_PORT=6020
      - BINLOG_READER_START_DELAY=${BINLOG_READER_START_DELAY}
    command: >
      bash -c "sleep ${BINLOG_READER_START_DELAY};
      while true; do
        sleep 5;
        proxysql_binlog_reader -h \"$${MYSQL_HOST:-127.0.0.1}\" -u \"$${BINLOG_READER_USER:=root}\" -p \"$${BINLOG_READER_PASSWORD:-root}\" -P \"$${MYSQL_PORT:-3306}\" -l \"$${LISTEN_PORT:-6020}\" -f 2>&1 | tee -a /var/log/mysqlbinlog/error.log;
      done"
    volumes:
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/reader2:/var/log/mysqlbinlog
    network_mode: service:mysql2
    depends_on:
      - mysql2

  reader3:
    image: proxysql/ci-infra:proxysql-mysqlbinlog-v2.3
    container_name: ${COMPOSE_PROJECT}-reader3-1
    environment:
      - MYSQL_HOST=127.0.0.1
      - BINLOG_READER_USER=root
      - BINLOG_READER_PASSWORD=${ROOT_PASSWORD}
      - LISTEN_PORT=6020
      - BINLOG_READER_START_DELAY=${BINLOG_READER_START_DELAY}
    command: >
      bash -c "sleep ${BINLOG_READER_START_DELAY};
      while true; do
        sleep 5;
        proxysql_binlog_reader -h \"$${MYSQL_HOST:-127.0.0.1}\" -u \"$${BINLOG_READER_USER:=root}\" -p \"$${BINLOG_READER_PASSWORD:-root}\" -P \"$${MYSQL_PORT:-3306}\" -l \"$${LISTEN_PORT:-6020}\" -f 2>&1 | tee -a /var/log/mysqlbinlog/error.log;
      done"
    volumes:
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/reader3:/var/log/mysqlbinlog
    network_mode: service:mysql3
    depends_on:
      - mysql3

  orc1:
    hostname: orc1.${INFRA}
    image: proxysql/ci-infra:percona-orchestrator
    container_name: ${COMPOSE_PROJECT}-orc1-1
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ./conf/orchestrator/orc1/orchestrator.conf.json:/etc/orchestrator.conf.json
      - ./conf/orchestrator/remove-proxysql-host.bash:/root/remove-proxysql-host.bash
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/orc1:/var/logs/orchestrator/
    depends_on:
      - mysql1
      - mysql2
      - mysql3
    networks:
      backend:
        aliases:
          - orc1.${INFRA}

  orc2:
    hostname: orc2.${INFRA}
    image: proxysql/ci-infra:percona-orchestrator
    container_name: ${COMPOSE_PROJECT}-orc2-1
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ./conf/orchestrator/orc2/orchestrator.conf.json:/etc/orchestrator.conf.json
      - ./conf/orchestrator/remove-proxysql-host.bash:/root/remove-proxysql-host.bash
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/orc2:/var/logs/orchestrator/
    depends_on:
      - mysql1
      - mysql2
      - mysql3
    networks:
      backend:
        aliases:
          - orc2.${INFRA}

  orc3:
    hostname: orc3.${INFRA}
    image: proxysql/ci-infra:percona-orchestrator
    container_name: ${COMPOSE_PROJECT}-orc3-1
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
    volumes:
      - ./conf/orchestrator/orc3/orchestrator.conf.json:/etc/orchestrator.conf.json
      - ./conf/orchestrator/remove-proxysql-host.bash:/root/remove-proxysql-host.bash
      - ${INFRA_LOGS_PATH}/${COMPOSE_PROJECT}/orc3:/var/logs/orchestrator/
    depends_on:
      - mysql1
      - mysql2
      - mysql3
    networks:
      backend:
        aliases:
          - orc3.${INFRA}

networks:
  backend:
    name: "${INFRA_ID}_backend"
    external: true
