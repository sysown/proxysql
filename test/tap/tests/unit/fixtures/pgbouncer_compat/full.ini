[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/postgresql

auth_type = md5
auth_file = userlist.txt

pool_mode = transaction
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
max_client_conn = 1000
max_db_connections = 100
max_user_connections = 50

server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 30
idle_transaction_timeout = 10
client_idle_timeout = 300

server_tls_sslmode = require
server_tls_ca_file = /etc/ssl/certs/ca.pem

log_connections = 1
log_disconnections = 1
verbose = 2
stats_period = 30

admin_users = admin
tcp_keepalive = 1
tcp_keepidle = 60

max_prepared_statements = 100

[databases]
prod = host=db1.example.com port=5432 dbname=production pool_size=20 pool_mode=session
multi = host=db1,db2,db3 dbname=shared load_balance_hosts=round-robin
authdb = host=authsrv.com dbname=postgres auth_user=authuser
withquery = host=db2.example.com connect_query='SET statement_timeout = 5000'
* = host=default.example.com

[users]
appuser = pool_mode=transaction pool_size=10 max_user_connections=50
admin = pool_mode=session max_user_connections=5
readonly = query_timeout=60 idle_transaction_timeout=30

[peers]
1 = host=pgbouncer1.example.com port=6432
2 = host=pgbouncer2.example.com port=6433 pool_size=3
