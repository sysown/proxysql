; Values exercising quote and inline-comment handling in the [pgbouncer] section.
[pgbouncer]
listen_port = 6432
auth_type = trust
; a quoted value keeps its spaces and its '#'
auth_query = 'SELECT usename, passwd FROM pg_shadow WHERE usename=$1 # not a comment'
; an unquoted value is truncated at the inline comment
logfile = /var/log/pgbouncer.log   # where the log goes
; a quoted value with a doubled quote inside
unix_socket_dir = 'A''B'
; a ';' comment after an unquoted value
pidfile = /var/run/pgbouncer.pid  ; the pid file

[databases]
mydb = host=127.0.0.1 port=5432
